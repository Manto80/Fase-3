@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Mono:wght@400;500&display=swap');
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#0b0d10; --surface:#15181d; --surface2:#1c2026; --border:rgba(255,255,255,0.08);
  --text:#EAEEF2; --muted:#8B929C; --accent:#F5503E;
  --disp:'Bricolage Grotesque',sans-serif; --body:'DM Sans',sans-serif; --mono:'DM Mono',monospace;
}
.app{font-family:var(--body);background:var(--bg);color:var(--text);min-height:100vh;max-width:520px;margin:0 auto;display:flex;flex-direction:column;position:relative;}
.scroll{flex:1;overflow-y:auto;padding:14px 14px 88px;padding-bottom:calc(96px + env(safe-area-inset-bottom));}
.view{display:flex;flex-direction:column;gap:14px;animation:fade .25s ease;}
@keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

.topbar{position:sticky;top:0;z-index:5;background:rgba(11,13,16,0.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:12px 14px;padding-top:calc(12px + env(safe-area-inset-top));padding-left:calc(14px + env(safe-area-inset-left));padding-right:calc(14px + env(safe-area-inset-right));}
.brand{display:flex;align-items:center;gap:10px;}
.brand-mark{font-family:var(--disp);font-weight:800;font-size:18px;background:var(--accent);color:#0b0d10;width:36px;height:36px;border-radius:9px;display:grid;place-items:center;letter-spacing:-1px;}
.brand-t{font-family:var(--disp);font-weight:800;font-size:17px;letter-spacing:1px;}
.brand-s{font-size:11px;color:var(--muted);letter-spacing:.3px;}

.sec-h{font-family:var(--disp);font-weight:800;font-size:24px;letter-spacing:-.5px;display:flex;align-items:center;gap:8px;}
.badge{font-family:var(--body);font-size:10px;font-weight:600;color:var(--accent);background:rgba(245,80,62,.12);padding:3px 8px;border-radius:20px;letter-spacing:.3px;}

.phase-card{background:var(--surface);border:1px solid var(--border);border-left-width:3px;border-radius:14px;padding:16px;}
.phase-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.phase-kind{font-size:10.5px;font-weight:700;letter-spacing:.8px;}
.phase-date{font-family:var(--mono);font-size:11px;color:var(--muted);}
.phase-name{font-family:var(--disp);font-weight:800;font-size:21px;letter-spacing:-.5px;}
.phase-sub{font-size:12.5px;color:var(--muted);margin-top:2px;}
.phase-note{font-size:12.5px;color:#b7bdc6;margin-top:10px;line-height:1.5;border-top:1px solid var(--border);padding-top:10px;}

.today-train{display:flex;justify-content:space-between;align-items:center;background:var(--surface);border:1px solid var(--border);border-left-width:3px;border-radius:14px;padding:14px 16px;color:var(--text);font-family:var(--body);cursor:pointer;text-align:left;}
.today-train span{font-size:12px;font-weight:700;letter-spacing:.4px;}
.tt-name{font-family:var(--disp);font-weight:700;font-size:16px;margin-top:3px;color:var(--text);letter-spacing:-.3px;}
.chev{font-size:22px;color:var(--muted);transition:transform .2s;}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;}
.stat-label{font-size:11px;color:var(--muted);letter-spacing:.3px;margin-bottom:6px;}
.stat-value{font-family:var(--disp);font-weight:800;font-size:30px;letter-spacing:-1px;line-height:1;}
.stat-unit{font-size:14px;font-weight:600;color:var(--muted);margin-left:2px;}

.quick{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;}
.quick-label{font-size:11.5px;color:var(--muted);margin-bottom:9px;letter-spacing:.3px;}
.quick-row{display:flex;gap:8px;}
.inp{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:11px 12px;color:var(--text);font-family:var(--body);font-size:15px;width:100%;outline:none;}
.inp:focus{border-color:var(--accent);}
.inp.grow{flex:1;font-family:var(--mono);font-size:14px;}
.inp.full{width:100%;margin-bottom:10px;}
.ta{min-height:62px;resize:vertical;font-family:var(--body);}
.btn{background:var(--accent);color:#0b0d10;border:none;border-radius:10px;padding:11px 18px;font-family:var(--body);font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap;}
.btn.full{width:100%;padding:13px;margin-top:4px;}
.btn:active{opacity:.8;}

.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;}
.card.danger{border-color:rgba(245,80,62,.3);}
.card.warn{border-color:rgba(242,179,61,.25);}
.card-title{font-family:var(--disp);font-weight:700;font-size:14px;color:#cfd4db;margin-bottom:11px;letter-spacing:-.2px;}
.card-note{font-size:11.5px;color:var(--muted);margin:-6px 0 10px;line-height:1.4;}

.t0grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.t0cell{display:flex;justify-content:space-between;font-size:12.5px;background:var(--surface2);padding:8px 10px;border-radius:8px;}
.t0cell span{color:var(--muted);}
.t0cell b{font-family:var(--mono);}
.obj{font-size:12px;color:var(--muted);line-height:1.5;text-align:center;padding:4px 10px;}

.block-pill{font-size:12.5px;color:var(--muted);background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:9px 13px;}
.block-pill b{color:var(--accent);}
.day-card{background:var(--surface);border:1px solid var(--border);border-left-width:3px;border-radius:14px;overflow:hidden;}
.day-head{width:100%;display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:none;border:none;color:var(--text);cursor:pointer;text-align:left;font-family:var(--body);}
.day-emo{font-size:13px;margin-right:7px;}
.day-name{font-family:var(--disp);font-weight:700;font-size:15px;letter-spacing:-.3px;}
.day-meta{font-size:11.5px;color:var(--muted);margin-top:3px;}
.ex-list{border-top:1px solid var(--border);}
.ex{border-bottom:1px solid var(--border);}
.ex:last-child{border-bottom:none;}
.ex-head{width:100%;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:11px 16px;background:none;border:none;color:var(--text);cursor:pointer;text-align:left;font-family:var(--body);}
.ex-name{font-size:13.5px;font-weight:600;line-height:1.3;}
.star{color:var(--accent);margin-right:5px;}
.ss{color:#9B8CFF;font-size:11px;margin-right:5px;font-weight:700;}
.ex-var{font-size:11px;color:#9B8CFF;margin-top:2px;}
.ex-target{font-size:11px;color:var(--muted);margin-top:3px;font-family:var(--mono);}
.ex-r{text-align:right;flex-shrink:0;}
.ex-last span{font-family:var(--mono);font-size:12px;color:#cfd4db;}
.ex-last small{display:block;font-size:10px;color:var(--muted);margin-top:2px;}
.ex-empty{color:#4a4f57;font-size:18px;}
.ex-body{padding:0 16px 14px;}
.ex-nota{font-size:11.5px;color:var(--muted);line-height:1.5;margin-bottom:10px;font-style:italic;}
.log-form{display:flex;gap:7px;margin-bottom:10px;}
.log-form .inp[type=date]{width:auto;flex-shrink:0;font-size:12px;padding:9px;font-family:var(--mono);color:var(--muted);}
.log-form .btn{padding:9px 15px;font-size:18px;}
.hist{display:flex;flex-direction:column;gap:1px;background:var(--surface2);border-radius:9px;overflow:hidden;}
.ali-h{font-size:13px;font-weight:700;color:#cfd4db;margin:22px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--border);letter-spacing:0.01em;}
.prog-hint{font-size:12.5px;line-height:1.45;padding:9px 11px;border-radius:9px;margin-bottom:10px;}
.prog-hint.up{background:rgba(67,197,158,0.14);color:#7fe6c4;border:1px solid rgba(67,197,158,0.3);}
.prog-hint.stay{background:rgba(242,179,61,0.12);color:#f2c879;border:1px solid rgba(242,179,61,0.25);}
.log-hint{font-size:11px;color:#7a818b;margin-top:6px;line-height:1.4;}
.alt-line{font-size:12.5px;color:#aeb4bd;line-height:1.5;margin-top:8px;}
.alt-line b{color:#cfd4db;}
.ov-flag{font-size:10.5px;color:#F2B33D;background:rgba(242,179,61,0.14);padding:2px 7px;border-radius:6px;margin-left:8px;font-weight:600;white-space:nowrap;}
.ov-toggle{background:var(--surface2);border:1px solid var(--border);color:var(--text);font-family:var(--body);font-size:13px;font-weight:600;padding:7px 14px;border-radius:9px;cursor:pointer;flex-shrink:0;}
.ov-summary{font-size:13px;color:var(--muted);margin-top:6px;}
.ov-body{margin-top:12px;border-top:1px solid var(--border);padding-top:12px;}
.ov-label{font-size:11px;text-transform:uppercase;letter-spacing:0.04em;color:#7a818b;margin:4px 0 7px;}
.ov-opts{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px;}
.ov-opt{flex:1;min-width:64px;background:var(--surface);border:1px solid var(--border);color:var(--text);font-family:var(--body);font-size:13px;padding:9px 6px;border-radius:9px;cursor:pointer;}
.ov-opt.on{background:rgba(245,80,62,0.16);border-color:var(--accent);color:#fff;font-weight:600;}
.ov-reset{width:100%;background:none;border:1px solid var(--border);color:var(--muted);font-family:var(--body);font-size:13px;padding:9px;border-radius:9px;cursor:pointer;margin-top:2px;}
.ov-note{font-size:11.5px;color:#7a818b;margin-top:10px;line-height:1.4;}
.hist-date{font-family:var(--mono);font-size:11px;color:var(--muted);width:52px;flex-shrink:0;}
.hist-serie{font-family:var(--mono);font-size:12.5px;flex:1;}
.logbtn{background:none;border:none;color:#7a818b;font-size:14px;cursor:pointer;padding:4px 6px;flex-shrink:0;}
.logbtn:active{color:var(--accent);}
.hist-edit{display:flex;align-items:center;gap:6px;padding:8px 11px;background:var(--surface2);}
.hist-edit .inp[type=date]{width:auto;flex-shrink:0;font-size:11px;padding:7px;font-family:var(--mono);color:var(--muted);}
.hist-edit .inp.grow{flex:1;font-family:var(--mono);font-size:12px;padding:7px 9px;}
.btn.mini{padding:7px 12px;font-size:14px;}
.hist-blk{font-size:9.5px;color:var(--muted);background:var(--surface2);padding:2px 6px;border-radius:5px;flex-shrink:0;}

.chart{width:100%;height:auto;margin-top:4px;}
.list-row{display:flex;align-items:center;gap:12px;padding:9px 2px;border-bottom:1px solid var(--border);}
.list-row:last-child{border-bottom:none;}
.lr-date{font-family:var(--mono);font-size:12px;color:var(--muted);flex:1;}
.lr-val{font-family:var(--mono);font-size:14px;font-weight:500;}
.del{background:none;border:none;color:#5a6068;font-size:13px;cursor:pointer;padding:4px 8px;}
.del:active{color:var(--accent);}

.fix-note{font-size:12px;color:#43C59E;background:rgba(67,197,158,.1);border:1px solid rgba(67,197,158,.2);border-radius:10px;padding:10px 13px;line-height:1.4;}
.mis-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.mis-cell{background:var(--surface2);border-radius:10px;padding:11px;position:relative;}
.mis-label{font-size:11px;color:var(--muted);margin-bottom:5px;}
.mis-val{font-family:var(--disp);font-weight:800;font-size:22px;letter-spacing:-.5px;}
.mis-val span{font-size:11px;color:var(--muted);font-weight:600;margin-left:2px;}
.mis-delta{position:absolute;top:11px;right:11px;font-family:var(--mono);font-size:12px;font-weight:500;}
.mform{display:flex;flex-direction:column;gap:8px;margin-bottom:12px;}
.mform-row{display:flex;align-items:center;gap:10px;}
.mform-row label{flex:1;font-size:13px;display:flex;flex-direction:column;}
.mform-row label small{font-size:10.5px;color:var(--muted);margin-top:1px;}
.mform-row .inp{width:96px;flex-shrink:0;text-align:right;font-family:var(--mono);}
.mis-hist{padding:11px 0;border-bottom:1px solid var(--border);}
.mis-hist:last-child{border-bottom:none;}
.mh-top{display:flex;justify-content:space-between;align-items:center;font-size:13px;}
.mh-vals{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:7px;font-size:11.5px;color:var(--muted);}
.mh-vals b{color:var(--text);font-family:var(--mono);}
.mh-note{font-size:11px;color:var(--muted);margin-top:6px;font-style:italic;line-height:1.4;}

.note-box{font-size:12.5px;color:#b7bdc6;line-height:1.55;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:13px;}
.note-box b{color:var(--text);}

.reftable{display:flex;flex-direction:column;font-size:12px;}
.rt-row{display:grid;column-gap:12px;gap:0 12px;padding:7px 0;border-bottom:1px solid var(--border);align-items:baseline;}
.rt-row:last-child{border-bottom:none;}
.rt-head .rt-cell{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;}
.rt-cell{line-height:1.3;}

.macros .macro-card{background:var(--surface);border:1px solid var(--border);border-left-width:3px;border-radius:13px;padding:13px;}
.mc-mode{font-size:12px;font-weight:700;display:flex;flex-direction:column;}
.mc-mode small{font-size:10px;color:var(--muted);font-weight:400;margin-top:1px;}
.mc-kcal{font-family:var(--disp);font-weight:800;font-size:27px;letter-spacing:-1px;margin:7px 0 5px;}
.mc-kcal span{font-size:11px;color:var(--muted);font-weight:600;margin-left:3px;}
.mc-macros{display:flex;gap:9px;font-family:var(--mono);font-size:11.5px;color:var(--muted);}
.pasto{padding:9px 0;border-bottom:1px solid var(--border);}
.pasto:last-child{border-bottom:none;}
.pasto-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:13px;}
.pasto-h span{font-family:var(--mono);font-size:11px;color:var(--accent);text-align:right;flex-shrink:0;}
.pasto-t{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.45;}

.tim-row{display:flex;gap:11px;padding:8px 0;border-bottom:1px solid var(--border);}
.tim-row:last-child{border-bottom:none;}
.tim-when{font-size:11.5px;color:var(--accent);width:108px;flex-shrink:0;font-weight:600;}
.tim-what{font-size:12px;color:#b7bdc6;line-height:1.45;}

.bullet{font-size:12.5px;color:#b7bdc6;line-height:1.5;padding:6px 0 6px 16px;position:relative;border-bottom:1px solid var(--border);}
.bullet:last-child{border-bottom:none;}
.bullet:before{content:"\u203A";position:absolute;left:2px;color:var(--accent);}

.gloss{padding:10px 0;border-bottom:1px solid var(--border);}
.gloss:last-child{border-bottom:none;}
.gloss b{font-family:var(--disp);font-weight:700;font-size:13.5px;color:var(--accent);display:block;margin-bottom:3px;}
.gloss span{font-size:12.5px;color:#b7bdc6;line-height:1.5;}

.menu-row{width:100%;display:flex;align-items:center;gap:13px;background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:15px 16px;color:var(--text);font-family:var(--body);font-size:14.5px;font-weight:500;cursor:pointer;text-align:left;}
.menu-emo{font-size:18px;}
.menu-row .chev{margin-left:auto;}
.back{display:inline-flex;align-items:center;gap:5px;background:var(--surface2);border:1px solid var(--border);color:var(--text);font-family:var(--body);font-size:14px;font-weight:600;cursor:pointer;padding:9px 16px;border-radius:10px;align-self:flex-start;}
.back:active{background:var(--surface);}
.back-arrow{font-size:20px;line-height:1;color:var(--accent);margin-top:-2px;}

.tabbar{position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:0 auto;background:rgba(13,16,20,0.92);backdrop-filter:blur(14px);border-top:1px solid var(--border);display:flex;padding:6px 4px 8px;padding-bottom:calc(8px + env(safe-area-inset-bottom));z-index:6;}
.tab{flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;color:var(--muted);cursor:pointer;font-family:var(--body);}
.tab-ic{font-size:18px;line-height:1;}
.tab-lbl{font-size:10px;letter-spacing:.2px;}
.tab.active{color:var(--accent);}

.supp-prog{font-family:var(--mono);font-size:11px;color:var(--muted);margin:-6px 0 8px;}
.supp{width:100%;display:flex;align-items:center;gap:11px;background:none;border:none;border-bottom:1px solid var(--border);padding:9px 0;cursor:pointer;text-align:left;font-family:var(--body);color:var(--text);}
.supp:last-child{border-bottom:none;}
.supp-box{width:22px;height:22px;border:1.5px solid var(--border);border-radius:7px;flex-shrink:0;display:grid;place-items:center;font-size:13px;color:#0b0d10;transition:all .15s;}
.supp.on .supp-box{background:#43C59E;border-color:#43C59E;}
.supp-txt{display:flex;flex-direction:column;}
.supp-txt b{font-size:13px;font-weight:600;}
.supp-txt small{font-size:11px;color:var(--muted);margin-top:1px;line-height:1.35;}
.supp.on .supp-txt b{color:var(--muted);text-decoration:line-through;}

.bk-area{font-family:var(--mono);font-size:10.5px;min-height:90px;color:var(--muted);margin-top:10px;}
.mod-tit{font-size:11.5px;font-weight:700;margin-bottom:6px;letter-spacing:.2px;line-height:1.3;}
.bk-msg{font-size:12px;color:#43C59E;margin-bottom:10px;}
.btn:disabled{opacity:.4;}
