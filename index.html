ella media della linea negli stessi sabati \u2192 \u22121 gradino, e niente salite finch\xE9 non torna sotto. Se peso e girovita dicono cose opposte, vince il girovita."]]},{h:0,sec:0,c:[["4"],["Peso, fuori di molto: t minore di 0,05 \u2192 +1; t maggiore di 0,35 \u2192 \u22121."]]},{h:0,sec:0,c:[["5"],["Peso, fuori corridoio: t da 0,05 a 0,09, oppure da 0,31 a 0,35, dallo stesso lato anche alla verifica prima \u2192 +1 (sotto) o \u22121 (sopra). La prima volta, niente."]]},{h:0,sec:0,c:[["5-bis"],["Solo il 17/1, dopo i punti 1-5 giudicati con il corridoio 0,10-0,30. La riga scatta se i punti 3-5 non hanno dato \u22121 e la media dei sabati 12/12, 19/12 e 16/1 \xE8 almeno 0,5 cm sotto la media della linea. Se scatta: +1 gradino (uno solo, anche se il punto 4 o 5 dava gi\xE0 +1; se sei a +3 resti a +3), che vale dal giorno dopo la conferma (dal luned\xEC 18/1 se confermi la domenica); e dalla verifica del 31/1 il corridoio diventa 0,20-0,35, anche se sei a +3. Se i punti 3-5 hanno dato \u22121, la riga non scatta e il corridoio resta 0,10-0,30. Con il corridoio nuovo: fuori di molto sotto 0,10 o sopra 0,40; fuori da 0,10 a 0,19 o da 0,36 a 0,40."]]},{h:0,sec:0,c:[["6"],['Al massimo un gradino per verifica. Vale dalla colazione del giorno dopo la conferma: se confermi la domenica, dal luned\xEC. Dopo un cambio (compresi partenza, 5-bis, ritorno del 7/1 e gradino scelto da te "da oggi in poi") il conteggio "due volte di fila" riparte da zero. Il 1/11 non conta come "verifica prima": il conteggio parte dal 15/11.']]},{h:0,sec:0,c:[["7"],["In automatico non si va sopra il +3 n\xE9 sotto il Mantenimento. Se servisse, mi mandi i dati della verifica e decidiamo. Anche la tua scelta va dal Mantenimento al +3: sono i gradini che hanno un menu."]]}]},{t:"h2",x:"Il freno"},{t:"p",r:["Si guarda ogni sabato, non solo alla verifica. Se la lettura di mezzo del girovita \xE8 98,0 o pi\xF9 in due sabati validi consecutivi (i sabati non validi si saltano, anche quelli delle feste: 19/12 e 16/1 sono consecutivi), l'app ti propone il Mantenimento: vale dal giorno dopo la conferma fino alla fine della costruzione. La scheda non cambia. Se scatta prima delle feste, resta anche dopo: il 7/1 non torni al gradino di prima. Se dopo il freno scegli tu un gradino pi\xF9 alto, da quel giorno in poi, il freno si riarma: due nuovi sabati validi a 98 o pi\xF9 dopo la tua scelta lo propongono di nuovo."]},{t:"h2",x:"Tre momenti speciali"},{t:"tab",w:[2300,7338],rows:[{h:1,sec:0,c:[[["Quando","b"]],[["Cosa si decide","b"]]]},{h:0,sec:0,c:[[["Dom 1/11 \xB7 partenza","b"]],["Sostituisce la verifica del Block 4 di quel giorno, che non si fa. Trend di 5 medie dal 28/9 al 1/11: la settimana di partenza e le 4 del Block 4. t minore di 0,05 \u2192 due gradini in su; da 0,05 a 0,09 \u2192 uno in su; da 0,10 a 0,30 \u2192 resti; maggiore di 0,30 \u2192 uno in gi\xF9. Si conta dal gradino del Block 4 che hai sabato 31/10: i gradini hanno gli stessi nomi e quasi le stesse calorie. \xC8 l'unica volta in cui si salgono due gradini. I cinque ritocchi del menu sono gi\xE0 nel Base."]]},{h:0,sec:0,c:[[["Dom 17/1 \xB7 0,25-0,3","b"]],["Riga 5-bis qui sopra. Vuol dire che cresci pulito e c'\xE8 spazio."]]},{h:0,sec:0,c:[[["Dom 31/1 \xB7 prolungamento","b"]],["Si prolunga al 14/3 solo se la media dei sabati 16, 23 e 30/1 non supera la base di pi\xF9 di 0,3 cm (girovita quasi fermo: con base 94,5 vuol dire 94,8) e il ginocchio \xE8 tranquillo: nelle ultime 4 settimane nessun dolore o gonfiore il giorno dopo e nessuna serie interrotta per il ginocchio. Altrimenti si chiude il 14/2: prolungare accorcerebbe la definizione e peggiorerebbe giugno."]]},{h:0,sec:0,c:[[["Dom 14/2","b"]],["Se non si prolunga: misure, foto, nessun cambio di gradino; i dati servono alla definizione. Se si prolunga: verifica normale (punti 1-7) con misure complete e foto; la fine \xE8 il 14/3."]]}]},{t:"h2",x:"Il calendario delle verifiche"},{t:"tab",w:[1400,2400,3700,2138],rows:[{h:1,sec:0,c:[[["Data","b"]],[["Cosa","b"]],[["Medie del peso usate","b"]],[["Sabati del girovita","b"]]]},{h:0,sec:0,c:[["Dom 1/11"],["Partenza: gradino della Fase 4"],["28/9-4/10 \xB7 5/10-11/10 \xB7 12/10-18/10 \xB7 19/10-25/10 \xB7 26/10-1/11"],["base della linea: 17, 24, 31/10"]]},{h:0,sec:0,c:[["Dom 15/11"],["Verifica \xB7 serie in pi\xF9 delle braccia (sezione 3)"],["12/10-18/10 \xB7 19/10-25/10 \xB7 26/10-1/11 \xB7 2/11-8/11 \xB7 9/11-15/11"],["31/10 \xB7 7/11 \xB7 14/11"]]},{h:0,sec:0,c:[["Dom 29/11"],["Verifica \xB7 tappa"],["26/10-1/11 \xB7 2/11-8/11 \xB7 9/11-15/11 \xB7 16/11-22/11 \xB7 23/11-29/11"],["14/11 \xB7 21/11 \xB7 28/11"]]},{h:0,sec:0,c:[["Dom 13/12"],["Verifica \xB7 bicipite (misura)"],["9/11-15/11 \xB7 16/11-22/11 \xB7 23/11-29/11 \xB7 30/11-6/12 \xB7 7/12-13/12"],["28/11 \xB7 5/12 \xB7 12/12"]]},{h:0,sec:0,c:[["Dom 17/1"],["Verifica \xB7 eventuale passaggio a 0,25-0,3"],["23/11-29/11 \xB7 30/11-6/12 \xB7 7/12-13/12 \xB7 14/12-20/12 \xB7 11/1-17/1"],["12/12 \xB7 19/12 \xB7 16/1"]]},{h:0,sec:0,c:[["Dom 31/1"],["Verifica \xB7 tappa \xB7 prolungamento"],["7/12-13/12 \xB7 14/12-20/12 \xB7 11/1-17/1 \xB7 18/1-24/1 \xB7 25/1-31/1"],["16/1 \xB7 23/1 \xB7 30/1"]]},{h:0,sec:0,c:[["Dom 14/2"],["Fine della costruzione"],["11/1-17/1 \xB7 18/1-24/1 \xB7 25/1-31/1 \xB7 1/2-7/2 \xB7 8/2-14/2"],["30/1 \xB7 6/2 \xB7 13/2"]]},{h:0,sec:0,c:[["Dom 28/2"],["Solo se si prolunga"],["25/1-31/1 \xB7 1/2-7/2 \xB7 8/2-14/2 \xB7 15/2-21/2 \xB7 22/2-28/2"],["13/2 \xB7 20/2 \xB7 27/2"]]},{h:0,sec:0,c:[["Dom 14/3"],["Solo se si prolunga: fine"],["8/2-14/2 \xB7 15/2-21/2 \xB7 22/2-28/2 \xB7 1/3-7/3 \xB7 8/3-14/3"],["27/2 \xB7 6/3 \xB7 13/3"]]}]},{t:"sm",r:[["Sono le settimane e i sabati previsti se sono tutti validi; se uno non lo \xE8, si prende quello valido prima. Le settimane delle feste (21/12 \u2192 10/1) non entrano: per questo il 17/1 e il 31/1 usano settimane di dicembre.","i"]]},{t:"h2",x:"Il gradino scelto da te"},{t:"li",r:[["Due tasti: ","b"],"nella card del menu scegli un gradino e poi Solo oggi o Da oggi in poi (tua decisione del 27/10). Il selettore mostra le kcal di quella giornata a ogni gradino e ti dice quando un gradino \xE8 uguale al Base, oggi."]},{t:"li",r:[["Solo oggi: ","b"],"cambia il menu di quel giorno; il gradino del programma resta, la verifica parte da quello e non lo conta come cambio. Nella verifica una riga ti dice quanti giorni hai scelto e quante kcal in pi\xF9 o in meno al giorno, in media, nelle settimane del trend."]},{t:"li",r:[["Da oggi in poi: ","b"],"\xE8 il gradino del programma da quel giorno, compreso; la verifica dopo parte da l\xEC e lo conta come un cambio (punto 6). Si annulla in Manuale \u2192 Decisioni, come le altre."]},{t:"li",r:[["Il resto non cambia: ","b"],"il trend contiene quello che hai mangiato; il corridoio non dipende dal gradino. Nelle feste, una scelta fatta prima delle feste segue le loro regole (sopra il Base si mangia al Base, il 7/1 si torna l\xEC); una scelta fatta dentro le feste vale com'\xE8. Se il girovita \xE8 sopra la linea o il freno \xE8 confermato, l'app te lo ricorda; decidi tu."]},{t:"h2",x:"Tappe e bicipite"},{t:"li",r:[["Tappe del 29/11 e del 31/1: ","b"],'misure complete e foto. Si guardano due cose: la somma di spalle, petto e bicipite contro il 4/10 (almeno +1 cm il 29/11, almeno +2 cm il 31/1); e i tre key lift, prima serie di lavoro contro la prima seduta della Fase 4: almeno 2 su 3 in salita. "In salita" = pi\xF9 peso restando nel range, oppure stesso peso con pi\xF9 ripetizioni.']},{t:"li",r:[["A cosa servono: ","b"],"a vedere se la crescita va nei punti giusti. Da sole non cambiano niente: i cambi li fanno le regole di questa sezione e della sezione 3. Il 31/1 entrano nella decisione sul prolungamento solo come informazione."]},{t:"li",r:[["Bicipite del 6/12 e del 13/12: ","b"],`misurato come il 1/11, 3 letture ogni volta, media delle due domeniche. \xC8 un controllo: da solo non decide niente, perch\xE9 0,5 cm stanno dentro l'errore del metro. Il cambio dell'hammer della seduta Sabato (dalla settimana 14-20/12) lo decidono i carichi (sezione 3, "Bicipite").`]},{t:"h1",x:"9. Esami e medico"},{t:"h2",x:"Il prelievo di marted\xEC 3/11"},{t:"tab",w:[2600,7038],rows:[{h:1,sec:0,c:[[["Quando","b"]],[["Cosa","b"]]]},{h:0,sec:0,c:[["Sabato 31/10"],["Ultima seduta di gambe: il prelievo cade circa 72 ore dopo, come serve."]]},{h:0,sec:0,c:[["Domenica 1/11 e luned\xEC 2/11"],["Niente alcol nelle 48 ore prima."]]},{h:0,sec:0,c:[["Luned\xEC 2/11"],["Niente ferro e niente vitamina C. Collagene s\xEC, come sempre dopo lo spuntino: la vitamina C e lo zinco che contiene sono dosi da cibo (circa 12 mg e 1,5 mg). Cena normale entro le 21, senza carne in pi\xF9. La sera creatina s\xEC (lo dici al medico), magnesio no: il giorno dopo lo misurano. Da confermare con il medico."]]},{h:0,sec:0,c:[["Marted\xEC 3/11, prima del prelievo"],["A digiuno da almeno 10 ore: solo acqua, niente caff\xE8, niente integratori. Prelievo tra le 7 e le 10."]]},{h:0,sec:0,c:[["Da dire al medico"],["Data dell'ultima donazione; tutti gli integratori con le dosi; che prendi creatina (alza un po' la creatinina)."]]},{h:0,sec:0,c:[["Dopo il prelievo"],["Ferro + vitamina C; 60 minuti dopo la colazione del giorno ON con la D3. Se la colazione \xE8 dopo le 10, il pranzo almeno 2 ore dopo, quando puoi. Poi giornata ON normale e seduta la sera."]]}]},{t:"h2",x:"Cosa si chiede"},{t:"li",r:[["Gi\xE0 previsti: ","b"],"ferritina, emocromo, testosterone totale e SHBG, vitamina D, zinco, magnesio."]},{t:"li",r:[["Da proporre al medico: ","b"],"per il ferro PCR, sideremia, transferrina e saturazione (la ferritina da sola si legge male); albumina, per calcolare il testosterone libero; per i mesi di surplus HbA1c, profilo lipidico, ALT, AST, GGT; creatinina con eGFR; CK, che aiuta a leggere ALT e AST dopo l'allenamento; Lp(a) una volta nella vita; TSH se il medico lo ritiene utile. Le sigle sono nel glossario."]},{t:"li",r:[["Come leggerli: ","b"],"con 5-6 ore di sonno il testosterone pu\xF2 risultare basso. Se \xE8 sotto il limite del laboratorio, o il medico lo giudica basso, lo si ripete quando dice il medico, al mattino a digiuno, dopo una settimana con almeno 6,5 ore di sonno, prima di trarre conclusioni. Magnesio e zinco nel sangue dicono poco sulle riserve."]},{t:"h2",x:"Dopo gli esami"},{t:"li",r:[["Fino al parere del medico ","b"],"non cambia niente: ferro 30 mg e D3 2.000 UI come adesso."]},{t:"li",r:[["Quando il medico decide, ","b"],"mi mandi i valori e le sue indicazioni: aggiorno integratori e app. Nient'altro del programma cambia per gli esami."]},{t:"li",r:[["Donazioni di sangue: ","b"],"riprendono solo con il via del medico, dopo la ferritina del 3/11. Quando doni: regole nella sezione 10."]},{t:"h1",x:"10. Imprevisti"},{t:"tab",w:[2e3,2900,2500,2238],rows:[{h:1,sec:0,c:[[["Situazione","b"]],[["Palestra","b"]],[["Cibo e integratori","b"]],[["Dati","b"]]]},{h:0,sec:0,c:[["Seduta saltata o spostata"],[`La puoi fare in un altro giorno: l'app ti dice se rispetta i recuperi (sezione 3, "Sedute in altri giorni"). Se fino a domenica non c'\xE8 un momento che rispetta i recuperi e in cui la seduta conta, il consiglio \xE8 saltarla e la settimana prosegue; decidi tu (sezione 3, "Avvisi").`],['Il giorno senza seduta \xE8 un giorno OFF (il sabato con il pasto libero la sera); il giorno in cui la fai segue la seduta (sezione 2, "Se la seduta cambia giorno", anche per due sedute nello stesso giorno; sezione 4, "Che giornata \xE8"). Se la seduta salta quando hai gi\xE0 mangiato colazione o pranzo, da l\xEC i pasti del giorno OFF.'],["Girovita del sabato come sempre."]]},{h:0,sec:0,c:[[["Notte sotto le 5 ore prima di una seduta","b"]],["Consiglio: seduta regolare, ma nessun aumento di carico. Dopo 3 notti di fila sotto le 5 ore: una serie in meno per esercizio alla seduta successiva."],["Normale."],["La seduta non conta per gli allarmi."]]},{h:0,sec:0,c:[[["Malattia, influenza","b"]],["\u2605 Consiglio: niente palestra con la febbre o con sintomi sotto il collo (petto, stomaco, dolori diffusi). Si riprende quando sono passate 24 ore senza febbre senza aver preso antipiretici (paracetamolo, ibuprofene) e i sintomi sotto il collo sono passati. Nella settimana di ripresa: stessi carichi, 3-4 dal limite, come nello scarico. Sedute di ripresa: la prima di ciascuna seduta (Marted\xEC, Gioved\xEC, Sabato) dopo la malattia, con una serie in meno per esercizio. Fermo pi\xF9 di 7 giorni: la prima settimana di ripresa le serie dello scarico (met\xE0, arrotondata per eccesso), la seconda tutte le serie a 2-3 dal limite, poi tutto normale. Se nella ripresa fai come da scheda e sali di peso, la seduta dopo parte da quel peso."],["Menu OFF finch\xE9 non ti alleni; proteine per prime, senza forzarti. Integratori uguali."],["Pesate segnate ma fuori dalle medie (giorni di malattia e 3 dopo); girovita escluso; le sedute di ripresa e una seduta fatta in un giorno segnato malato non contano per gli allarmi."]]},{h:0,sec:0,c:[[["Donazione di sangue","b"]],["Solo con il via del medico. \u2605 Consiglio: quel giorno niente palestra; alla seduta dopo una serie in meno per esercizio."],[`Senza seduta, giorno OFF; se ti alleni lo stesso, la giornata segue la seduta (sezione 4, "Che giornata \xE8"). In tutti e due i casi 500 ml d'acqua in pi\xF9.`],["Pesate fuori dalle medie quel giorno e i 2 dopo. Una seduta fatta il giorno della donazione non conta per gli allarmi, come quella dopo."]]},{h:0,sec:0,c:[[["Ristorante, cena fuori, trasferta","b"]],['Le sedute perse in trasferta si possono fare al ritorno, con gli avvisi di recupero (sezione 3, "Sedute in altri giorni").'],['Sezione 4, "Pasto libero, fuori casa".'],["Niente pesate fuori casa; girovita escluso se la sera prima eri fuori."]]},{h:0,sec:0,c:[[["Macchina occupata","b"]],["Aspetti fino a 3-4 minuti, poi fai l'esercizio dopo e torni. Le superserie restano insieme. Mai lo stesso muscolo due volte di fila. Seduta Gioved\xEC con i cavi occupati: fai prima le scrollate e torni ai cavi."],["\u2014"],["\u2014"]]},{h:0,sec:0,c:[[["Dolore","b"]],['Sezione 3, "Ginocchio, schiena e gomito".'],["\u2014"],["Lo segni nell'app."]]},{h:0,sec:0,c:[[["Pickleball, se capita","b"]],["Consiglio: non il giorno dopo una seduta Marted\xEC o Sabato. Se il ginocchio peggiora dopo una partita, niente per 2 settimane."],["Menu OFF invariato."],["\u2014"]]},{h:0,sec:0,c:[[["Pesata alta isolata","b"]],["Niente: succede dopo la pizza o le gambe."],["Niente."],["Decide il trend, non la singola pesata."]]}]},{t:"p",r:[["Se una macchina \xE8 rotta","b"]]},{t:"sm",r:[["Se il sostituto \xE8 un esercizio di un'altra seduta della settimana (distensioni al posto della Chest Press, pull-down a braccia tese al posto del Lat, Vertical Row al posto del Pulley), quell'esercizio non conta per gli allarmi nella sua seduta successiva.","i"]]},{t:"sm",r:[["La seduta si registra sotto l'esercizio sostituto e non conta per gli allarmi dell'esercizio sostituito. Peso del sostituto: per le distensioni al posto della Chest Press, un manubrio sopra quello della seduta Gioved\xEC; per gli altri, il peso con cui hai fatto quell'esercizio l'ultima volta.","i"]]},{t:"tab",w:[3300,6338],rows:[{h:1,sec:0,c:[[["Macchina","b"]],[["Al suo posto (solo esercizi che hai gi\xE0 fatto)","b"]]]},{h:0,sec:0,c:[["Chest Press inclinata"],["Distensioni inclinate con manubri, con serie e range della Chest Press."]]},{h:0,sec:0,c:[["Pec Deck"],["Croci ai cavi dal basso."]]},{h:0,sec:0,c:[["Lat Machine"],["Pull-down a braccia tese, 4 serie da 12-15."]]},{h:0,sec:0,c:[["Vertical Row \xB7 Pulley"],["L'una al posto dell'altra, con le serie che l'esercizio sostituito ha quel giorno, e con il range e il peso dell'esercizio che fai (Vertical Row 8-10, Pulley 10-12)."]]},{h:0,sec:0,c:[["Stazione cavi"],["Croci \u2192 Pec Deck; curl al cavo \u2192 curl con manubri; push-down e overhead \u2192 overhead con un manubrio; reverse curl: se l'attrezzo \xE8 occupato oltre 3-4 minuti, fai l'altro (EZ \u2194 barra dritta al cavo): si registra sotto il sostituto e non conta per il reverse curl; se sono occupati tutti e due, lo salti. Face Pull e pull-down a braccia tese: si saltano."]]},{h:0,sec:0,c:[["Leg Press"],["Nessun sostituto, per il ginocchio: si salta la pressa, il resto della seduta si fa. Squat (anche al Multipower) e Leg Extension restano vietati dall'ortopedico."]]},{h:0,sec:0,c:[["Shoulder Press, Leg Curl, Adductor, Abductor"],["Si saltano."]]}]},{t:"h1",x:"11. Fine della costruzione e dopo"},{t:"li",r:[["Domenica 14/2: ","b"],"ultima verifica, misure complete e foto. Da luned\xEC 15/2 parte la definizione: il programma (menu, deficit, scheda, verifiche) te lo consegno entro domenica 31/1, rivisto dai revisori, con l'app aggiornata entro domenica 7/2."]},{t:"li",r:[["Se il 31/1 si prolunga: ","b"],"settimane 16-19 con la stessa scheda a volume pieno, senza un altro scarico; la linea del girovita resta ferma a 98 e il freno vale fino al 14/3; verifiche normali il 14/2 (con misure e foto) e il 28/2, fine il 14/3 con misure e foto; definizione dal 15/3 al 30/5, 11 settimane senza margine. Il programma della definizione arriva entro il 28/2."]},{t:"li",r:[["Giugno, sulla carta: ","b"],"girovita 90-93 cm a circa 76-77 kg; spalle e braccia cresciute, girovita pi\xF9 basso di oggi. La forbice dipende da quanto girovita perdi per ogni kg in definizione (1-1,5 cm): lo sapremo solo facendola. Il 15% che ti piacerebbe vuol dire circa 88 cm."]},{t:"li",r:[["Dopo giugno, per adesso: ","b"],`Fase 5 in estate, mantenimento dal 14/6 a fine agosto. Fase 6, seconda costruzione da settembre 2027 a febbraio 2028. Seconda definizione nella primavera 2028, verso il 12% di grasso (circa 84 cm), cio\xE8 l'addome del tuo "super traguardo". Lo ripensiamo strada facendo; la Fase 5 si progetta a maggio 2027.`]},{t:"h1",x:"12. Cosa cambia rispetto ai documenti precedenti"},{t:"p",r:["Versione 1.9 (21 e 27/10), le tue decisioni:"]},{t:"li",r:[["Sedute in qualunque giorno, ","b"],'con gli avvisi di recupero e le finestre per gli allarmi (sezione 3, "Sedute in altri giorni"). Lo storico resta per seduta.']},{t:"li",r:[["Regole di allenamento come avvisi, ","b"],'con due tasti: Applica il consiglio o Faccio come da scheda (sezione 3, "Avvisi").']},{t:"li",r:[["Niente rampa: ","b"],`la scheda piena dal 3/11, con i carichi del Block 4 e l'intensit\xE0 di "Quanto spingere" da subito. Non accolte (27/10): la settimana 1 a 2 dal limite e la monopodalica a 2 dal limite.`]},{t:"li",r:[['"Se devi chiudere prima" ',"b"],"in fondo a ogni seduta; ",["registro del gomito ","b"],"anche dopo la seduta Gioved\xEC nelle settimane 1-3."]},{t:"li",r:[["Due serie in pi\xF9 per le braccia ","b"],"dalla settimana 3 (16-22/11), se le prime due settimane sono pulite (curl al cavo del Gioved\xEC e hammer del Sabato da 3 a 4)."]},{t:"li",r:[["Menu e integratori per seduta e momento, ","b"],"con la regola della cena grande che tiene la settimana uguale; ",["gradino scelto da te ","b"],"nel menu (solo oggi o da oggi in poi). Banana piccola prima dei pesi, non durante (27/10 sera: durante la seduta non riesci a mangiarla): \xE8 la stessa banana, giornate e settimana restano uguali."]},{t:"li",r:[`Non accolte (27/10): punti nuovi e avvisi precoci del gomito, regola nuova del reverse curl all'EZ e segnale della rottura del tendine del bicipite nella lista Stop ("ti dico io e valutiamo"); il girovita non valido dopo una seduta il venerd\xEC sera (resta valido).`]},{t:"li",r:[["Corretti: ","b"],"grassi della giornata ON 71 g, non 72; tra la seduta Gioved\xEC e la seduta Sabato ci sono circa 37 ore e mezza da inizio a inizio; un Sabato dopo un Gioved\xEC saltato non conta pi\xF9 per i confronti (dava un falso segnale delle 36 ore)."]},{t:"li",r:['Errore mio: nella prima bozza della 1.9 la tabella delle settimane nel PDF era tagliata, come la tabella dei gradini della v3.1 (sezione 13, "Controllo del 27/10").']},{t:"p",r:["Versioni da 1.1 a 1.8, rispetto ai documenti v3.1 (storico, vale come allora):"]},{t:"p",r:[["Errori miei, detti chiari:","b"]]},{t:"li",r:[["Tabella dei gradini: ","b"],"nel PDF dell'Alimentazione v3.1 si vedeva solo la riga +3. Le altre righe erano nel file Word ma si perdevano nella pagina, e nel controllo visivo non l'ho visto. Ora ogni documento passa un controllo automatico che confronta riga per riga il Word con il PDF."]},{t:"li",r:[["Collagene nei giorni OFF: ","b"],"nella v3.1 era sparito senza che fosse una decisione. Torna come lo prendi tu, dopo lo spuntino del pomeriggio: circa 30 kcal in pi\xF9 di media al giorno."]},{t:"li",r:[["Freno: ","b"],"la Struttura v3.1 diceva ancora 97 con una sola misura. Vale 98, con due sabati di fila."]},{t:"li",r:[["Linea del girovita: ","b"],"la v3.1 contava 14,7 settimane, ma la linea parte dalla base di ottobre: sono 15, dal 31/10 al 13/2. La pendenza con base 94,5 \xE8 +0,93 ogni 4 settimane, non +0,95."]},{t:"li",r:[["Revisori: ","b"],"nessuno dei brief chiedeva se i documenti si potessero seguire senza domande. Da ora \xE8 la prima cosa che controllano."]},{t:"p",r:[["Corretti dopo la seconda revisione (su questo documento):","b"]]},{t:"li",r:[["Stesso cibo, due valori: ","b"],"le verdure valevano 30 kcal a cena e 40 a pranzo (e 40 nella cena OFF), la mela 80 a colazione e 85 nello spuntino, il pollo 128,6 kcal per 100 g a pranzo e 130 a cena, il burro di arachidi e l'arancia avevano proteine e carboidrati diversi tra menu e varianti. Ora un solo valore ovunque (verdure 30 kcal, mela 80, pollo 130 per 100 g). I totali diventano: marted\xEC 2.733, gioved\xEC 2.643, giorno OFF 2.429, sabato 1.674, domenica di allenamento 2.306 kcal; la media della settimana 2.593 (nella versione 1: 2.741, 2.651, 2.452, 1.682, 2.324 e 2.610). Le differenze tra i gradini non cambiano."]},{t:"li",r:[["Prolungamento: ","b"],'la soglia "94,8" valeva solo con una base di 94,5. Ora \xE8 "base + 0,3 cm", che con 94,5 d\xE0 lo stesso 94,8.']},{t:"li",r:[["Gioved\xEC: ","b"],"89 + 7 fa 96, non 95; e il +7 mancava nelle durate di rampa e scarico (allora 89 e 72)."]},{t:"li",r:[["Spuntino OFF dal \u22121: ","b"],"i fiocchi di latte erano 200 g, il 12% di calorie in pi\xF9: ora 180 g."]},{t:"li",r:[["Effetto dei gradini: ","b"],"non 0,05-0,07 per tutti: da 0,045 a 0,07, e tra \u22122 e Mantenimento circa 0,13."]},{t:"li",r:[["Due regole diverse sul richiamo delle alzate, ","b"],'un rimando alla "sezione 6" che era il sonno, il freno che il 7/1 sarebbe tornato indietro, il pickleball "il mercoled\xEC" che \xE8 il giorno dopo le gambe del marted\xEC, la frase iniziale che dava per fatta una revisione ancora in corso.']},{t:"li",r:[["Precisazioni: ","b"],"il 1/11 sostituisce la verifica del Block 4; sabato mattina con l'ora del ferro e 60 minuti prima di whey e caff\xE8; il 17/1 dentro l'ordine dei controlli; dolore al ginocchio con il calf, il peso della seduta dopo e niente aumenti; feste con alcol, pizza e Santo Stefano; il 14/2 con e senza prolungamento; regole precise per l'app (appendice)."]},{t:"p",r:[["Corretti dopo la revisione da preparatore (17/10, sulla parte di allenamento):","b"]]},{t:"li",r:[["Ginocchio: ","b"],"gonfiore e voto 4 o pi\xF9 tornano a voler dire niente pressa finch\xE9 non passa, come nel Protocollo Guardia della Fase 3; blocco, cedimento e gonfiore entro poche ore portano dall'ortopedico; i fastidi che tornano ogni settimana riducono la pressa del sabato; dopo un dolore durante la serie si riparte con un salto in meno. Errore mio: nella 1.2 avevo indebolito la regola senza un dato."]},{t:"li",r:[["Allarmi di fatica: ","b"],`con le tue 5-6 ore abituali la soglia "sonno sotto 6 ore" rimandava gli allarmi all'infinito; ora conta un calo rispetto alla tua media. Il \u221210% si arrotonda al salto pi\xF9 vicino (prima diventava \u221215/\u221220%). Il miglioramento si misura contro la migliore delle ultime 3 sedute. Con il volume troppo alto si fa subito una settimana di scarico e si tagliano 4 serie insieme, non una alla volta.`]},{t:"li",r:[["Range pi\xF9 basso: ","b"],"non vale per monopodalica e pressa a piedi alti, oltre che per i key lift: pi\xF9 peso per ripetizione carica di pi\xF9 il menisco."]},{t:"li",r:[["Durate: ","b"],"il marted\xEC era sottostimato (circa 115 minuti, non 107). Con la Vertical Row al sabato: marted\xEC circa 107, gioved\xEC circa 91, sabato circa 110 (117 dalla 1.7, con il reverse curl)."]},{t:"li",r:[["Altro: ","b"],`Vertical Row subito dopo la pressa piedi bassi, con una serie leggera, e ridotta a 2 serie invece del \u221210% se si ferma; riscaldamento del ginocchio subito prima della monopodalica e serie leggera prima dei piedi alti; calf fermo anche lui con il gonfiore; ripresa dopo un dolore alla prima serie; allarmi che ripartono da zero dopo un cambio di peso imposto da una regola; alzate sempre nella stessa posizione; al tetto del range ti fermi; peso nuovo che resta sotto il fondo; scarico e ripresa senza "sotto il range"; ripresa dopo l'influenza senza antipiretici; donazione che rimanda gli allarmi per 4 settimane; bicipite misurato due volte, e hammer del marted\xEC a 4 serie se cambia quello del sabato; riferimento visivo per i 90\xB0 perch\xE9 la pressa non ha fermi; ore tra le sedute (circa 82 e 85, non 84).`]},{t:"p",r:[["Corretti dopo la lettura finale (17/10, sulla versione 1.4):","b"]]},{t:"li",r:[['"Migliore": ',"b"],`nella 1.4 contava solo il peso della serie 1 e poi le ripetizioni totali. Nel salto grande la serie 1 resta allo stesso peso mentre le altre salgono una alla volta, e il totale delle ripetizioni non cresce: alla quarta seduta scattava "esercizio fermo" e il \u221210% mentre seguivi la regola (Lat, pressa, alzate, richiamo, croci, cavi). Ora i pesi si confrontano serie per serie. L'errore l'ho introdotto io nella 1.4, riprendendo una proposta della verifica senza simularla sul salto grande.`]},{t:"li",r:[["Base del confronto: ","b"],"la prima seduta dopo un cambio, o dal 3/11, non aveva niente da battere. Ora fa da base e non conta come ferma; gli allarmi partono dal 3/11, senza le sedute del Block 4."]},{t:"li",r:[["Croci e Vertical Row gi\xE0 ridotte: ","b"],'dopo "Volume troppo alto" la Vertical Row \xE8 gi\xE0 a 2 serie, e "Vertical Row a 2" non cambiava niente. Ora, se le serie sono gi\xE0 ridotte, si fa il \u221210% come gli altri; dal terzo stallo \u221210% anche per croci e Vertical Row.']},{t:"li",r:[["Appendice allineata: ","b"],`l'esercizio di un'altra seduta usato come sostituto non conta nella sua seduta successiva, non solo "il gioved\xEC dopo"; con il dolore alla prima serie le sedute che non contano sono 3, non 2. Per la Vertical Row al posto del Pulley (e viceversa) sono scritti serie, range e peso.`]},{t:"li",r:[["Frase anticipata: ","b"],`la 1.4 diceva le correzioni "ricontrollate in una lettura mirata" mentre la lettura era ancora in corso. Lo stesso errore di prima: ora la sezione 13 riporta l'esito vero.`]},{t:"p",r:[["Corretti dopo il controllo della versione 1.5 (17/10):","b"]]},{t:"li",r:[["Prima seduta: ","b"],"se alla prima seduta (3/11 o seduta di prova) una serie scendeva sotto il fondo, quella seduta diventava la base e non si poteva pi\xF9 battere: il 24-28/11 poteva scattare il \u221210% su Lat, pressa, alzate o hammer mentre seguivi la regola. Ora, in quel caso, la base \xE8 la seduta dopo."]},{t:"li",r:[["Peso nuovo: ","b"],'non era scritto fino a quando un peso \xE8 "nuovo", n\xE9 come si conta una serie pi\xF9 pesante sotto il fondo. Ora un peso \xE8 nuovo finch\xE9 non \xE8 su tutte le serie; dopo, una serie sotto il fondo vale come fatta un salto pi\xF9 in basso.']},{t:"li",r:[["Conteggio dopo un allarme: ","b"],"dopo la riduzione delle serie di croci e Vertical Row il conteggio continuava, e il \u221210% arrivava in 2 sedute. Ora dopo ogni allarme si riparte da zero; al secondo stallo vale il range \u22122 anche con le serie ancora ridotte."]},{t:"li",r:[["Recupero a 36 ore: ","b"],"durante il salto del richiamo il segnale poteva scattare mentre seguivi la regola. Ora il sabato in cui richiamo, hammer o overhead salgono di peso non conta."]},{t:"li",r:[["Testo: ","b"],"Vertical Row al posto del Pulley con le serie che il Pulley ha quel giorno (scarico e tagli compresi); nella sezione 12 una regola descritta al contrario."]},{t:"li",r:[["Errore mio: ","b"],'nella 1.5 avevo scritto di aver verificato le correzioni "simulando le regole seduta per seduta". Non era vero: la mia simulazione controllava solo la definizione di "migliore", con serie e range sbagliati per alzate e richiamo, e senza la prima seduta e le serie sotto il fondo. Le correzioni qui sopra usano le frasi che il revisore ha proposto e simulato; ho rieseguito le sue simulazioni.']},{t:"p",r:[["Cambiati il 17/10 pomeriggio (revisioni sulle braccia e sui pasti attorno all'allenamento, e tue scelte):","b"]]},{t:"li",r:[["Regola del bicipite: ","b"],"errore dimostrabile, l'avevo scritta io: chiedeva +0,5 cm in 6 settimane, ma l'errore del metro su una misura \xE8 circa 0,4-0,5 cm (limiti ISAK). Con un braccio fermo sarebbe scattata 9 volte su 10; con una crescita vera di 0,5 cm, una volta su due. Ora decidono i carichi dell'hammer; la misura resta come controllo, con 3 letture."]},{t:"li",r:[["Tricipite: ","b"],"il marted\xEC le estensioni overhead al cavo prendono il posto del push-down. Il dato: Maeo 2023, con il braccio sopra la testa il tricipite cresce circa 1,4 volte di pi\xF9. Il gioved\xEC resta il push-down, che affatica meno il tricipite 36 ore prima delle overhead del sabato."]},{t:"li",r:[["Reverse curl: ","b"],`tua richiesta, 2 \xD7 12-15 in fondo al sabato, dopo le prove del 24 e del 31/10. Nessuno studio di crescita lo rende migliore dell'hammer: lo aggiungiamo perch\xE9 lo vuoi, senza togliere niente. Errore mio: ti avevo scritto che \xE8 "pi\xF9 mirato dell'hammer" su un solo studio (Kleiber 2015); altri due non lo confermano (Boland 2008, Coratella 2023).`]},{t:"li",r:[["Durante le sedute: ","b"],"banana piccola il marted\xEC (come prima) e il sabato o la domenica mattina; niente il gioved\xEC e nei pomeriggi; nessun integratore (BCAA ed EAA no: proteine gi\xE0 sopra 1,6 g/kg). Il dato: Henselmans 2022, beneficio improbabile fino a 10 serie per muscolo e senza digiuno. Errore mio: avevo proposto la banana in tutte le sedute su una meta-analisi meno adatta al tuo caso (King 2022)."]},{t:"li",r:[["Sabato e domenica mattina: ","b"],"spuntino salato alle 11:15 al posto della colazione dolce dopo i pesi (tua scelta), pranzo uguale alle 12:30; D3 + K2 al pranzo, perch\xE9 la colazione dopo i pesi non c'\xE8 pi\xF9."]},{t:"li",r:[["Pesi di pomeriggio nel weekend: ","b"],"giornata con orari, almeno 3 ore tra pranzo e pesi (il tuo 23/8), caff\xE8 entro le 14:30, stesse calorie del sabato mattina."]},{t:"li",r:[["Numeri che cambiano: ","b"],"103 serie a settimana (da 101), 90 nella rampa (da 89), 61 negli scarichi (da 60); sabato circa 117 minuti (da 110); sabato senza la cena 1.679 kcal (da 1.674), domenica di allenamento 2.312 (da 2.306), media della settimana 2.594 (da 2.593); gradino +2 +136 (da +137), +3 +204 (da +205)."]},{t:"p",r:[["Corretti dopo la revisione finale della 1.7 (17/10, quattro revisori):","b"]]},{t:"li",r:[["Numeri rimasti della 1.6: ","b"],'"Volume troppo alto" dava 97 e 94 serie (ora 99 e 96); 180 controlli (ora 197); gradino \u22122 a \u221299 (ora \u2212100); il volume valeva "34 kcal al giorno" (ora circa 45-50). Errore mio: nella 1.7 ho cambiato le serie senza ricalcolare le frasi che le usavano.']},{t:"li",r:[["Regola del bicipite: ","b"],`poteva scattare mentre l'hammer progrediva: soglia fissa di +3 anche con un periodo pi\xF9 corto, hammer al tetto che non poteva pi\xF9 salire, un sabato confrontato con se stesso, "salito di peso" leggibile in due modi, scontro con l'esercizio fermo il 12/12. Ora la soglia \xE8 1 ripetizione a settimana, servono 2 sabati a 2 settimane, il tetto chiuso conta come salito e se il 12/12 scattano tutte e due vale questa.`]},{t:"li",r:[["Gomito: ","b"],"la regola valeva solo per l'overhead del marted\xEC e confondeva l'indolenzimento dell'avambraccio con il tendine. Ora vale per le overhead dei due giorni, conta solo il dolore sull'osso del gomito, il registro c'\xE8 anche la mattina dopo, e oltre 7 giorni si va dal medico."]},{t:"li",r:[["Prove del reverse curl: ","b"],'"2 \xD7 15 a 3 dal limite" e "pi\xF9 di 20 ripetizioni" non si potevano seguire insieme. Ora: 15 ripetizioni e la stima di quante ne restano. Aggiunti dove si registrano e cosa fare se una prova salta.']},{t:"li",r:[["Regole: ","b"],'una seduta chiusa al tetto non conta come ferma; un allarme rimandato e il suo ritorno sono un solo stallo; il secondo stallo dei key lift fa subito il \u221210%; le riduzioni del range non si sommano; "Volume troppo alto" prende il posto del \u221210%; le 36 ore si contano serie per serie, ripartono dopo il segnale e non usano i sabati di pomeriggio; lo scarico \xE8 la met\xE0 delle serie in vigore.']},{t:"li",r:[["Altro: ","b"],"orari che si spostano se entri pi\xF9 tardi; domenica pomeriggio negli imprevisti; acqua del weekend; vitamina C e integratori nella sintesi; linea del girovita mai sopra 98; soglia del trend dopo la riga 5-bis; registro del mal di schiena; bicipite con 3 letture anche il 1/11; prelievo del 3/11; reverse curl con l'attrezzo occupato; arrotondamenti dei menu; margine delle proteine al Mantenimento; fonti mancanti; frasi della storia riportate ai valori di allora."]},{t:"p",r:[["Aggiunte e chiarimenti:","b"]]},{t:"li",r:["Riscaldamento del Protocollo Guardia in tutte le sedute; serie di riscaldamento delle alzate; salti delle macchine; come si fissano i carichi di partenza; tabella dello scarico; durata di ogni riduzione; seduta troppo lunga con un segnale."]},{t:"li",r:["Gradini nel piatto, con le varianti gi\xE0 calcolate; pane del pranzo e sue sostituzioni; varianti per lo spuntino del sabato e per la banana del marted\xEC; come si pesano frutta, patate, verdure e uova."]},{t:"li",r:["Integratori ora per ora per ogni tipo di giorno; la vitamina C con il ferro anche la domenica; la D3 al pranzo nei giorni di allenamento del weekend."]},{t:"li",r:["Misure e foto con protocollo e date; pesata, girovita e pressione con le condizioni; cosa registri."]},{t:"li",r:["Formula del trend; linea con i valori per data; ordine dei controlli alla verifica; freno ogni sabato; verifiche del 17/1 e del 31/1 senza le settimane delle feste; partenza contata dal tuo gradino del Block 4; passaggio a 0,25-0,3 con il corridoio nuovo; tappe e bicipite con le soglie."]},{t:"li",r:["Imprevisti: seduta saltata, sabato spostato, notte corta, malattia, donazione, ristorante, trasferta, macchina occupata o rotta, pickleball. Mattina del prelievo e cosa si fa dopo gli esami. Cosa succede dal 15/2."]},{t:"li",r:[`Sabato: seduta verso le 9 (dato tuo del 16/10). La riabilitazione del ginocchio a casa non c'\xE8 perch\xE9 non la fai pi\xF9. Dal Protocollo Guardia restano il riscaldamento e la lista "stop e visita medica"; le altre regole sono sostituite da quelle di questo documento.`]},{t:"h1",x:"13. Controlli e revisione"},{t:"li",r:[["Chi sono i revisori: ","b"],"altre istanze della stessa intelligenza artificiale, avviate separatamente, con un ruolo e il contesto completo scritti da me. Non sono professionisti e non hanno competenze certificate. Servono perch\xE9 ripartono da zero e rifanno i conti; hanno i miei stessi punti ciechi, e non sostituiscono il medico."]},{t:"li",r:[["Revisione di completezza (16/10): ","b"],"un revisore ha vissuto le tue giornate dal 1/11 a febbraio con la Struttura v3.1 e l'Alimentazione v3.1 in mano. Ha trovato 59 mancanze (5 bloccanti, 36 importanti, 18 minori) e 13 contraddizioni. Dopo la seconda revisione sono tutte risolte; la tabella qui sotto dice dove."]},{t:"li",r:[["Seconda revisione, sul programma completo: ","b"],"un secondo revisore ha vissuto le stesse giornate con la versione 1 di questo documento. Nessuna mancanza bloccante; 7 importanti e 12 minori, 15 errori di numeri o di logica, 22 regole da precisare per l'app. Della prima revisione ha trovato 52 voci risolte e 7 in parte, e tutte le 13 contraddizioni risolte."]},{t:"li",r:[["Terza lettura, sulle correzioni: ","b"],"un terzo revisore ha verificato voce per voce le correzioni della versione 1: 60 voci su 63 risolte e 3 in parte, pi\xF9 10 errori piccoli nati dalle correzioni (il pi\xF9 grosso: le verdure del pranzo con un valore diverso da quelle della cena)."]},{t:"li",r:[["Quarta lettura, sulla versione 1.1: ","b"],"7 voci risolte e 6 in parte su 13, pi\xF9 6 errori piccoli: una regola sulla malattia che dava pi\xF9 serie dopo uno stop pi\xF9 lungo, un numero sbagliato nel confronto con la versione 1, il pollo con due valori, due arrotondamenti, frasi su controlli non ancora fatti. Giudizio: si pu\xF2 seguire senza chiedere niente. Le ultime correzioni (data del gradino confermato, 17/1 a +3, luned\xEC del ginocchio, malattia, pollo, arrotondamenti) le ho fatte io e verificate con i controlli automatici e rileggendo ogni punto: nessun revisore le ha rilette."]},{t:"li",r:[["Revisione da preparatore, sulla parte di allenamento (17/10): ","b"],"un revisore con il ruolo di preparatore (ipertrofia naturale, uomini sopra i 40 anni, menisco degenerativo), con tutti i dati del Block 4, ha giudicato nel merito le regole di allenamento. 7 errori e 16 rischi, con la prova; 7 opinioni. Corretti tutti gli errori e i rischi (sezione 12); le opinioni sono entrate solo dove hai deciso tu (Vertical Row al sabato). La verifica delle correzioni \xE8 descritta qui sotto."]},{t:"li",r:[["Verifica delle correzioni del preparatore: ","b"],"un secondo preparatore ha verificato le correzioni sulla versione 1.3: 19 voci risolte, 2 in parte, 2 non pi\xF9 necessarie (Vertical Row al gioved\xEC e calcetto); la Vertical Row al sabato \xE8 adeguata, con un posto migliore subito dopo la pressa piedi bassi. Ha trovato 15 problemi nuovi, il principale gli allarmi che dopo un taglio di carico scattavano da soli: corretti nella versione 1.4."]},{t:"li",r:[["Lettura finale, sulla versione 1.4: ","b"],`un terzo preparatore ha riletto la versione 1.4 punto per punto: 14 voci risolte, 3 in parte e 6 errori nuovi. Il principale: la definizione di "migliore" faceva scattare lo stallo a ogni salto grande con 4 o pi\xF9 serie. Gli altri: base del confronto mancante, croci e Vertical Row gi\xE0 ridotte, due frasi dell'appendice diverse dalle sezioni 3 e 10, una frase che dava per fatta questa lettura. Giudizio sulla 1.4: sicura per il ginocchio; non ancora seguibile senza chiedere, per il primo errore. Corretti nella versione 1.5.`]},{t:"li",r:[["Controllo delle correzioni della 1.5 (17/10): ","b"],`un quarto revisore ha controllato solo le correzioni della 1.5, simulando 180 sequenze di sedute: salto grande risolto (0 stalli, contro 132 su 180 con la regola della 1.4) e un vero plateau che fa ancora scattare l'allarme. Ha trovato 4 errori nuovi (prima seduta con una serie sotto il fondo, "peso nuovo" non definito, conteggio che non ripartiva dopo croci e Vertical Row ridotte, recupero a 36 ore durante il salto del richiamo), 3 correzioni di testo, e una mia frase che diceva pi\xF9 di quanto avevo verificato. Tutto corretto nella versione 1.6 (sezione 12), con le frasi che il revisore ha proposto e simulato; ho rieseguito le sue simulazioni e i risultati tornano. Nessun revisore ha riletto la 1.6 dopo queste correzioni.`]},{t:"li",r:[["Revisione sulle braccia (17/10, pomeriggio): ","b"],"un preparatore ha valutato le braccia con tutti i dati: volume (14 serie frazionali per i flessori prima del reverse curl, 16 con il reverse curl; 15 per il tricipite), frequenza, superserie tra muscoli opposti e posizione nella seduta sono gi\xE0 dove li mettono gli studi, e non conviene alzare il volume con 5-6 ore di sonno e sedute lunghe. Due correzioni: il push-down del marted\xEC diventa estensioni overhead (Maeo 2023), e la regola del bicipite decideva su una differenza dentro l'errore del metro (errore dimostrabile). Sul reverse curl: nessuno studio di crescita lo rende migliore dell'hammer; se lo vuoi, in pi\xF9 a fine sabato, dopo due prove. Fonti verificate con la ricerca web. Le tue scelte: overhead s\xEC, reverse curl in pi\xF9 con le prove del 24 (EZ) e del 31/10 (cavo), regola del bicipite sui carichi."]},{t:"li",r:[["Revisione sui pasti attorno all'allenamento (17/10, pomeriggio): ","b"],"un nutrizionista sportivo ha valutato i pasti attorno all'allenamento: durante le sedute nessun integratore serve (BCAA ed EAA no, con le proteine gi\xE0 sopra 1,6 g/kg); la banana del marted\xEC resta, al sabato o alla domenica mattina \xE8 l'unica seduta con un motivo (si parte dopo il digiuno della notte con un pasto piccolo), il gioved\xEC e i pomeriggi niente. Lo spuntino salato delle 11:15 va bene; D3 + K2 vanno al pranzo; nei pesi di pomeriggio caff\xE8 entro le 14:30 e collagene 60 minuti prima. Fonti verificate con la ricerca web, con il grado di certezza. Le tue scelte: banana solo nei weekend di mattina (pi\xF9 il marted\xEC), spuntino salato con il pranzo normale."]},{t:"li",r:[["Revisione finale della 1.7 (17/10): ","b"],`quattro revisori hanno riletto la 1.7 da capo, ognuno con il suo ruolo. Completezza: 30 punti, nessuno bloccante; si seguiva quasi tutto senza chiedere, tranne le prove del reverse curl e il gomito. Conti: tutti i menu, le varianti, i gradini, le serie, le durate e le date rifatti in modo indipendente; 14 punti, il pi\xF9 importante i totali di "Volume troppo alto" rimasti alla 1.6. Preparatore: sicura per ginocchio e schiena, efficace; da correggere il gomito (regola solo per il marted\xEC, indolenzimento confuso con il tendine), la soglia della regola del bicipite e le prove; nessun problema bloccante. Simulazione delle regole: i cambi della 1.7 reggono (360 sequenze di salto grande senza stalli), ma 9 ambiguit\xE0 importanti, quasi tutte nella nuova regola del bicipite e nelle 36 ore, con le frasi di correzione gi\xE0 simulate. Corretti nella versione 1.8 (sezione 12) con le frasi dei revisori; delle opinioni sono entrate solo \xABbusto fermo, niente slancio\xBB al reverse curl e la frase sul marted\xEC dopo la domenica pomeriggio. L'esito del controllo \xE8 nella riga sotto.`]},{t:"li",r:[["Controllo delle correzioni della 1.8: ","b"],"un revisore ha controllato tutti i 74 punti delle quattro revisioni sulla 1.8: 66 risolti, 2 a met\xE0 (mal di schiena dopo il marted\xEC; sedute che non contano nella regola delle 36 ore del richiamo), 6 opinioni trattate come previsto. Ha simulato le regole cambiate (hammer, esercizio fermo, 36 ore, gomito) e ha trovato 6 errori nuovi, il principale il gomito dopo la seconda prova del reverse curl. Ho applicato i 2 punti a met\xE0 e i 6 errori con le sue frasi, che lui aveva gi\xE0 simulato; le ho controllate rigenerando il documento e i 197 controlli automatici, ma nessun revisore le ha rilette dopo."]},{t:"li",r:[["Controlli automatici: ","b"],'197 controlli sui numeri, tutti a posto: 83 su menu e varianti, 64 sui gradini (ogni gradino vale le calorie della sua riga entro 3 kcal; varianti scalate entro il 10%; spuntino OFF dal \u22121; pesi di pomeriggio come il sabato mattina; proteine sopra 150 g), 50 su scheda e calendario (salti ed esecuzione per ogni esercizio, scarico, date, linea, settimane delle verifiche, trend, durate, varianti in pi\xF9). La scheda passa i suoi controlli. Il controllo Word \u2192 PDF confronta ogni riga e ogni cella del documento con il PDF: nessuna manca (versione 1.8; per la 1.9 il "Controllo del 27/10" qui sotto).']},{t:"li",r:[["Revisioni del 27/10, sulla 1.9: ","b"],"un preparatore (l'ordine degli esercizi regge in tutte e tre le sedute; partenza piena possibile, con il rischio nelle braccia; giorni liberi; regole come avvisi), un revisore delle regole (23 casi simulati per gli avvisi dei giorni liberi, nessun falso avviso nelle settimane normali; finestre per gli allarmi; regole generali dei due tasti), un revisore delle braccia (serie in pi\xF9 dalla settimana 3, a condizione) e uno dell'alimentazione (menu per seduta e momento, regola della cena grande, gradino scelto da te, errore dei grassi). Le tue decisioni sono nella sezione 12. Prima della consegna: ultimo controllo di tutti i revisori su tutto il documento e sull'app."]},{t:"li",r:[["Controllo del 27/10 sulla bozza della 1.9: ","b"],`gli stessi quattro revisori e uno della completezza. Errori miei, detti chiari: nella prima bozza la tabella delle settimane (sezione 1) nel PDF aveva solo la prima riga; le righe 2-19 c'erano nel Word ma si perdevano nella pagina, come la tabella dei gradini della v3.1. L'hanno trovato il preparatore e il revisore della completezza, non il mio controllo: non posso dire con certezza se il confronto Word \u2192 PDF sia stato fatto girare su quella bozza, e in ogni caso \xE8 arrivata ai revisori tagliata. Corretta lo stesso giorno; da ora il confronto gira su ogni bozza prima che vada ai revisori, e sulla versione consegnata d\xE0 tutte le tabelle e tutti i paragrafi presenti. La regola della cena grande era scritta male nelle sezioni 2 e 4 (tabella e appendice erano giuste). "Pomeriggio" voleva dire dalle 11 per il cibo e dalle 13 per i confronti: ora un solo confine, le 11, e l'orario tipico del pomeriggio \xE8 15:30 dappertutto. "Se non applichi, conta lo stesso" non valeva per il Volume troppo alto. Corretti anche: la regola del bicipite sulle prime 3 serie in tutte le frasi; le serie in pi\xF9 per le braccia scritte per settimane, con le condizioni definite e il caso del 27/12; "99 a settimana con la scheda di base"; il salto dell'EZ con i dati del 24/10; frasi con i giorni al posto delle sedute. Ricontrollo della sera: la banana piccola passa prima dei pesi (tua scelta); il revisore dell'alimentazione ha rifatto i conti: tutte le giornate, a ogni gradino, e la settimana restano uguali.`]},{t:"tab",w:[3600,6038],rows:[{h:1,sec:0,c:[[["Mancanze della prima revisione","b"]],[["Dove sono risolte","b"]]]},{h:0,sec:0,c:[["Tabella dei gradini persa nel PDF"],['Sezione 4, "I gradini", e controllo Word \u2192 PDF']]},{h:0,sec:0,c:[["Misure, foto, tappe, key lift"],["Sezioni 7 e 8"]]},{h:0,sec:0,c:[["Verifiche del 17/1 e del 31/1; passaggio a 0,25-0,3"],["Sezione 8"]]},{h:0,sec:0,c:[["Cosa succede dal 15/2"],["Sezione 11"]]},{h:0,sec:0,c:[["Freno, linea, trend, da quando vale un gradino, partenza"],["Sezione 8; sezione 4 per il luned\xEC"]]},{h:0,sec:0,c:[["Carichi di partenza, progressione, salti, riscaldamento, scarico, durata delle riduzioni, controllo delle 36 ore, bicipite"],["Sezione 3"]]},{h:0,sec:0,c:[["Dolore, macchina occupata o rotta, seduta saltata, malattia, notte corta, ristorante, trasferta, donazione, pickleball"],["Sezioni 3, 4 e 10"]]},{h:0,sec:0,c:[["Feste, 24 e 31/12, alcol, pasto libero saltato o spostato"],["Sezione 4"]]},{h:0,sec:0,c:[["Prelievo del 3/11 e cosa si fa con gli esami"],["Sezione 9"]]},{h:0,sec:0,c:[["Integratori: ora, dose, domenica, sabato"],["Sezioni 2 e 5"]]},{h:0,sec:0,c:[["Ora della seduta del sabato e ordine della mattina"],["Sezione 2"]]},{h:0,sec:0,c:[["Girovita, pesata, pressione: come e quando; cosa registri"],["Sezione 7"]]},{h:0,sec:0,c:[["Sonno: sabato, cosa si misura, quando si rivede"],["Sezione 6"]]},{h:0,sec:0,c:[["Pesi di frutta, patate, verdure, uova; varianti mancanti; caff\xE8, sale, acqua"],["Sezione 4"]]},{h:0,sec:0,c:[['Contraddizioni tra i due documenti (freno, spostamenti, date, acqua, pressione, linea, frutto, alcol, "feriali")'],["Risolte nel testo; sezione 12"]]},{h:0,sec:0,c:[["Sigle e termini"],["Glossario"]]}]},{t:"h1",x:"Appendice \xB7 Regole precise"},{t:"p",r:["Sono le definizioni con cui l'app applica le regole delle sezioni 3, 7 e 8. Servono anche a te per controllare un calcolo."]},{t:"tab",w:[2600,7038],rows:[{h:1,sec:0,c:[[["Regola","b"]],[["Definizione","b"]]]},{h:0,sec:0,c:[[["Chi decide","b"]],["L'app calcola e ti propone i cambi del gradino (verifiche) e il freno, con i numeri che li giustificano: il cambio vale quando lo confermi, dalla colazione del giorno dopo la conferma. Il gradino lo puoi anche scegliere tu nel menu: Solo oggi vale quel giorno; Da oggi in poi vale da quel giorno, compreso. Le regole di allenamento delle sezioni 3 e 10 sono avvisi: Applica il consiglio o Faccio come da scheda; la scelta si registra e vale dalla seduta in cui la fai."]]},{h:0,sec:0,c:[["Giornata del menu"],['La decide la seduta del giorno e il suo momento (ingresso: mattina prima delle 11, pomeriggio dalle 11 e prima delle 17, sera dalle 17), non il giorno della settimana; senza seduta, giorno OFF. Le giornate sono nella sezione 4, "Che giornata \xE8". Il piano del giorno \xE8 quello della settimana tipo finch\xE9 non lo cambi; se apri una seduta diversa, vale quella.']]},{h:0,sec:0,c:[["Cena grande"],[`Ogni seduta ne ha una: la cena post-allenamento, oppure il pasto libero del sabato sera. Il pasto libero \xE8 la cena grande della seduta del sabato; se il sabato non c'\xE8 una seduta, della seduta Sabato della stessa settimana (luned\xEC-domenica), che quel giorno ha la cena OFF. Due sedute nello stesso giorno: una cena grande. \xABIl sabato c'\xE8 una seduta\xBB vuol dire fatta o in programma nel piano del sabato (card "La giornata"); se il piano cambia dopo, l'app ricalcola anche il menu dei giorni passati della settimana: \xE8 solo la vista, quello che hai mangiato resta e non c'\xE8 niente da recuperare.`]]},{h:0,sec:0,c:[["Gradino scelto da te"],[`Solo oggi: menu di quel giorno; non cambia il gradino del programma n\xE9 il conteggio del punto 5. Da oggi in poi: gradino del programma da quel giorno, compreso; conta come un cambio. Vale l'ultima decisione che confermi: se la domenica della verifica scegli "Da oggi in poi" prima di confermare la verifica, la verifica parte dal gradino che hai scelto; se lo scegli dopo, vale la tua scelta. Dal Mantenimento al +3. Il limite delle feste vale solo sul gradino del programma deciso prima del 21/12. Dopo il freno confermato, una scelta pi\xF9 alta fa riprendere le verifiche dal punto 3 e riarma il freno.`]]},{h:0,sec:0,c:[[["Storico","b"]],["Per esercizio e per seduta: le alzate della seduta Marted\xEC sono uno storico, quelle della seduta Gioved\xEC un altro, in qualunque giorno le fai. La stessa seduta non si registra due volte nello stesso giorno: se succede, l'app chiede se \xE8 la stessa seduta."]]},{h:0,sec:0,c:[[["Miglioramento","b"]],["Una seduta migliora se batte la migliore delle ultime 3 sedute valide dello stesso esercizio nella stessa seduta, guardando solo le serie presenti in tutte. Migliore: si confrontano i pesi serie per serie, partendo dalla prima; vince il peso pi\xF9 alto nella prima serie in cui i pesi sono diversi, se quella serie \xE8 nel range; con gli stessi pesi su tutte le serie, vincono pi\xF9 ripetizioni totali. Cos\xEC, nel salto grande, ogni serie che passa al peso nuovo \xE8 un miglioramento. Una serie in pi\xF9 (per esempio dopo uno scarico o una riduzione) non conta come miglioramento. Gli allarmi partono dal 3/11: le sedute del Block 4 servono solo per i carichi di partenza. Dopo un cambio di peso o di esecuzione consigliato da una regola e fatto (\u221210%, ritorno al peso precedente nel salto grande, \u221210 kg per il ginocchio, modifiche per la schiena) il confronto riparte: contano solo le sedute dal cambio in poi; se fai come da scheda, il confronto continua. La prima seduta valida dal 3/11, o dopo un cambio, fa da base e non conta come ferma; se in quella seduta (anche quella di prova) una serie resta sotto il fondo, la base \xE8 la seduta dopo. Finch\xE9 le sedute valide sono meno di 3, si confronta con la migliore di quelle che ci sono. Un peso \xE8 nuovo finch\xE9 non \xE8 entrato su tutte le serie; dopo, una serie sotto il fondo conta, e nel confronto vale come fatta un salto pi\xF9 in basso. Dopo un rinvio (sonno, trend, menu, donazione) lo stallo si conta di nuovo da zero."]]},{h:0,sec:0,c:[[["Esercizio fermo","b"]],["3 sedute valide di fila che non migliorano. Una seduta chiusa al tetto del range su tutte le serie, allo stesso peso, non conta come ferma: \xE8 il segnale per salire. Dopo ogni allarme, qualunque sia l'azione, il conteggio riparte da zero; un allarme rimandato e il suo ritorno sono un solo stallo."]]},{h:0,sec:0,c:[[["Sedute che non contano","b"]],["Elenco chiuso. Sempre, qualunque scelta: scarico; settimana di ripresa dopo una malattia; seduta in un giorno segnato malato; prima seduta dopo una donazione e seduta del giorno della donazione; seduta dopo una notte sotto le 5 ore; seduta con dolore (ginocchio o altro: tutta la seduta; gomito: solo l'esercizio); esercizio fatto con un sostituto e, se il sostituto \xE8 un esercizio di un'altra seduta della settimana, anche quell'esercizio nella sua seduta successiva; alzate in una posizione diversa dal solito; seduta fuori finestra (riga qui sotto); al massimo 2 sedute di fila con una serie allo stesso peso nuovo sotto il fondo del range. Solo se hai applicato il consiglio: le sedute ridotte dopo il dolore alla pressa; le presse nelle settimane senza aumenti per il ginocchio; il ritorno della monopodalica. Per sapere se l'hai applicato vale quello che registri. Si saltano: il confronto si fa con le sedute valide."]]},{h:0,sec:0,c:[["Finestra della seduta"],[`Ore da inizio a inizio. (a) Una seduta a meno di 32 ore dalla seduta prima non conta. (b) Una seduta Marted\xEC a meno di 70 ore dalla seduta prima non conta. (c) Una seduta Sabato conta solo se la seduta subito prima \xE8 un Gioved\xEC iniziato tra 32 e 42 ore prima e il Sabato \xE8 di mattina (ingresso prima delle 11, come nella riga "Giornata del menu"). (c') Una seduta Sabato a meno di 70 ore dall'ultima seduta Marted\xEC o Sabato non conta. (d) Se la stessa seduta \xE8 fuori finestra 3 settimane di fila, l'app lo segnala. Esempi: domenica mattina (61,5 ore dal Gioved\xEC) fuori; Marted\xEC dopo la domenica (58,5 ore) fuori; Sabato di pomeriggio (circa 44 ore) fuori; Marted\xEC dopo un Sabato di pomeriggio (76 ore) conta; Sabato dopo un Gioved\xEC saltato fuori; Sabato di domenica mattina dopo un Gioved\xEC di venerd\xEC sera (37,5 ore) conta; Sabato 2/1 dopo un Gioved\xEC fatto il 31/12 al mattino (48 ore) fuori; Marted\xEC fatto mercoled\xEC sera: il Sabato del sabato mattina (61,5 ore dalle gambe) fuori; Marted\xEC fatto luned\xEC sera (58,5 ore dal Sabato) fuori; Marted\xEC al mattino del marted\xEC dopo un Sabato di domenica mattina (48 ore) fuori. Quando una seduta non entrer\xE0 nei confronti, l'app lo scrive all'apertura e alla fine della seduta, con il motivo.`]]},{h:0,sec:0,c:[["Ora della seduta"],[`Inizio = l'ora della prima serie registrata meno 10 minuti (15 nella seduta Sabato, che parte dalla pressa), se registri dal vivo (almeno 2 esercizi e 20 minuti tra la prima e l'ultima registrazione, nel giorno della seduta). Se no, l'orario tipico del momento scelto: mattina 9:00, pomeriggio 15:30, sera 19:30. Mattina, pomeriggio e sera sono quelli della riga "Giornata del menu" (ingresso prima delle 11, dalle 11 e prima delle 17, dalle 17): valgono per il menu e per le finestre.`]]},{h:0,sec:0,c:[["Avvisi di recupero"],["Due sedute nello stesso giorno; meno di 32 ore dalla seduta prima; seduta Marted\xEC o Sabato a meno di 48 ore dall'ultima seduta Marted\xEC o Sabato; la stessa seduta dell'ultima volta, a meno di 6 giorni; quarta seduta da luned\xEC a domenica. Un solo avviso con tutti i motivi e due tasti: Applica il consiglio o La faccio ora (si registra e la doppia progressione va avanti; conta per gli allarmi solo se \xE8 in finestra). Il consiglio dipende dal motivo: stesso giorno, meno di 32 ore o gambe a meno di 48 ore \u2192 il primo momento utile (sera dal luned\xEC al venerd\xEC, mattina o pomeriggio nel weekend) che rispetta i minimi e in cui la seduta conta; se fino a domenica non c'\xE8, saltarla (sezione 10); la stessa seduta di fila \u2192 la seduta che manca nel giro; quarta seduta \u2192 non farla, \xE8 oltre la scheda. Con pi\xF9 motivi vale prima la quarta seduta, poi la stessa seduta di fila, poi il tempo. Minimi della scheda: 37,5 ore (gioved\xEC sera \u2192 sabato mattina), 52 ore per le gambe (domenica pomeriggio \u2192 marted\xEC sera)."]]},{h:0,sec:0,c:[["Seduta proposta"],["La prima seduta, nell'ordine Marted\xEC \u2192 Gioved\xEC \u2192 Sabato, non ancora fatta nella settimana (luned\xEC-domenica); il marted\xEC, il gioved\xEC e il sabato quella del giorno, se non \xE8 gi\xE0 fatta. Una seduta non fatta entro la domenica non passa alla settimana dopo."]]},{h:0,sec:0,c:[["Avvisi delle regole"],[`Ogni avviso nasce da un episodio: una regola e l'evento che la fa scattare. La scelta (Applica il consiglio \xB7 Faccio come da scheda) vale per tutto l'episodio finch\xE9 non la cambi; un evento nuovo d\xE0 un avviso nuovo. Senza tasto vale il registro: esercizio senza serie = tolto; serie al massimo quelle consigliate = ridotte; peso al massimo quello consigliato = carico ridotto; peso non oltre l'ultima seduta = niente aumenti. Quello che il registro non mostra (ripetizioni dal limite, fine corsa, plank) senza tasto vale come da scheda. Stop e visita medica e i divieti dell'ortopedico non hanno i due tasti; i segnali "medico" restano anche con "come da scheda".`]]},{h:0,sec:0,c:[[["Menu a posto","b"]],["Nessun pasto fuori menu, oltre al pasto libero, nella settimana dell'allarme. Il gradino scelto da te \xE8 menu."]]},{h:0,sec:0,c:[[["Sonno non a posto","b"]],['Media delle ultime 7 notti (dalla luce spenta alla sveglia) almeno 30 minuti sotto la tua media delle 4 settimane prima. Il sonno pu\xF2 rimandare lo stesso allarme una volta sola, e non rimanda mai "Volume troppo alto".']]},{h:0,sec:0,c:[[["Stanchezza che non passa","b"]],['"Stanco" segnato per 10 mattine di fila.']]},{h:0,sec:0,c:[[["Notte corta","b"]],['Meno di 5 ore dalla luce spenta alla sveglia. "3 notti di fila" = 3 notti consecutive, qualunque giorno.']]},{h:0,sec:0,c:[["Regola dell'hammer"],[`Si confrontano l'hammer della seduta Sabato valida della settimana 7-13/12 e quello della settimana 16-22/11, solo le prime 3 serie. "Salito di peso" = almeno una serie con pi\xF9 peso della stessa serie dell'altra seduta, restando nel range; conta come salito anche un hammer che nella prima seduta era sotto il tetto e nel periodo l'ha chiuso su tutte le prime 3 serie. "Totale delle ripetizioni allo stesso peso" = somma delle ripetizioni delle serie fatte con lo stesso peso nelle due sedute, serie per serie. Se una delle due non \xE8 valida, si usa la seduta Sabato valida pi\xF9 vicina dentro il periodo; servono almeno 2 sedute valide ad almeno 2 settimane di calendario di distanza, se no la regola non scatta; la soglia \xE8 1 ripetizione in pi\xF9 per ogni settimana di calendario tra le due. Se nella stessa seduta scatta anche l'esercizio fermo dell'hammer, vale questa regola.`]]},{h:0,sec:0,c:[["Due serie in pi\xF9 per le braccia"],[`Si decide domenica 15/11 sulle settimane 1-2 (2-15/11); se non entrano, domenica 27/12 sulle settimane 6-7 (7-20/12). Pulite = tutte e quattro: (a) nessun voto del gomito di 3 o pi\xF9 nei registri del periodo (durante le sedute e la mattina dopo, Gioved\xEC compreso nelle settimane 1-3); (b) "stanco" mai segnato 3 mattine di fila nel periodo; (c) nessuna seduta del periodo in cui un key lift (Chest Press inclinata, Lat Machine avanti, Leg Press piedi bassi), sulle serie allo stesso peso, fa in totale 2 o pi\xF9 ripetizioni in meno della seduta prima dello stesso key lift (la prima seduta dal 3/11 fa da base; contano anche le sedute che non contano per gli allarmi, e l'app ti mostra quale seduta ha fatto mancare la condizione); (d) nel periodo 2 sedute Marted\xEC, 2 Gioved\xEC e 2 Sabato registrate, in qualunque giorno, anche chiuse prima o fuori finestra. Entrano dalla prima seduta Gioved\xEC e dalla prima seduta Sabato della settimana 3 (16-22/11) o, se decise il 27/12, della settimana 9 (28/12-3/1); al Sabato sull'hammer, o sul curl al cavo se la regola del bicipite l'ha gi\xE0 cambiato. Se il 15/11 scegli Resto a 103, te lo ripropone il 27/12, come se mancasse una condizione. Se il 27/12 manca ancora una condizione, o se prima \xE8 gi\xE0 scattato "Volume troppo alto", lo decidiamo insieme quel giorno: l'app te lo segnala con i dati.`]]},{h:0,sec:0,c:[[["Gomito","b"]],["Registro nelle sedute con reverse curl o overhead (Marted\xEC e Sabato) e la mattina dopo; nelle settimane 1-3 (3-22/11) anche la mattina dopo la seduta Gioved\xEC. Il dolore della mattina vale per la seduta del giorno prima: dolore s\xEC o no, dove (esterno, dietro), voto da 0 a 10, a riposo, alla pressione o nello stringere. Conta solo il dolore sull'osso del gomito, non l'indolenzimento dei muscoli dell'avambraccio. Soglia: 3 o pi\xF9. Dolore che dura oltre 7 giorni: medico."]]},{h:0,sec:0,c:[[["Ginocchio","b"]],[`Registro della mattina dopo ogni giorno con una seduta Marted\xEC o Sabato (due sedute con le gambe nello stesso giorno: un registro): dolore s\xEC o no, dove (interno, dietro, altro), voto da 0 a 10, gonfiore s\xEC o no. Conta il dolore in qualunque punto. Lieve = voto 1-3 senza gonfiore; grave = gonfiore, oppure voto 4 o pi\xF9. "Torna" = un s\xEC 2 volte in 3 settimane; "terza volta" = un terzo s\xEC prima che passino 2 settimane senza sintomi dalla riduzione; "continuo" (per "oltre 7 giorni") = tra due registri con il s\xEC non c'\xE8 un no e passano al massimo 7 giorni.`]]},{h:0,sec:0,c:[[["Seduta troppo lunga","b"]],["Durata registrata a ogni seduta, contro la stima della seduta (Marted\xEC 107, Gioved\xEC 91, Sabato 117 minuti; Gioved\xEC 93 e Sabato 118 con le serie in pi\xF9 delle braccia), con la settimana da luned\xEC a domenica. Scarico e sedute interrotte non contano; una seduta chiusa prima, con esercizi saltati per tempo, conta come oltre la stima."]]},{h:0,sec:0,c:[[["Trend","b"]],["Retta dei minimi quadrati sulle ultime 5 medie settimanali valide, con le date vere; arrotondata a 2 decimali (0,095 \u2192 0,10; 0,094 \u2192 0,09). Settimana valida = almeno 5 pesate valide."]]},{h:0,sec:0,c:[[["Girovita e linea","b"]],['Letture al millimetro; valore del sabato = lettura di mezzo. La linea si usa con i valori esatti. "Sopra la linea" = media dei sabati maggiore della media della linea negli stessi sabati. Linea = base + (98 \u2212 base) \xD7 settimane dal 31/10 \xF7 15, mai sopra 98.']]},{h:0,sec:0,c:[[["Freno","b"]],["Lettura di mezzo di 98,0 o pi\xF9 in due sabati validi consecutivi."]]},{h:0,sec:0,c:[[["Pressione","b"]],['Basta una delle due: massima 135 o pi\xF9, oppure minima 85 o pi\xF9 (160 e 100 per il "subito").']]},{h:0,sec:0,c:[[["Cavi","b"]],["Il salto \xE8 il valore successivo del pacco tra quelli gi\xE0 registrati; il peso da 1 kg \xE8 un passo intermedio facoltativo."]]},{h:0,sec:0,c:[[['Key lift "in salita"',"b"]],["Prima serie di lavoro con pi\xF9 peso restando nel range, oppure stesso peso con pi\xF9 ripetizioni."]]}]},{t:"p",r:[["Esercizi e muscoli (per la regola dei due esercizi fermi)","b"]]},{t:"tab",w:[1600,4200,3838],rows:[{h:1,sec:0,c:[["Seduta"],[["Esercizio","b"]],[["Muscolo","b"]]]},{h:0,sec:0,c:[["Marted\xEC"],["Alzate laterali manubri"],["Deltoide laterale"]]},{h:0,sec:0,c:[["Marted\xEC"],["Chest Press inclinata \u2605"],["Petto"]]},{h:0,sec:0,c:[["Marted\xEC"],["Lat Machine avanti \u2605"],["Dorso (larghezza)"]]},{h:0,sec:0,c:[["Marted\xEC"],["Pec Deck"],["Petto"]]},{h:0,sec:0,c:[["Marted\xEC"],["Estensioni overhead"],["Tricipiti"]]},{h:0,sec:0,c:[["Marted\xEC"],["Hammer curl"],["Bicipiti"]]},{h:0,sec:0,c:[["Marted\xEC"],["Leg Press monopodalica"],["Quadricipiti"]]},{h:0,sec:0,c:[["Marted\xEC"],["Calf alla Leg Press"],["Polpacci"]]},{h:0,sec:0,c:[["Marted\xEC"],["Leg Curl richiamo"],["Femorali"]]},{h:0,sec:0,c:[["Gioved\xEC"],["Alzate laterali manubri"],["Deltoide laterale"]]},{h:0,sec:0,c:[["Gioved\xEC"],["Distensioni inclinate manubri"],["Petto"]]},{h:0,sec:0,c:[["Gioved\xEC"],["Pulley basso"],["Dorso (spessore)"]]},{h:0,sec:0,c:[["Gioved\xEC"],["Shoulder Press macchina"],["Deltoide anteriore"]]},{h:0,sec:0,c:[["Gioved\xEC"],["Face Pull"],["Deltoide posteriore"]]},{h:0,sec:0,c:[["Gioved\xEC"],["Pull-down braccia tese"],["Dorso (larghezza)"]]},{h:0,sec:0,c:[["Gioved\xEC"],["Push-down tricipiti"],["Tricipiti"]]},{h:0,sec:0,c:[["Gioved\xEC"],["Curl al cavo"],["Bicipiti"]]},{h:0,sec:0,c:[["Gioved\xEC"],["Scrollate manubri"],["Trapezi"]]},{h:0,sec:0,c:[["Gioved\xEC"],["Abductor Machine"],["Abduttori"]]},{h:0,sec:0,c:[["Sabato"],["Leg Press piedi bassi \u2605"],["Quadricipiti"]]},{h:0,sec:0,c:[["Sabato"],["Vertical Row con appoggio"],["Dorso (spessore)"]]},{h:0,sec:0,c:[["Sabato"],["Leg Curl seduto"],["Femorali"]]},{h:0,sec:0,c:[["Sabato"],["Croci ai cavi dal basso"],["Petto"]]},{h:0,sec:0,c:[["Sabato"],["Hammer curl"],["Bicipiti"]]},{h:0,sec:0,c:[["Sabato"],["Estensioni overhead"],["Tricipiti"]]},{h:0,sec:0,c:[["Sabato"],["Leg Press piedi alti"],["Glutei / catena posteriore"]]},{h:0,sec:0,c:[["Sabato"],["Calf alla Leg Press"],["Polpacci"]]},{h:0,sec:0,c:[["Sabato"],["Richiamo alzate laterali"],["Deltoide laterale"]]},{h:0,sec:0,c:[["Sabato"],["Adductor Machine"],["Adduttori"]]},{h:0,sec:0,c:[["Sabato"],["Reverse curl"],["Avambraccio"]]}]},{t:"h1",x:"Glossario"},{t:"tab",w:[2400,7238],rows:[{h:1,sec:0,c:[[["Termine","b"]],[["Cosa vuol dire qui","b"]]]},{h:0,sec:0,c:[["Key lift \u2605"],["I tre esercizi principali che non si toccano: Chest Press inclinata, Lat Machine avanti, Leg Press piedi bassi."]]},{h:0,sec:0,c:[["Range"],["Le ripetizioni previste per serie, per esempio 10-12: il fondo \xE8 10, il tetto 12."]]},{h:0,sec:0,c:[["Dal limite"],["Quante ripetizioni ti restano prima di non riuscire pi\xF9 a farne una pulita."]]},{h:0,sec:0,c:[["Superserie"],["Due esercizi alternati, bicipite e tricipite, con il recupero dopo ogni giro."]]},{h:0,sec:0,c:[["Reverse curl"],["Curl con la presa prona (dorso delle mani in alto): lavora il brachioradiale e gli estensori del polso."]]},{h:0,sec:0,c:[["Estensioni overhead"],["Estensioni del tricipite con il braccio sopra la testa, al cavo: il capo lungo lavora in allungamento."]]},{h:0,sec:0,c:[["Seduta"],["Una delle tre sedute della scheda (Marted\xEC, Gioved\xEC, Sabato), in qualunque giorno la fai."]]},{h:0,sec:0,c:[["Avviso"],["Un consiglio dell'app con i due tasti: Applica il consiglio o Faccio come da scheda (negli avvisi di recupero La faccio ora; per le serie in pi\xF9 delle braccia Resto a 103). Decidi tu."]]},{h:0,sec:0,c:[["Episodio"],["Una regola che scatta per un evento (per esempio il ginocchio lieve dell'11/11): dura quanto la regola."]]},{h:0,sec:0,c:[["Fuori finestra"],['Una seduta troppo vicina alla seduta prima; per il Sabato, anche una seduta non di mattina (ingresso dalle 11), non 32-42 ore dopo la seduta Gioved\xEC o a meno di 70 ore dalle ultime gambe (appendice, "Finestra della seduta"): si registra ma non entra nei confronti per gli allarmi.']]},{h:0,sec:0,c:[["Scarico"],["Settimana con met\xE0 delle serie e stessi carichi, per recuperare."]]},{h:0,sec:0,c:[["Giorno ON / OFF"],["ON = giorno con una seduta di sera (di solito marted\xEC e gioved\xEC). OFF = giorno senza seduta (di solito luned\xEC, mercoled\xEC, venerd\xEC, domenica). I giorni con la seduta al mattino o di pomeriggio hanno il loro menu (sezione 4)."]]},{h:0,sec:0,c:[["Gradino"],["Un livello del menu. Il Base \xE8 il menu della sezione 4; sopra si aggiunge, sotto si toglie. Lo cambiano le verifiche, oppure lo scegli tu nel menu."]]},{h:0,sec:0,c:[["Cena grande"],["La cena post-allenamento o il pasto libero; ogni seduta ne ha una (appendice)."]]},{h:0,sec:0,c:[["Mantenimento"],["Due cose diverse: il gradino pi\xF9 basso (quello del freno) e la fase di fine maggio-giugno a peso stabile."]]},{h:0,sec:0,c:[["Trend"],["Quanto sale il peso a settimana, calcolato sulle ultime 5 medie settimanali."]]},{h:0,sec:0,c:[["Corridoio"],["Il ritmo accettato: 0,10-0,30 kg a settimana (0,20-0,35 dal 31/1, se il 17/1 scatta la riga 5-bis)."]]},{h:0,sec:0,c:[["Linea"],["Il girovita massimo previsto per ogni sabato, dalla base di ottobre a 98 il 13/2."]]},{h:0,sec:0,c:[["Freno"],["Due sabati di fila con il girovita a 98 o pi\xF9: da l\xEC Mantenimento fino alla fine."]]},{h:0,sec:0,c:[["P / C / G"],["Proteine, carboidrati, grassi, in grammi."]]},{h:0,sec:0,c:[["SHBG"],["Proteina che lega il testosterone: serve per calcolare quello libero, insieme all'albumina."]]},{h:0,sec:0,c:[["PCR"],["Indice di infiammazione: se \xE8 alta, la ferritina risulta pi\xF9 alta del vero."]]},{h:0,sec:0,c:[["HbA1c"],["Media della glicemia degli ultimi 2-3 mesi."]]},{h:0,sec:0,c:[["ALT, AST, GGT"],["Enzimi del fegato. ALT e AST salgono anche dopo l'allenamento: per questo il prelievo \xE8 a 72 ore dalle gambe."]]},{h:0,sec:0,c:[["CK"],["Enzima dei muscoli: sale con l'allenamento nuovo."]]},{h:0,sec:0,c:[["Creatinina, eGFR"],["Funzione dei reni. La creatina alza un po' la creatinina senza danni: va detto al medico."]]},{h:0,sec:0,c:[["Lp(a)"],["Una lipoproteina in gran parte genetica: basta misurarla una volta."]]},{h:0,sec:0,c:[["TSH"],["Ormone della tiroide."]]}]},{t:"h1",x:"Fonti"},{t:"sm",r:[["Qui solo le fonti citate in questo documento. Quelle delle scelte di fondo (ritmo, surplus, proteine, definizione) sono nei documenti v3.1.","i"]]},{t:"p",r:["Lamon S. e altri, privazione di sonno e sintesi proteica, Physiological Reports, 2021 \u2014 ","https://pmc.ncbi.nlm.nih.gov/articles/PMC7785053/"]},{t:"p",r:["Saner N.J. e altri, restrizione del sonno e sintesi proteica miofibrillare, Journal of Physiology, 2020 \u2014 ","https://www.ncbi.nlm.nih.gov/pmc/articles/PMC7217042/"]},{t:"p",r:["Kreider R.B. e altri, ISSN position stand sulla creatina, JISSN, 2017 \u2014 ","https://pmc.ncbi.nlm.nih.gov/articles/PMC5469049/"]},{t:"p",r:["Shaw G. e altri, gelatina con vitamina C e sintesi di collagene, American Journal of Clinical Nutrition, 2017 \u2014 ","https://pubmed.ncbi.nlm.nih.gov/27852613/"]},{t:"p",r:["Maeo S. e altri, estensi
