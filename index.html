<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Fase 4" />
<meta name="theme-color" content="#0b0d10" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="apple-touch-icon" href="./apple-touch-icon.png" />
<link rel="icon" type="image/png" href="./icon-192.png" />
<title>Fase 4 · Marco</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Mono:wght@400;500&display=swap" media="print" onload="this.media='all'">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{background:#0b0d10;}
#root{min-height:100vh;}
:root{
  --bg:#0b0d10; --surface:#15181d; --surface2:#1c2026; --surface3:#232831; --border:rgba(255,255,255,0.08);
  --text:#EAEEF2; --muted:#8B929C; --soft:#b7bdc6; --accent:#F5503E; --green:#43C59E; --yellow:#F2B33D; --blue:#4C9BFF;
  --disp:'Bricolage Grotesque',sans-serif; --body:'DM Sans',sans-serif; --mono:'DM Mono',monospace;
}
.app{font-family:var(--body);background:var(--bg);color:var(--text);min-height:100vh;max-width:560px;margin:0 auto;display:flex;flex-direction:column;position:relative;}
.scroll{flex:1;padding-block:14px calc(100px + env(safe-area-inset-bottom, 0px));padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));}
.view{display:flex;flex-direction:column;gap:12px;animation:fade .2s ease;}
@keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}

.topbar{position:sticky;top:0;z-index:5;background:rgba(11,13,16,0.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding-block:calc(10px + env(safe-area-inset-top, 0px)) 10px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));}
.brand{display:flex;align-items:center;gap:10px;}
.brand-mark{font-family:var(--disp);font-weight:800;font-size:17px;background:var(--accent);color:#0b0d10;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;letter-spacing:-1px;}
.brand-t{font-family:var(--disp);font-weight:800;font-size:16px;letter-spacing:1px;}
.brand-s{font-size:11px;color:var(--muted);}
.brand-v{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--muted);text-align:right;line-height:1.3;}
.prova{color:#0b0d10;background:var(--yellow);border-radius:6px;padding:1px 6px;font-weight:700;font-family:var(--body);}

.sec-h{font-family:var(--disp);font-weight:800;font-size:22px;letter-spacing:-.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.badge{font-family:var(--body);font-size:10.5px;font-weight:600;color:var(--accent);background:rgba(245,80,62,.12);padding:3px 8px;border-radius:20px;white-space:nowrap;}
.badge.g{color:var(--green);background:rgba(67,197,158,.12);}
.badge.y{color:var(--yellow);background:rgba(242,179,61,.12);}
.badge.b{color:var(--blue);background:rgba(76,155,255,.12);}
.badge.m{color:var(--muted);background:var(--surface2);}

.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;}
.card.warn{border-color:rgba(242,179,61,.35);}
.card.danger{border-color:rgba(245,80,62,.4);}
.card.ok{border-color:rgba(67,197,158,.3);}
.card.lb{border-left:3px solid var(--accent);}
.card-title{font-family:var(--disp);font-weight:700;font-size:15px;color:#d5dae1;margin-bottom:10px;letter-spacing:-.2px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.card-note{font-size:12px;color:var(--muted);line-height:1.45;margin-bottom:8px;}
.small{font-size:12px;color:var(--muted);line-height:1.45;}
.txt{font-size:13.5px;line-height:1.5;color:var(--soft);}
.txt b{color:var(--text);}
.mono{font-family:var(--mono);}
.row{display:flex;align-items:center;gap:8px;}
.row.wrap{flex-wrap:wrap;}
.sp{flex:1;}
.mt8{margin-top:8px;} .mt12{margin-top:12px;} .mb8{margin-bottom:8px;}

.datenav{display:flex;align-items:center;gap:8px;}
.datenav .dn-d{flex:1;text-align:center;font-family:var(--disp);font-weight:700;font-size:17px;}
.navbtn{background:var(--surface);border:1px solid var(--border);color:var(--text);width:40px;height:38px;border-radius:10px;font-size:20px;cursor:pointer;}
.linkbtn{background:none;border:none;color:var(--accent);font-family:var(--body);font-weight:600;font-size:12.5px;cursor:pointer;padding:4px 0;}

.phase{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:14px;padding:14px;}
.phase.sc{border-left-color:var(--yellow);} .phase.fe{border-left-color:var(--green);} .phase.pre{border-left-color:var(--blue);}
.phase-k{font-size:10.5px;font-weight:700;letter-spacing:.8px;color:var(--accent);}
.phase.sc .phase-k{color:var(--yellow);} .phase.fe .phase-k{color:var(--green);} .phase.pre .phase-k{color:var(--blue);}
.phase-n{font-family:var(--disp);font-weight:800;font-size:20px;letter-spacing:-.4px;margin-top:4px;}
.phase-s{font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.4;}

.bullet{font-size:13px;line-height:1.5;color:var(--soft);padding-left:14px;position:relative;margin-top:6px;}
.bullet::before{content:'•';position:absolute;left:2px;color:var(--accent);}
.bullet.w::before{color:var(--yellow);}

.opts{display:flex;flex-wrap:wrap;gap:6px;}
.opt{background:var(--surface2);border:1px solid var(--border);color:var(--soft);border-radius:9px;padding:8px 11px;font-family:var(--body);font-size:13px;cursor:pointer;min-height:38px;min-width:38px;}
.opt.on{background:rgba(245,80,62,.15);border-color:var(--accent);color:var(--text);font-weight:600;}
.opt.sm{padding:6px 9px;font-size:12.5px;min-height:36px;min-width:36px;}
.lbl{font-size:11.5px;color:var(--muted);margin:10px 0 6px;letter-spacing:.2px;}

.inp{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:10px 11px;color:var(--text);font-family:var(--body);font-size:16px;width:100%;outline:none;}
.inp:focus{border-color:var(--accent);}
.inp.sm{padding:8px 9px;font-size:15px;}
.inp.mono{font-family:var(--mono);font-size:15px;}
input[type=date].inp,input[type=time].inp{min-height:42px;}
select.inp{appearance:none;-webkit-appearance:none;}
.ta{min-height:64px;resize:vertical;}
.btn{background:var(--accent);color:#0b0d10;border:none;border-radius:10px;padding:10px 16px;font-family:var(--body);font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap;}
.btn:disabled{opacity:.4;}
.btn.sec{background:var(--surface3);color:var(--text);border:1px solid var(--border);}
.btn.full{width:100%;padding:12px;}
.btn.sm{padding:7px 11px;font-size:12.5px;}
.del{background:none;border:none;color:var(--muted);font-size:15px;cursor:pointer;padding:6px 8px;min-width:40px;min-height:40px;}
.del.ask{color:var(--accent);font-size:11.5px;font-weight:700;font-family:var(--body);}
.btn.ask{background:var(--yellow);}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px;}
.stat-l{font-size:11px;color:var(--muted);margin-bottom:5px;}
.stat-v{font-family:var(--disp);font-weight:800;font-size:25px;letter-spacing:-.8px;line-height:1.05;}
.stat-u{font-size:13px;font-weight:600;color:var(--muted);margin-left:2px;}
.stat-s{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.35;}

.check{width:100%;display:flex;align-items:flex-start;gap:10px;background:none;border:none;border-bottom:1px solid var(--border);padding:9px 0;cursor:pointer;text-align:left;font-family:var(--body);color:var(--text);}
.check:last-child{border-bottom:none;}
.box{width:22px;height:22px;border:1.5px solid rgba(255,255,255,.18);border-radius:7px;flex-shrink:0;display:grid;place-items:center;font-size:13px;color:#0b0d10;margin-top:1px;}
.check.on .box{background:var(--green);border-color:var(--green);}
.check-t{display:flex;flex-direction:column;min-width:0;flex:1;}
.check-t b{font-size:13px;font-weight:600;}
.check-t small{font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.35;}
.check.on .check-t b{color:var(--muted);text-decoration:line-through;}
.prog{font-family:var(--mono);font-size:11px;color:var(--muted);}

.meal{border-top:1px solid var(--border);padding-top:10px;margin-top:10px;}
.meal:first-of-type{border-top:none;padding-top:0;margin-top:0;}
.meal-h{display:flex;align-items:baseline;gap:8px;margin-bottom:4px;}
.meal-n{font-family:var(--disp);font-weight:700;font-size:14px;}
.meal-o{font-size:11.5px;color:var(--muted);flex:1;}
.meal-k{font-family:var(--mono);font-size:11.5px;color:var(--soft);white-space:nowrap;}
.food{display:flex;align-items:flex-start;gap:9px;padding:7px 0;border-bottom:1px dashed rgba(255,255,255,.06);}
.food:last-child{border-bottom:none;}
.food .box{width:24px;height:24px;border-radius:7px;cursor:pointer;}
.food-t{cursor:pointer;}
.food.on .box{background:var(--green);border-color:var(--green);}
.food-t{flex:1;min-width:0;}
.food-l{font-size:13.5px;line-height:1.35;}
.food.on .food-l{color:var(--muted);text-decoration:line-through;}
.food-l.sub{color:var(--blue);}
.food-l.tolto{color:var(--muted);text-decoration:line-through;}
.food-n{font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.35;}
.food-k{font-family:var(--mono);font-size:11.5px;color:var(--muted);white-space:nowrap;margin-top:2px;}
.swap{position:relative;flex-shrink:0;}
.swap select{position:absolute;inset:0;opacity:0;width:100%;height:100%;font-size:16px;}
.swap-b{display:grid;place-items:center;width:40px;height:34px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);color:var(--soft);font-size:13px;}
.swap.on .swap-b{border-color:var(--blue);color:var(--blue);background:rgba(76,155,255,.1);}
.libero{font-size:13px;color:var(--soft);line-height:1.45;padding:4px 0;}
.tot{display:flex;justify-content:space-between;font-family:var(--mono);font-size:12px;color:var(--soft);background:var(--surface2);border-radius:9px;padding:8px 10px;margin-top:10px;}

.ex{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;}
.ex.out{opacity:.55;}
.ex-h{display:flex;gap:10px;align-items:flex-start;padding:12px 13px;cursor:pointer;}
.ex-num{font-family:var(--mono);font-size:12px;color:var(--muted);min-width:22px;padding-top:2px;}
.ex-t{flex:1;min-width:0;}
.ex-n{font-family:var(--disp);font-weight:700;font-size:15px;letter-spacing:-.2px;line-height:1.25;}
.ex-m{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.4;}
.ex-m b{color:var(--text);font-family:var(--mono);font-weight:500;}
.ex-b{border-top:1px solid var(--border);padding:12px 13px;display:flex;flex-direction:column;gap:10px;}
.tip{font-size:12.5px;line-height:1.45;border-radius:10px;padding:9px 11px;background:var(--surface2);color:var(--soft);}
.tip.up{background:rgba(67,197,158,.1);color:#b9ead9;}
.tip.start{background:rgba(76,155,255,.1);color:#c5ddff;}
.tip.warn{background:rgba(242,179,61,.1);color:#f5dca6;}
.tip.bad{background:rgba(245,80,62,.1);color:#ffc7bf;}
.hist{display:flex;flex-direction:column;}
.hrow{display:flex;gap:8px;align-items:center;font-size:12.5px;padding:6px 0;border-bottom:1px solid var(--border);}
.hrow:last-child{border-bottom:none;}
.hrow .hd{font-family:var(--mono);color:var(--muted);min-width:44px;}
.hrow .hs{font-family:var(--mono);flex:1;min-width:0;word-break:break-word;}
.hrow .hn{font-size:11px;color:var(--yellow);}
.hrow .hi{font-size:11px;}
.ss{font-size:10px;font-weight:700;color:var(--blue);border:1px solid rgba(76,155,255,.4);border-radius:5px;padding:0 4px;margin-left:4px;}

.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:560px;display:flex;background:rgba(17,19,23,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom);z-index:10;}
.tab{flex:1;background:none;border:none;color:var(--muted);padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;font-family:var(--body);}
.tab.active{color:var(--accent);}
.tab-ic{font-size:18px;line-height:1;}
.tab-l{font-size:10.5px;font-weight:600;}

.tbl{width:100%;border-collapse:collapse;font-size:12.5px;}
.tbl th{text-align:left;font-weight:600;color:var(--muted);font-size:11px;padding:6px 6px;border-bottom:1px solid var(--border);}
.tbl td{padding:7px 6px;border-bottom:1px solid var(--border);vertical-align:top;line-height:1.35;}
.tbl td.n{font-family:var(--mono);text-align:right;white-space:nowrap;}
.tbl tr.dim td{color:var(--muted);}
.tbl tr.hl td{background:rgba(245,80,62,.06);}

.vrow{display:flex;gap:8px;font-size:12.5px;line-height:1.45;padding:6px 0;border-bottom:1px solid var(--border);}
.vrow:last-child{border-bottom:none;}
.vrow .vn{font-family:var(--mono);color:var(--muted);min-width:34px;}
.vrow .ve{font-family:var(--mono);font-weight:600;margin-left:auto;white-space:nowrap;}

.menu-row{width:100%;display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:13px 14px;color:var(--text);font-family:var(--body);font-size:14px;cursor:pointer;text-align:left;}
.menu-row .chev{margin-left:auto;color:var(--muted);font-size:20px;}
.back{background:none;border:none;color:var(--accent);font-family:var(--body);font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:4px;padding:2px 0;}

.doc h1{font-family:var(--disp);font-weight:800;font-size:20px;color:var(--accent);margin:6px 0 4px;letter-spacing:-.3px;}
.doc h2{font-family:var(--disp);font-weight:700;font-size:15.5px;margin:16px 0 6px;color:#e4e8ed;}
.doc p{font-size:13.5px;line-height:1.55;color:var(--soft);margin:6px 0;}
.doc p.sm{font-size:12px;color:var(--muted);font-style:italic;}
.doc ul{margin:4px 0 6px 0;padding-left:16px;}
.doc li{font-size:13.5px;line-height:1.5;color:var(--soft);margin:4px 0;}
.doc b{color:var(--text);}
.doc .tw{overflow-x:auto;margin:8px 0;border:1px solid var(--border);border-radius:10px;}
.doc table{border-collapse:collapse;font-size:12px;min-width:100%;}
.doc th{background:var(--surface3);color:var(--text);text-align:left;padding:7px 8px;font-weight:600;}
.doc td{padding:7px 8px;border-top:1px solid var(--border);color:var(--soft);vertical-align:top;line-height:1.4;}
.doc tr.sec td{background:rgba(245,80,62,.1);color:var(--accent);font-weight:700;}
.doc tr.hl td{background:rgba(242,179,61,.07);}
.doc tr.dim td{color:var(--muted);}

.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#e9edf1;color:#0b0d10;font-size:13px;font-weight:600;padding:9px 14px;border-radius:10px;z-index:20;max-width:90%;text-align:center;}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 7px;border-radius:6px;background:var(--surface2);color:var(--soft);margin-right:4px;}
.sep{height:1px;background:var(--border);margin:10px 0;}
details summary{cursor:pointer;font-size:12.5px;color:var(--accent);font-weight:600;list-style:none;}
details summary::-webkit-details-marker{display:none;}
.editbox{border-top:1px solid var(--border);padding:6px 0 8px;}
.btn.cambia{min-height:36px;min-width:72px;}
.ex-b details > summary{display:flex;align-items:center;min-height:44px;padding:0 12px;margin:2px 0;border:1px solid var(--border);border-radius:10px;background:var(--surface2);color:var(--accent);font-weight:600;font-size:13.5px;cursor:pointer;list-style:none;}
.ex-b details > summary::-webkit-details-marker{display:none;}
.ex-b details[open] > summary{background:var(--surface3);}

:root{color-scheme:dark;}
body{background:#0b0d10;color:#EAEEF2;}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:#0b0d10;}
/* 3/11: la barra in alto resta a top 0 con lo spazio della tacca dentro (padding di app.css); con top = tacca copriva l'inizio della pagina nell'app installata */
.tabbar{padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px));}/* v19-2: colori delle sedute (blu Martedì, verde Giovedì, giallo Sabato) */
.opt.s-mar.on{background:color-mix(in srgb,var(--blue) 22%,transparent);border-color:var(--blue);}
.opt.s-gio.on{background:color-mix(in srgb,var(--green) 22%,transparent);border-color:var(--green);}
.opt.s-sab.on{background:color-mix(in srgb,var(--yellow) 22%,transparent);border-color:var(--yellow);}
.card.sed-mar{border-top:3px solid var(--blue);}
.card.sed-gio{border-top:3px solid var(--green);}
.card.sed-sab{border-top:3px solid var(--yellow);}
/* v19-2 (28/10): solo scorrimento su e giù, barra in basso ferma */
/* 3/11: niente overflow su html e body: rompeva la barra in alto (sticky) nell'app sul telefono */
html{overscroll-behavior:none;}
body{touch-action:manipulation;}
.app{overflow-x:clip;}
.grid2{grid-template-columns:repeat(2,minmax(0,1fr));}
/* campi a 16 px: il telefono non ingrandisce la pagina quando li tocchi */
.inp.sm,.inp.mono{font-size:16px;}
input[type=date].inp,input[type=time].inp{-webkit-appearance:none;appearance:none;min-width:0;max-width:100%;text-align:left;}
input[type=date].inp::-webkit-date-and-time-value,input[type=time].inp::-webkit-date-and-time-value{text-align:left;}
/* Inizio e Durata della seduta: stessa misura */
.pari .inp{height:44px;min-height:44px;width:100%;}
/* Allena: tasto + accanto al campo delle serie; tre tasti delle sedute */
.btn.piu{min-width:52px;height:44px;padding:0 14px;font-size:20px;line-height:1;}
.btn.piu:disabled{opacity:.45;}
.sedute3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));}
.sedute3 .opt{font-size:14px;font-weight:700;min-height:44px;}
.navbtn:disabled{opacity:.35;}
/* Peso: cornice attorno a pesata, media e trend */
.cornice{border:2px solid var(--blue);background:rgba(76,155,255,.08);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:10px;}
.cornice .stat{background:var(--surface2);}
/* Peso: riquadri con la cornice blu (28/10) */
.cornici .card{border:2px solid var(--blue);}
</style>
</head>
<body>
