ne 3, "Sedute in altri giorni"). 103 serie a settimana dal 3/11; 105 dalla settimana 3 (di solito dal 19/11) se domenica 15/11 le prime due settimane sono pulite (sezione 3, "Due serie in pi\xF9 per le braccia"). Scarichi nelle settimane 8 (Natale) e 14. Le regole sono avvisi: decidi tu.']]},{h:0,sec:0,c:[[["Ritmo del peso","b"]],["0,2 kg a settimana, corridoio 0,1-0,3. Decide il trend di 4 settimane, non la singola pesata."]]},{h:0,sec:0,c:[[["Girovita","b"]],["Ogni sabato, 3 letture. Una linea sale dalla base di ottobre a 98 il 13/2. Freno a 98."]]},{h:0,sec:0,c:[[["Calorie","b"]],["Menu Base: circa 2.590 kcal di media al giorno nella settimana tipo; con le sedute in altri giorni la media cambia di poco, grazie alla regola della cena grande (sezione 4). Gradini dal Mantenimento a +3: il gradino di partenza si decide il 1/11, poi lo cambiano le verifiche oppure lo scegli tu nel menu."]]},{h:0,sec:0,c:[[["Integratori","b"]],["Gli stessi di oggi. Cambiano gli orari di ferro e vitamina C, del collagene (prima della seduta) e della D3 nei giorni con la seduta al mattino o di pomeriggio (al pranzo)."]]},{h:0,sec:0,c:[[["Controlli","b"]],["Esami il 3/11. Misure e foto il 1/11, 29/11, 31/1 e 14/2. Bicipite anche il 6/12 e il 13/12, come controllo: il cambio dell'hammer lo decidono i carichi. Pressione ogni 4 settimane."]]},{h:0,sec:0,c:[[["A giugno, sulla carta","b"]],["Girovita stimato 90-93 cm a circa 76-77 kg (grasso stimato con la formula Navy: 90 cm = 16,7%, 91 cm = 17,5%). L'addome scolpito, circa 84 cm, \xE8 il traguardo del ciclo successivo (sezione 11)."]]}]},{t:"h1",x:"1. Calendario"},{t:"h2",x:"Da oggi alla partenza"},{t:"tab",w:[2300,7338],rows:[{h:1,sec:0,c:[[["Data","b"]],[["Cosa","b"]]]},{h:0,sec:0,c:[["Mar 27 \xB7 gio 29 \xB7 sab 31/10"],["Block 4. Sab 31: ultimo Giorno 3 del Block 4, girovita (terzo della base) e seconda prova del reverse curl, al cavo: segna i valori del pacco che usi. Dal 3/11 tieni l'attrezzo in cui il gomito sta meglio."]]},{h:0,sec:0,c:[["Dom 1/11"],["Pesata, misure complete e foto (sezione 7). Menu e integratori ancora del Block 4. La verifica del Block 4 non si fa: la sostituisce la partenza della Fase 4 (sezione 8). Io calcolo gradino di partenza, base e linea del girovita, carichi di partenza, e li metto nell'app."]]},{h:0,sec:0,c:[["Lun 2/11"],["Parte il menu della Fase 4 (giorno OFF), al gradino di partenza. Niente ferro n\xE9 vitamina C, perch\xE9 domani c'\xE8 il prelievo; collagene s\xEC, come sempre dopo lo spuntino; la sera creatina s\xEC, magnesio no (da confermare con il medico)."]]},{h:0,sec:0,c:[["Mar 3/11"],["Prelievo a digiuno la mattina (sezione 9); dopo il prelievo partono gli orari nuovi degli integratori. La sera, prima seduta della Fase 4."]]}]},{t:"h2",x:"Le settimane della Fase 4"},{t:"tab",w:[700,1800,2300,4838],rows:[{h:1,sec:0,c:[[["Sett.","b"]],[["Dal-al","b"]],[["Tipo","b"]],[["Date da ricordare","b"]]]},{h:0,sec:0,c:[["1"],["2/11 \u2192 8/11"],["Costruzione"],["Lun 2/11 menu della Fase 4 \xB7 mar 3/11 prelievo e prima seduta \xB7 sab 7/11 pressione"]]},{h:0,sec:0,c:[["2"],["9/11 \u2192 15/11"],["Costruzione"],["Dom 15/11 verifica \xB7 decisione delle 2 serie in pi\xF9 per le braccia"]]},{h:0,sec:0,c:[["3"],["16/11 \u2192 22/11"],["Costruzione"],["Sedute Gioved\xEC e Sabato di questa settimana (di solito gio 19 e sab 21/11): curl al cavo e hammer del Sabato a 4 serie, se decise il 15/11"]]},{h:0,sec:0,c:[["4"],["23/11 \u2192 29/11"],["Costruzione"],["Dom 29/11 verifica, tappa, misure e foto \xB7 revisione del sonno"]]},{h:0,sec:0,c:[["5"],["30/11 \u2192 6/12"],["Costruzione"],["Sab 5/12 pressione \xB7 dom 6/12 bicipite (prima misura)"]]},{h:0,sec:0,c:[["6"],["7/12 \u2192 13/12"],["Costruzione"],["Ultima seduta Sabato per la regola dell'hammer \xB7 dom 13/12 verifica e bicipite (seconda misura)"]]},{h:0,sec:0,c:[["7"],["14/12 \u2192 20/12"],["Costruzione"],["Prima seduta Sabato: se l'hammer non \xE8 salito dalla settimana 16-22/11, curl al cavo al posto dell'hammer"]]},{h:0,sec:0,hl:"FDF1DC",c:[["8"],["21/12 \u2192 27/12"],["Scarico (Natale)"],["Feste dal 21/12, fuori dai calcoli \xB7 dom 27/12: decisione delle 2 serie in pi\xF9 per le braccia, se il 15/11 non sono entrate"]]},{h:0,sec:0,c:[["9"],["28/12 \u2192 3/1"],["Costruzione"],["Sab 2/1 pressione \xB7 feste"]]},{h:0,sec:0,c:[["10"],["4/1 \u2192 10/1"],["Costruzione"],["Feste fino a domenica 10/1"]]},{h:0,sec:0,c:[["11"],["11/1 \u2192 17/1"],["Costruzione"],["Dom 17/1 verifica ed eventuale passaggio a 0,25-0,3"]]},{h:0,sec:0,c:[["12"],["18/1 \u2192 24/1"],["Costruzione"],["\u2014"]]},{h:0,sec:0,c:[["13"],["25/1 \u2192 31/1"],["Costruzione"],["Sab 30/1 pressione \xB7 dom 31/1 verifica, tappa, misure e foto, prolungamento \xB7 consegna del programma della definizione"]]},{h:0,sec:0,hl:"FDF1DC",c:[["14"],["1/2 \u2192 7/2"],["Scarico"],["\u2014"]]},{h:0,sec:0,c:[["15"],["8/2 \u2192 14/2"],["Costruzione, ultima settimana"],["Dom 14/2 fine della costruzione: misure complete e foto"]]},{h:0,sec:0,hl:"F2F3F5",c:[["16"],["15/2 \u2192 21/2"],["Solo se si prolunga"],["\u2014"]]},{h:0,sec:0,hl:"F2F3F5",c:[["17"],["22/2 \u2192 28/2"],["Solo se si prolunga"],["Sab 27/2 pressione \xB7 dom 28/2 verifica"]]},{h:0,sec:0,hl:"F2F3F5",c:[["18"],["1/3 \u2192 7/3"],["Solo se si prolunga"],["\u2014"]]},{h:0,sec:0,hl:"F2F3F5",c:[["19"],["8/3 \u2192 14/3"],["Solo se si prolunga"],["Dom 14/3 fine: misure complete e foto"]]}]},{t:"sm",r:[["Settimane 16-19 solo se il 31/1 si decide di prolungare (sezione 8). Le settimane vanno dal luned\xEC alla domenica.","i"]]},{t:"h1",x:"2. La giornata, ora per ora"},{t:"p",r:["Cosa mangi lo trovi nella sezione 4, gli integratori nella sezione 5. Qui c'\xE8 l'ordine della giornata. \u25CF = cambia rispetto a oggi. La giornata segue la seduta del giorno e il suo momento, non il giorno della settimana: ",["mattina (ingresso prima delle 11), pomeriggio (dalle 11, prima delle 17), sera (dalle 17)","b"],"; senza seduta \xE8 un giorno OFF. Gli orari qui sotto sono quelli della settimana tipo: con un altro ingresso tutto si sposta della stessa differenza. Cosa resta legato al giorno: in fondo alla sezione."]},{t:"h2",x:"Seduta di sera \xB7 giorno ON (di solito marted\xEC e gioved\xEC)"},{t:"tab",w:[2300,7338],rows:[{h:1,sec:0,c:[[["Quando","b"]],[["Cosa","b"]]]},{h:0,sec:0,c:[["6:00"],["Sveglia, bagno, pesata; il sabato girovita (3 letture, prima del ferro) e pressione nei sabati del calendario. \u25CF Ferro + vitamina C con acqua: latte e caff\xE8 almeno 60 minuti dopo."]]},{h:0,sec:0,c:[["7:00"],["Colazione \xB7 D3 + K2."]]},{h:0,sec:0,c:[["12:30"],["Pranzo \xB7 omega 3."]]},{h:0,sec:0,c:[["15:00"],["Ultimo caff\xE8 della giornata."]]},{h:0,sec:0,c:[["90 minuti prima (18:00)"],["Gallette e fesa."]]},{h:0,sec:0,c:[["45 minuti prima (18:45)"],["\u25CF Arancia o kiwi, con il collagene; nelle sedute Marted\xEC e Sabato anche una banana piccola."]]},{h:0,sec:0,c:[["19:30"],["Palestra: riscaldamento del Protocollo Guardia, poi la seduta: Marted\xEC circa 107 minuti, Gioved\xEC circa 91, Sabato circa 117. Durante la seduta solo acqua: 500-750 ml (nella seduta Sabato 750 ml-1 litro)."]]},{h:0,sec:0,c:[["Subito dopo la seduta (verso le 21:30-22)"],['Cena post-allenamento \xB7 creatina. Il sabato al suo posto il pasto libero. La seduta Sabato in un altro giorno, con il sabato senza seduta, ha pranzo e cena del giorno OFF (sezione 4, "Che giornata \xE8").']]},{h:0,sec:0,c:[["Prima di dormire"],["Magnesio. Luci spente alle 23:30."]]}]},{t:"h2",x:"Giorno senza seduta \xB7 OFF (di solito luned\xEC, mercoled\xEC, venerd\xEC, domenica)"},{t:"tab",w:[2300,7338],rows:[{h:1,sec:0,c:[[["Quando","b"]],[["Cosa","b"]]]},{h:0,sec:0,c:[["6:00"],["Sveglia, bagno, pesata. \u25CF Ferro + vitamina C con acqua."]]},{h:0,sec:0,c:[["7:00"],["Colazione \xB7 D3 + K2."]]},{h:0,sec:0,c:[["12:30"],["Pranzo \xB7 omega 3."]]},{h:0,sec:0,c:[["15:00"],["Ultimo caff\xE8."]]},{h:0,sec:0,c:[["16:30"],["Spuntino, poi il collagene."]]},{h:0,sec:0,c:[["20:00"],["Cena \xB7 creatina."]]},{h:0,sec:0,c:[["22:15"],["Magnesio. \u25CF Luci spente alle 22:45."]]}]},{t:"p",r:["Sabato senza seduta: come qui, con il girovita appena sveglio (prima del ferro) e la pressione nei sabati del calendario; la sera il pasto libero, con la creatina."]},{t:"h2",x:"Seduta al mattino (ingresso prima delle 11; di solito sabato)"},{t:"tab",w:[2300,7338],rows:[{h:1,sec:0,c:[[["Quando","b"]],[["Cosa","b"]]]},{h:0,sec:0,c:[["Appena sveglio"],["Bagno, pesata; il sabato girovita (3 letture, sezione 7) e pressione nei sabati del calendario. \u25CF Poi ferro con i 2 kiwi, almeno 2 ore prima dell'ingresso: per entrare alle 9, entro le 6:45-7:00. Se non ci stanno 2 ore: sezione 5."]]},{h:0,sec:0,c:[["60-75 minuti prima della seduta"],["Whey, banana grande, banana piccola, caff\xE8, collagene: verso le 7:45-8:00 per entrare alle 9, e comunque almeno 60 minuti dopo il ferro. La banana piccola, se preferisci, anche da sola, ma almeno 45 minuti prima dell'ingresso. Se entri pi\xF9 tardi, tutto si sposta della stessa differenza: anche spuntino salato, pranzo con D3 e omega 3, e yogurt."]]},{h:0,sec:0,c:[["Verso le 9"],["Palestra: riscaldamento del Protocollo Guardia, poi la seduta (Sabato circa 117 minuti, Marted\xEC 107, Gioved\xEC 91). Durante la seduta solo acqua: 750 ml-1 litro (Marted\xEC e Gioved\xEC 500-750 ml)."]]},{h:0,sec:0,c:[["Verso le 11:15"],["\u25CF Spuntino salato: pane e bresaola (sezione 4)."]]},{h:0,sec:0,c:[["12:30"],["Pranzo \xB7 \u25CF D3 + K2 \xB7 omega 3."]]},{h:0,sec:0,c:[["16:30"],["Yogurt greco."]]},{h:0,sec:0,c:[["Sera"],["Il sabato pasto libero. Gli altri giorni alle 20: cena post-allenamento se \xE8 la seduta Marted\xEC o Gioved\xEC, o la seduta Sabato quando il sabato c'\xE8 un'altra seduta; cena OFF se \xE8 la seduta Sabato e il sabato non ti alleni \xB7 creatina. Prima di dormire magnesio; luci spente alle 22:45 (il sabato quando puoi)."]]}]},{t:"p",r:[["Se la seduta Sabato si fa al mattino in un altro giorno ","b"],'(per esempio la domenica): quel giorno segue questa tabella, con la cena OFF alle 20; il sabato \xE8 un giorno OFF con il pasto libero la sera; girovita e pressione restano al sabato. Dalla domenica mattina alla seduta Marted\xEC del marted\xEC sera restano circa 58 ore invece di 82: la seduta Marted\xEC non cambia, ma non conta per gli allarmi (sezione 3, "Sedute in altri giorni").']},{t:"h2",x:"Seduta di pomeriggio (ingresso dalle 11, prima delle 17)"},{t:"tab",w:[2300,7338],rows:[{h:1,sec:0,c:[[["Quando","b"]],[["Cosa","b"]]]},{h:0,sec:0,c:[["Appena sveglio"],["Bagno, pesata; il sabato anche girovita e, nei sabati del calendario, pressione. Ferro con i 2 kiwi."]]},{h:0,sec:0,c:[["Almeno 60 minuti dopo il ferro"],["Colazione: latte, avena, mela, whey (sezione 4). Caff\xE8."]]},{h:0,sec:0,c:[["12:30"],["Pranzo \xB7 D3 + K2 \xB7 omega 3."]]},{h:0,sec:0,c:[["60 minuti prima della seduta"],["Whey, banana grande, collagene. Caff\xE8 solo se \xE8 entro le 14:30; pi\xF9 tardi, senza."]]},{h:0,sec:0,c:[["Ingresso"],["Palestra almeno 3 ore dopo il pranzo (dalle 15:30 con il pranzo alle 12:30; il pranzo non prima delle 11:30): riscaldamento e seduta come al mattino. Se entri prima delle 14:30, il pranzo va subito dopo i pesi e lo yogurt 3 ore dopo il pranzo. Niente banana piccola: arrivi con il pranzo o con la colazione, e con whey e banana grande."]]},{h:0,sec:0,c:[["Subito dopo"],["Yogurt greco 200 g."]]},{h:0,sec:0,c:[["Sera"],["Il sabato pasto libero. Gli altri giorni alle 20: cena post-allenamento (seduta Marted\xEC o Gioved\xEC; seduta Sabato se il sabato c'\xE8 un'altra seduta) o cena OFF (seduta Sabato con il sabato senza seduta) \xB7 creatina. Prima di dormire magnesio."]]}]},{t:"p",r:[["Perch\xE9 cos\xEC: ","b"],`il 23/8, allenato subito dopo pranzo, hai avuto l'unico calo generale sulle gambe: tra pranzo e pesi almeno 3 ore. Il caff\xE8 entro le 14:30 lascia circa 8 ore prima delle luci spente alle 22:45. Le calorie sono quelle della seduta al mattino (entro 10 kcal), con cibi diversi: colazione dolce al mattino, whey e banana prima dei pesi, yogurt dopo (sezione 4). Quali sedute contano per i confronti: sezione 3, "Sedute in altri giorni". La seduta Sabato di pomeriggio resta fuori dai confronti: di pomeriggio, con la colazione in pi\xF9, di solito si rende di pi\xF9. Restano fuori anche la seduta Sabato fatta domenica mattina dopo un Gioved\xEC fatto il gioved\xEC (61,5 ore) e la seduta Marted\xEC dopo una domenica (52-58,5 ore); conta invece la seduta Sabato fatta domenica mattina dopo un Gioved\xEC fatto venerd\xEC sera (37,5 ore).`]},{t:"h2",x:"Se la seduta cambia giorno"},{t:"p",r:[["Restano legati al giorno: ","b"],"pesata; girovita il sabato appena sveglio; pressione e misure nelle date del calendario; pasto libero il sabato sera (anche senza seduta, o dopo una seduta di sera); niente legumi e niente alcol il venerd\xEC sera; feste."]},{t:"p",r:[["Seguono la seduta: ","b"],'menu, spuntino pre-allenamento, collagene, banana piccola prima dei pesi, cena grande, ferro con i kiwi, D3 al pranzo, luci spente alle 23:30 dopo una seduta di sera. Ogni seduta ha una sola cena grande: la cena post-allenamento, oppure il pasto libero del sabato sera. Il pasto libero \xE8 la cena grande della seduta che fai il sabato; se il sabato non ti alleni, della seduta Sabato fatta in un altro giorno, che quel giorno ha la cena OFF. Cos\xEC la settimana resta uguale (sezione 4, "Che giornata \xE8").']},{t:"p",r:[["Due sedute nello stesso giorno: ","b"],"la prima segue il suo momento fino al pranzo compreso; la seconda entra almeno 3 ore dopo il pranzo, e 90 minuti prima c'\xE8 lo spuntino pre-allenamento al posto dello yogurt o dello spuntino delle 16:30 (il frutto senza il collagene; se \xE8 la seduta Marted\xEC o Sabato, con il frutto anche la banana piccola); una sola cena grande (la cena post-allenamento; il sabato il pasto libero); collagene una volta, prima della prima seduta. ",["Seduta saltata ","b"],"quando hai gi\xE0 mangiato colazione o pranzo: da l\xEC i pasti del giorno OFF. Seduta decisa quando hai gi\xE0 mangiato colazione o pranzo del giorno OFF: da l\xEC i pasti della seduta. Di sera: lo spuntino pre-allenamento (con la banana piccola nelle sedute Marted\xEC e Sabato) al posto di quello delle 16:30, poi la cena della seduta. Di pomeriggio: whey, banana grande e collagene 60 minuti prima e lo yogurt dopo i pesi, al posto dello spuntino delle 16:30, poi la cena della seduta."]},{t:"h1",x:"3. L'allenamento"},{t:"h2",x:"Prima di ogni seduta"},{t:"li",r:[["Riscaldamento del Protocollo Guardia, ","b"],"circa 10 minuti: 5 minuti di cyclette a resistenza bassa-media (80-90 giri al minuto), 10 sit-to-stand controllati da una panca, 15 Leg Curl seduto molto leggeri. Nella seduta Marted\xEC all'inizio fai solo la cyclette: sit-to-stand e Leg Curl leggeri si fanno subito prima della monopodalica, che arriva dopo pi\xF9 di un'ora di parte alta."]},{t:"li",r:[["Alzate laterali, ","b"],"primo esercizio delle sedute Marted\xEC e Gioved\xEC: prima una serie da 15 con un manubrio di 2 numeri sotto quello di lavoro. Non si registra."]},{t:"li",r:[["Key lift ","b"],"(Chest Press, Lat Machine, Leg Press piedi bassi): 3 serie di avvicinamento, che non si registrano. Circa 50% \xD7 10, 70% \xD7 5, 85% \xD7 3 del peso di lavoro, arrotondati al salto della macchina; 60 secondi tra una e l'altra. Con 120 kg alla pressa: 60 \xD7 10, 80 \xD7 5, 100 \xD7 3."]},{t:"li",r:[["Monopodalica: ","b"],"dopo sit-to-stand e Leg Curl leggeri, 2 serie leggere per gamba: circa 50% \xD7 10 e 75% \xD7 5."]},{t:"li",r:[["Leg Press piedi alti, nella seduta Sabato: ","b"],"arriva dopo croci e braccia, circa 23 minuti senza gambe: prima una serie da 8 a circa il 60%."]},{t:"li",r:[["Vertical Row, nella seduta Sabato: ","b"],"\xE8 il primo esercizio della parte alta: prima una serie da 10 a circa il 50%."]},{t:"li",r:[["Reverse curl, a fine seduta Sabato: ","b"],"prima una serie da 15 con la barra vuota (o il primo valore del pacco), lenta."]},{t:"sm",r:[["Le durate qui sotto comprendono riscaldamento e serie di avvicinamento. Il metodo \xE8 tarato sulle sedute del Block 4 (73 minuti stimati contro 72 reali il 13/10, 88 contro 90 il 10/10); in pi\xF9 conta le serie di avvicinamento che la Fase 4 aggiunge. Con la Vertical Row il marted\xEC sarebbe durato circa 115 minuti (la stima di allora, 107, non contava le serie di avvicinamento in pi\xF9); senza la Vertical Row torna a circa 107. Il reverse curl aggiunge circa 7 minuti al sabato.","i"]]},{t:"h2",x:"Le tre sedute"},{t:"p",r:[["Superserie (5A e 5B, 7A e 7B, 5A e 5B): ","b"],"una serie di A, subito una serie di B, poi 90 secondi di recupero, e si ripete; i 90 secondi dopo ogni giro, anche il primo. Se i due esercizi hanno serie diverse, nei giri in pi\xF9 fai solo quello che ne ha di pi\xF9. Sono muscoli opposti: mentre lavora uno, l'altro recupera."]},{t:"h2",x:"Seduta Marted\xEC \xB7 Upper A + gambe B (di solito marted\xEC sera)"},{t:"tab",w:[620,3100,1500,1700,2718],rows:[{h:1,sec:0,c:[[["#","b"]],[["Esercizio","b"]],[["Serie \xD7 rip.","b"]],[["Recupero","b"]],[["Salto (kg)","b"]]]},{h:0,sec:0,c:[["1"],["Alzate laterali manubri"],["5\xD712-15"],["60 s"],["manubri"]]},{h:0,sec:0,c:[["2"],["Chest Press inclinata \u2605"],["4\xD76-8"],["2,5-3 min"],["2,5"]]},{h:0,sec:0,c:[["3"],["Lat Machine avanti \u2605"],["4\xD76-8"],["2,5-3 min"],["5"]]},{h:0,sec:0,c:[["4"],["Pec Deck"],["3\xD710-12"],["90 s"],["2,5"]]},{h:0,sec:0,c:[["5A"],["Estensioni overhead"],["3\xD710-12"],["\u2014"],["cavo"]]},{h:0,sec:0,c:[["5B"],["Hammer curl"],["3\xD710-12"],["90 s dopo il giro"],["manubri"]]},{h:0,sec:0,c:[["6"],["Leg Press monopodalica"],["3\xD78-15/gamba"],["90 s dopo le due gambe"],["10"]]},{h:0,sec:0,c:[["7"],["Calf alla Leg Press"],["3\xD715-20"],["60 s"],["10"]]},{h:0,sec:0,c:[["8"],["Leg Curl richiamo"],["3\xD710-12"],["75 s"],["5"]]}]},{t:"p",r:["31 serie \xB7 circa 107 minuti. ",["Se devi chiudere prima","b"],": salta prima il calf, poi il Leg Curl richiamo."]},{t:"li",r:[["Alzate laterali manubri. ","b"],"Sempre nella stessa posizione: il 3/11 scegli quella che usi di solito (seduto o in piedi) e la segni nell'app; se una volta cambi, quella seduta non conta. Schiena ferma. Gomiti appena piegati, sali fino all'altezza delle spalle, 1 s su, discesa lenta. Perch\xE9 qui: priorit\xE0 1, il rapporto spalle/vita: per prima, da fresco."]},{t:"li",r:[["Chest Press inclinata. ","b"],"Sellino come ora. Schiena sempre appoggiata, discesa controllata. Perch\xE9 qui: key lift. Recupero lungo per non perdere ripetizioni."]},{t:"li",r:[["Lat Machine avanti. ","b"],"Presa appena pi\xF9 larga delle spalle, tira con i gomiti verso i fianchi. Perch\xE9 qui: key lift. Dopo la Chest Press: muscoli opposti."]},{t:"li",r:[["Pec Deck. ","b"],"Chiudi senza far battere le leve, ritorno lento fino a sentire allungare il petto. Perch\xE9 qui: l'unico esercizio non inclinato, con il petto in allungamento completo: d\xE0 al petto un angolo diverso."]},{t:"li",r:[["Estensioni overhead. ","b"],"Al cavo, come nel Block 4. Gomiti fermi vicino alla testa, allungamento completo dietro la nuca. Perch\xE9 qui: al posto del push-down (revisione braccia del 17/10): con il braccio sopra la testa il capo lungo del tricipite lavora in allungamento, ed \xE8 la variante che lo fa crescere di pi\xF9. Superserie con l'hammer curl: 90 s dopo ogni giro."]},{t:"li",r:[["Hammer curl. ","b"],"Presa neutra (pollici in alto), gomiti fermi ai fianchi, niente slancio. Come nel Block 2. Perch\xE9 qui: bicipite, brachiale e brachioradiale, con la presa neutra."]},{t:"li",r:[["Leg Press monopodalica. ","b"],"Piede basso, in linea con il fianco. Stop a 90\xB0, con lo stesso riferimento visivo della pressa. Resti allo stesso peso finch\xE9 fai 15 ripetizioni su tutte le serie: poi il peso nuovo entra sulla prima serie. Perch\xE9 qui: gambe 2 volte a settimana: circa 82 ore dalla seduta Sabato, circa 85 fino alla seduta Sabato dopo (settimana tipo). Prima il riscaldamento del ginocchio e 2 serie leggere per gamba."]},{t:"li",r:[["Calf alla Leg Press. ","b"],"Ginocchia appena flesse, mai bloccate. Piede ben appoggiato sulla pedana, mai solo le punte sul bordo; se senti scivolare, ti fermi. Movimento completo, discesa lenta. Perch\xE9 qui: stessa macchina, subito dopo."]},{t:"li",r:[["Leg Curl richiamo. ","b"],"Pausa di 1 s in contrazione, ritorno lento. Perch\xE9 qui: femorali a circa 82 ore dalla seduta Sabato (settimana tipo)."]},{t:"h2",x:"Seduta Gioved\xEC \xB7 Upper B (di solito gioved\xEC sera)"},{t:"tab",w:[620,3100,1500,1700,2718],rows:[{h:1,sec:0,c:[[["#","b"]],[["Esercizio","b"]],[["Serie \xD7 rip.","b"]],[["Recupero","b"]],[["Salto (kg)","b"]]]},{h:0,sec:0,c:[["1"],["Alzate laterali manubri"],["5\xD712-15"],["60 s"],["manubri"]]},{h:0,sec:0,c:[["2"],["Distensioni inclinate manubri"],["3\xD78-10"],["2 min"],["manubri"]]},{h:0,sec:0,c:[["3"],["Pulley basso"],["3\xD710-12"],["2 min"],["5"]]},{h:0,sec:0,c:[["4"],["Shoulder Press macchina"],["3\xD78-10"],["2 min"],["2,5"]]},{h:0,sec:0,c:[["5"],["Face Pull"],["4\xD712-15"],["60 s"],["cavo"]]},{h:0,sec:0,c:[["6"],["Pull-down braccia tese"],["3\xD712-15"],["60 s"],["cavo"]]},{h:0,sec:0,c:[["7A"],["Push-down tricipiti"],["3\xD710-12"],["\u2014"],["cavo"]]},{h:0,sec:0,c:[["7B"],["Curl al cavo"],["3\xD710-12 (4 con le serie in pi\xF9 per le braccia, se entrano)"],["90 s dopo il giro"],["cavo"]]},{h:0,sec:0,c:[["8"],["Scrollate manubri"],["3\xD712-15"],["60 s"],["manubri"]]},{h:0,sec:0,c:[["9"],["Abductor Machine"],["3\xD712-15"],["60 s"],["5"]]}]},{t:"p",r:["33 serie \xB7 circa 91 minuti (34 e circa 93 con la serie in pi\xF9 delle braccia). ",["Se devi chiudere prima","b"],": salta prima le scrollate, poi l'Abductor."]},{t:"li",r:[["Alzate laterali manubri. ","b"],"Sempre nella stessa posizione: il 3/11 scegli quella che usi di solito (seduto o in piedi) e la segni nell'app; se una volta cambi, quella seduta non conta. Schiena ferma. Gomiti appena piegati, sali fino all'altezza delle spalle, 1 s su, discesa lenta. Perch\xE9 qui: priorit\xE0 1: per prima, da fresco."]},{t:"li",r:[["Distensioni inclinate manubri. ","b"],"Panca a 30\xB0, come in Fase 2. Scendi finch\xE9 senti allungare il petto, gomiti a circa 45\xB0 dal busto, non far battere i manubri. Perch\xE9 qui: petto alto, secondo strumento dopo la Chest Press."]},{t:"li",r:[["Pulley basso. ","b"],"Seduto, piedi sulla pedana, ginocchia morbide, busto verticale e fermo. Tira verso l'ombelico, 1 s di chiusura, ritorno con la schiena dritta. Se senti la lombare, scendi di carico. Perch\xE9 qui: busto fermo, senza arrotondare la schiena in allungamento."]},{t:"li",r:[["Shoulder Press macchina. ","b"],"Schiena appoggiata. Spingi fino quasi a distendere le braccia, discesa controllata. Perch\xE9 qui: dopo una tirata: spalle pi\xF9 fresche."]},{t:"li",r:[["Face Pull. ","b"],"Gomiti alti, rotazione esterna in fondo al movimento. Perch\xE9 qui: deltoide posteriore: la spalla vista di lato e da dietro."]},{t:"li",r:[["Pull-down braccia tese. ","b"],"Braccia quasi tese, porta la barra alle cosce con i dorsali. Perch\xE9 qui: larghezza del dorso, con la barra."]},{t:"li",r:[["Push-down tricipiti. ","b"],"Gomiti fermi ai fianchi. Stesso attrezzo del Block 4, cos\xEC i carichi restano confrontabili. Perch\xE9 qui: dopo il pull-down, dove lavora il capo lungo del tricipite. Superserie: 90 s dopo ogni giro."]},{t:"li",r:[["Curl al cavo. ","b"],"Frontale alla macchina, puleggia nella posizione pi\xF9 bassa, barra EZ o dritta, un passo indietro. Gomiti fermi ai fianchi, 1 s in alto, busto fermo. Perch\xE9 qui: curl supinato: allena il bicipite che misuri contratto."]},{t:"li",r:[["Scrollate manubri. ","b"],"Da seduto con i manubri, senza cinghie. Sali dritto con le spalle, 1 s in alto, niente rotazioni. Perch\xE9 qui: senza cinghie, cos\xEC lavora anche la presa. 3 serie e non di pi\xF9: il collo \xE8 la misura pi\xF9 vicina al riferimento."]},{t:"li",r:[["Abductor Machine. ","b"],"Pausa di 1 s a gambe aperte, ritorno lento. Perch\xE9 qui: gluteo medio: stabilit\xE0 del ginocchio."]},{t:"h2",x:"Seduta Sabato \xB7 gambe A, dorso, petto ai cavi, braccia, spalle (di solito sabato mattina)"},{t:"tab",w:[620,3100,1500,1700,2718],rows:[{h:1,sec:0,c:[[["#","b"]],[["Esercizio","b"]],[["Serie \xD7 rip.","b"]],[["Recupero","b"]],[["Salto (kg)","b"]]]},{h:0,sec:0,c:[["1"],["Leg Press piedi bassi \u2605"],["4\xD78-10"],["2,5-3 min"],["10"]]},{h:0,sec:0,c:[["2"],["Vertical Row con appoggio"],["3\xD78-10"],["2 min"],["5"]]},{h:0,sec:0,c:[["3"],["Leg Curl seduto"],["4\xD710-12"],["90 s"],["5"]]},{h:0,sec:0,c:[["4"],["Croci ai cavi dal basso"],["4\xD712-15"],["60 s"],["cavo"]]},{h:0,sec:0,c:[["5A"],["Hammer curl"],["3\xD710-12 (4 con le serie in pi\xF9 per le braccia, se entrano)"],["\u2014"],["manubri"]]},{h:0,sec:0,c:[["5B"],["Estensioni overhead"],["4\xD710-12"],["90 s dopo il giro"],["cavo"]]},{h:0,sec:0,c:[["6"],["Leg Press piedi alti"],["4\xD710-12"],["2 min"],["10"]]},{h:0,sec:0,c:[["7"],["Calf alla Leg Press"],["4\xD715-20"],["60 s"],["10"]]},{h:0,sec:0,c:[["8"],["Richiamo alzate laterali"],["4\xD715-20"],["60 s"],["manubri"]]},{h:0,sec:0,c:[["9"],["Adductor Machine"],["3\xD712-15"],["60 s"],["5"]]},{h:0,sec:0,c:[["10"],["Reverse curl"],["2\xD712-15"],["75 s"],["EZ: 2 dischi pi\xF9 piccoli \xB7 cavo: valore del pacco"]]}]},{t:"p",r:["39 serie \xB7 circa 117 minuti (40 e circa 118 con la serie in pi\xF9 delle braccia). ",["Se devi chiudere prima","b"],": salta prima il calf, poi l'Adductor; il richiamo alzate e il reverse curl no."]},{t:"li",r:[["Leg Press piedi bassi. ","b"],"Piedi nella met\xE0 bassa della pedana, larghi come le anche, punte avanti o appena aperte. Stop a 90\xB0 di ginocchio, estensione completa senza bloccare. Bacino sempre appoggiato. La pressa non ha fermi: alla prima seduta scegli un riferimento visivo per i 90\xB0 (il bordo della slitta rispetto al telaio) e nelle ultime ripetizioni rallenta in discesa. Perch\xE9 qui: key lift. Discesa fino a circa 90\xB0, il bacino non si stacca."]},{t:"li",r:[["Vertical Row con appoggio. ","b"],"Petto sempre appoggiato. Gomiti indietro, 1 s di chiusura, ritorno controllato. Perch\xE9 qui: secondo rematore, con il petto in appoggio: schiena bassa scarica. Al sabato perch\xE9 il tempo in pi\xF9 al mattino non toglie sonno (tua scelta del 17/10). Subito dopo la pressa piedi bassi, cos\xEC i piedi alti arrivano dopo circa 23 minuti senza gambe invece di 33; prima delle braccia, che lavorano anche qui."]},{t:"li",r:[["Leg Curl seduto. ","b"],"Pausa di 1 s in contrazione, ritorno lento. Perch\xE9 qui: pausa di 1 s in contrazione."]},{t:"li",r:[["Croci ai cavi dal basso. ","b"],"Pulegge basse, un passo avanti, gomiti appena piegati, 1 s di chiusura senza far battere le maniglie. Perch\xE9 qui: stazione cavi libera al sabato. Separa le due presse."]},{t:"li",r:[["Hammer curl. ","b"],"Presa neutra (pollici in alto), gomiti fermi ai fianchi, niente slancio. Come nel Block 2. Perch\xE9 qui: braccia prima della seconda pressa, non a fine seduta. Superserie: 90 s dopo ogni giro."]},{t:"li",r:[["Estensioni overhead. ","b"],"Al cavo, come nel Block 4. Gomiti fermi vicino alla testa, allungamento completo dietro la nuca. Perch\xE9 qui: lavoro in allungamento: dopo seguono circa 82 ore di recupero. Il quarto giro \xE8 solo overhead; con l'hammer a 4 \xE8 completo."]},{t:"li",r:[["Leg Press piedi alti. ","b"],"Piedi alti e larghi, punte aperte al massimo di circa 15\xB0, ginocchia che seguono le punte. Ti fermi prima che il bacino si stacchi. Perch\xE9 qui: il fine corsa lo decide il bacino: ti fermi prima che si stacchi."]},{t:"li",r:[["Calf alla Leg Press. ","b"],"Ginocchia appena flesse, mai bloccate. Piede ben appoggiato sulla pedana, mai solo le punte sul bordo; se senti scivolare, ti fermi. Movimento completo, discesa lenta. Perch\xE9 qui: stessa macchina. Ginocchia appena flesse."]},{t:"li",r:[["Richiamo alzate laterali. ","b"],"Carico leggero, salita controllata, nella stessa posizione delle alzate. Perch\xE9 qui: controlla il recupero a 36 ore dalla seduta Gioved\xEC: la regola \xE8 in Regole di controllo."]},{t:"li",r:[["Adductor Machine. ","b"],"Pausa di 1 s a gambe chiuse, ritorno lento. Tacca 4 (al massimo 6). Perch\xE9 qui: gli adduttori sono una buona parte della coscia alta."]},{t:"li",r:[["Reverse curl. ","b"],"Presa prona (dorso delle mani in alto). Con l'EZ mani sulla curva esterna; al cavo barra dritta, puleggia bassa. Gomiti fermi ai fianchi, busto fermo, niente slancio, polso in linea con l'avambraccio (non piegato indietro), discesa in 2 s, escursione completa. 1-2 ripetizioni dal limite anche nell'ultima serie. Prima: una serie con la barra vuota (o il primo valore del pacco) \xD715, lenta. Perch\xE9 qui: brachioradiale ed estensori del polso (tua richiesta). Per ultimo, cos\xEC non tocca le altre regole della seduta Sabato. Se fa male il gomito all'esterno: regola nella sezione 3."]},{t:"sm",r:[[`La Vertical Row \xE8 passata dal marted\xEC al sabato il 17/10, per tua scelta, dopo che la revisione da preparatore ha stimato il marted\xEC a circa 115 minuti: il tempo in pi\xF9 va al sabato mattina e non toglie sonno. Il 17/10 pomeriggio, dopo la revisione delle braccia: estensioni overhead al posto del push-down il marted\xEC e reverse curl in fondo al sabato (103 serie a settimana). "Salto" \xE8 l'aumento minimo della macchina; per manubri e cavi vedi la tabella dei salti pi\xF9 sotto.`,"i"]]},{t:"h2",x:"Dal 3/11: subito la scheda piena"},{t:"p",r:[`Niente rampa (tua decisione del 21/10): dal 3/11 tutte le serie della scheda, 103 a settimana contro le 79 del Block 4, con i carichi del Block 4 (pi\xF9 sotto, "Carichi di partenza"). L'intensit\xE0 \xE8 quella di "Quanto spingere" fin dalla prima seduta (tua decisione del 27/10). Se nelle prime settimane qualcosa non va (gomito, ginocchio, stanchezza), lo segni nell'app e me lo dici: decidi tu.`]},{t:"h2",x:"Due serie in pi\xF9 per le braccia"},{t:"p",r:[`Tua proposta del 23/10, decisa il 27/10: curl al cavo della seduta Gioved\xEC e hammer della seduta Sabato da 3 a 4 serie, dalla settimana 3 (16-22/11): dalla seduta Gioved\xEC e dalla seduta Sabato di quella settimana, in qualunque giorno le fai (di solito gioved\xEC 19/11 e sabato 21/11), se domenica 15/11 le prime due settimane sono pulite: gomito senza voti di 3 o pi\xF9; niente "stanco" 3 mattine di fila; nessun key lift che perde 2 o pi\xF9 ripetizioni allo stesso peso; tutte e 6 le sedute fatte (definizioni nell'appendice, "Due serie in pi\xF9 per le braccia"). L'app te lo propone con i dati, con due tasti: Applica il consiglio o Resto a 103. Se una condizione manca, si riguarda domenica 27/12 con le stesse condizioni sulle settimane 6-7; se entrano allora, dalla settimana 9 (28/12-3/1), e al Sabato la serie in pi\xF9 va all'hammer, o al curl al cavo se la regola del bicipite l'ha gi\xE0 cambiato. Se il 15/11 scegli Resto a 103, te lo ripropone il 27/12, come se mancasse una condizione. Se il 27/12 manca ancora una condizione, o se prima \xE8 gi\xE0 scattato "Volume troppo alto", lo decidiamo insieme quel giorno: l'app te lo segnala con i dati. Perch\xE9 la settimana 3: il confronto della regola del bicipite parte dalla seduta Sabato della settimana 16-22/11 e deve avere tutte le sedute Sabato uguali. Cosa rendono: circa +14% di serie ai flessori del gomito (da 14 a 16 frazionali); sulla circonferenza, in una fase, meno dell'errore del metro (stima sui dati di Pelland 2026 e Holzbaur 2007). Il tricipite resta a 15 serie frazionali (\xE8 circa il 56% del muscolo del braccio, Holzbaur 2007).`]},{t:"h2",x:"Settimane di scarico: 8 (21-27/12) e 14 (1-7/2)"},{t:"p",r:['Stessi esercizi, stesso ordine, stessi carichi. Met\xE0 delle serie in vigore quella settimana (con tagli o riduzioni, la met\xE0 di quelle), arrotondata per eccesso, e ogni serie a 3-4 ripetizioni dal limite, anche se cos\xEC le ripetizioni scendono sotto il range: nello scarico progressione e "sotto il range" non valgono. In tutto 61 serie: seduta Marted\xEC circa 78 minuti, Gioved\xEC 67, Sabato 78. Le sedute di scarico non contano per nessun allarme. Se a Natale salti una seduta, non serve recuperarla: \xE8 gi\xE0 la settimana leggera. Sono di scarico tutte le sedute fatte da luned\xEC a domenica in quelle settimane.']},{t:"tab",w:[1700,4600,1600,1738],rows:[{h:1,sec:0,c:[["Seduta"],[["Esercizio","b"]],[["Serie normali","b"]],[["Serie di scarico","b"]]]},{h:0,sec:0,c:[["Marted\xEC"],["Alzate laterali manubri"],["5"],["3"]]},{h:0,sec:0,c:[["Marted\xEC"],["Chest Press inclinata \u2605"],["4"],["2"]]},{h:0,sec:0,c:[["Marted\xEC"],["Lat Machine avanti \u2605"],["4"],["2"]]},{h:0,sec:0,c:[["Marted\xEC"],["Pec Deck"],["3"],["2"]]},{h:0,sec:0,c:[["Marted\xEC"],["Estensioni overhead"],["3"],["2"]]},{h:0,sec:0,c:[["Marted\xEC"],["Hammer curl"],["3"],["2"]]},{h:0,sec:0,c:[["Marted\xEC"],["Leg Press monopodalica"],["3"],["2"]]},{h:0,sec:0,c:[["Marted\xEC"],["Calf alla Leg Press"],["3"],["2"]]},{h:0,sec:0,c:[["Marted\xEC"],["Leg Curl richiamo"],["3"],["2"]]},{h:0,sec:0,c:[["Gioved\xEC"],["Alzate laterali manubri"],["5"],["3"]]},{h:0,sec:0,c:[["Gioved\xEC"],["Distensioni inclinate manubri"],["3"],["2"]]},{h:0,sec:0,c:[["Gioved\xEC"],["Pulley basso"],["3"],["2"]]},{h:0,sec:0,c:[["Gioved\xEC"],["Shoulder Press macchina"],["3"],["2"]]},{h:0,sec:0,c:[["Gioved\xEC"],["Face Pull"],["4"],["2"]]},{h:0,sec:0,c:[["Gioved\xEC"],["Pull-down braccia tese"],["3"],["2"]]},{h:0,sec:0,c:[["Gioved\xEC"],["Push-down tricipiti"],["3"],["2"]]},{h:0,sec:0,c:[["Gioved\xEC"],["Curl al cavo"],["3 (4 con la serie in pi\xF9)"],["2"]]},{h:0,sec:0,c:[["Gioved\xEC"],["Scrollate manubri"],["3"],["2"]]},{h:0,sec:0,c:[["Gioved\xEC"],["Abductor Machine"],["3"],["2"]]},{h:0,sec:0,c:[["Sabato"],["Leg Press piedi bassi \u2605"],["4"],["2"]]},{h:0,sec:0,c:[["Sabato"],["Vertical Row con appoggio"],["3"],["2"]]},{h:0,sec:0,c:[["Sabato"],["Leg Curl seduto"],["4"],["2"]]},{h:0,sec:0,c:[["Sabato"],["Croci ai cavi dal basso"],["4"],["2"]]},{h:0,sec:0,c:[["Sabato"],["Hammer curl"],["3 (4 con la serie in pi\xF9)"],["2"]]},{h:0,sec:0,c:[["Sabato"],["Estensioni overhead"],["4"],["2"]]},{h:0,sec:0,c:[["Sabato"],["Leg Press piedi alti"],["4"],["2"]]},{h:0,sec:0,c:[["Sabato"],["Calf alla Leg Press"],["4"],["2"]]},{h:0,sec:0,c:[["Sabato"],["Richiamo alzate laterali"],["4"],["2"]]},{h:0,sec:0,c:[["Sabato"],["Adductor Machine"],["3"],["2"]]},{h:0,sec:0,c:[["Sabato"],["Reverse curl"],["2"],["1"]]}]},{t:"h2",x:"Quanto spingere e quando salire"},{t:"tab",w:[2500,7138],rows:[{h:1,sec:0,c:[[["Regola","b"]],[["Come funziona","b"]]]},{h:0,sec:0,c:[[["Intensit\xE0","b"]],["Ogni serie a 1-2 ripetizioni dal limite, anche la prima. L'ultima serie degli isolamenti della parte alta a 0-1: alzate, richiamo, Pec Deck, croci, Face Pull, pull-down a braccia tese, push-down, overhead, curl, hammer, scrollate. Il reverse curl no: 1-2 dal limite anche nell'ultima serie, per il gomito. Al tetto del range ti fermi anche se ne avresti altre: \xE8 il segnale per salire."]]},{h:0,sec:0,c:[[["Doppia progressione","b"]],["Quando chiudi il tetto del range su tutte le serie, alla seduta dopo sali del salto minimo e riparti dal fondo del range. Esempio: Pec Deck 3\xD712 a 40 kg \u2192 la volta dopo 42,5 kg, e punti a 10."]]},{h:0,sec:0,c:[[["Salto grande (oltre l'8%)","b"]],["Il peso nuovo entra una serie alla volta: prima solo la serie 1, poi le serie 1 e 2, e cos\xEC via. Aggiungi una serie al peso nuovo solo se tutte quelle gi\xE0 salite arrivano almeno al fondo del range. Se una serie al peso nuovo resta sotto il fondo, la volta dopo la rifai allo stesso peso; se resta sotto 2 volte di fila, l'app consiglia di tornare al peso precedente e riprovare dopo 2 sedute chiuse al tetto. Se resti al peso nuovo, dalla terza seduta la serie sotto il fondo conta come fatta un salto pi\xF9 in basso."]]},{h:0,sec:0,c:[[["Sotto il range","b"]],["Se una serie scende sotto il fondo del range, l'app consiglia di riportare le serie successive di quell'esercizio al peso precedente (lo trovi gi\xE0 nel campo del peso). Non vale nello scarico e nella settimana di ripresa dopo una malattia."]]},{h:0,sec:0,c:[[["Esecuzione","b"]],["Discesa controllata e salita senza strappi, come nel Block 4. Le pause di 1 s solo dove sono scritte."]]},{h:0,sec:0,c:[[["Storico","b"]],["Ogni esercizio ha uno storico per seduta: le alzate della seduta Marted\xEC si confrontano con quelle della seduta Marted\xEC prima, anche se l'hai fatta in un altro giorno; il push-down della seduta Gioved\xEC con quello della seduta Gioved\xEC prima, e cos\xEC via."]]}]},{t:"p",r:[["Salti delle tue macchine","b"]]},{t:"tab",w:[2900,6738],rows:[{h:1,sec:0,c:[[["Salto","b"]],[["Dove","b"]]]},{h:0,sec:0,c:[["2,5 kg"],["Chest Press inclinata, Pec Deck, Shoulder Press (25 \u2192 27,5)."]]},{h:0,sec:0,c:[["5 kg"],["Lat Machine, Pulley, Vertical Row (55 \u2192 60), Leg Curl (40, 45, 50: niente mezzi), Abductor (55 \u2192 60), Adductor."]]},{h:0,sec:0,c:[["10 kg"],["Leg Press (nessun disco piccolo) e calf alla Leg Press."]]},{h:0,sec:0,c:[["Manubri"],["4, 5, 6, 7,5, 8, 10, 12, 12,5, 14, 15, 16, 17,5, 18, poi di 2 in 2 (verificati da te il 1/10)."]]},{h:0,sec:0,c:[["Bilanciere EZ (reverse curl)"],["2,5 kg, i dischi pi\xF9 piccoli (1,25 per parte). Con la barra di circa 8 kg il peso \xE8 circa 10,5 kg: il salto vale circa +24%, \xE8 un salto grande e il peso nuovo entra una serie alla volta."]]},{h:0,sec:0,c:[["Cavi"],["Il valore successivo del pacco (quelli noti: 13,5 \xB7 15 \xB7 16 \xB7 17,5 \xB7 18,5; gli altri li segni la prima volta che li usi). Se quel salto supera l'8%, puoi usare il peso aggiuntivo da 1 kg come passo intermedio, quando \xE8 libero; se non c'\xE8, progressione a serie."]]}]},{t:"sm",r:[["Quando il salto vale pi\xF9 dell'8% si va a serie. Esempi: alzate 5 \u2192 6 kg (+20%), Lat 50 \u2192 55 (+10%), Shoulder Press 25 \u2192 27,5 (+10%), Leg Press 120 \u2192 130 (+8%), cavo 16 \u2192 17,5 (+9%). La Chest Press 45 \u2192 47,5 (+6%) sale su tutte le serie insieme.","i"]]},{t:"p",r:[["Carichi di partenza","b"]]},{t:"li",r:[["Chi li fissa: ","b"],"io, il 1/11, dai tuoi dati del Block 4. L'app li mostra alla prima seduta di ogni esercizio, come nel Block 4."]},{t:"li",r:[["Stesso esercizio e stesso range del Block 4: ","b"],"l'ultimo peso, con la doppia progressione. Vale anche quando cambia il giorno o la posizione (Lat nella seduta Marted\xEC, Shoulder Press nella seduta Gioved\xEC, overhead anche nella seduta Sabato, push-down nella seduta Gioved\xEC, monopodalica, calf e Leg Curl richiamo nella seduta Marted\xEC, Vertical Row nella seduta Sabato). Alla prima seduta: se una serie scende sotto il fondo del range, le successive scendono di un salto; il peso dell'ultima serie \xE8 la partenza della seduta dopo."]},{t:"li",r:[["Vertical Row: ","b"],"dai dati del 22 e del 29/10."]},{t:"li",r:[["Reverse curl: ","b"],"dalle due prove del Block 4 (tabella qui sotto): il peso dell'ultima serie della prova con l'attrezzo che scegli."]},{t:"li",r:[["Senza storico recente (distensioni inclinate con manubri, hammer curl): ","b"],"la prima seduta \xE8 di prova. Serie 1 con il peso scritto nell'app: per le distensioni 12 kg, il tuo peso della Fase 2; per l'hammer il peso lo scrivo il 1/11 dai tuoi curl del Block 4. Se fai pi\xF9 del tetto del range, la serie dopo sale di un manubrio; se fai meno del fondo, scende di uno. L'hammer della prima seduta Sabato parte dal peso dell'ultima serie della prima seduta Marted\xEC. Il peso dell'ultima serie \xE8 la partenza della seduta dopo."]},{t:"p",r:[["Prove del reverse curl, prima della Fase 4","b"]]},{t:"tab",w:[2600,7038],rows:[{h:1,sec:0,c:[[["Voce","b"]],[["Come","b"]]]},{h:0,sec:0,c:[["Quando"],["In fondo al Giorno 3 del Block 4: sabato 24/10 con il bilanciere EZ, sabato 31/10 alla barra dritta del cavo (puleggia bassa). Cos\xEC al 3/11 l'esercizio non \xE8 pi\xF9 nuovo."]]},{h:0,sec:0,c:[["Prova del 24/10"],["Fatta all'EZ: barra di circa 8 kg (non si pesa) + 1,25 kg per parte, 2 \xD7 15, gomito 0 la domenica e il luned\xEC."]]},{h:0,sec:0,c:[["Serie"],["2 serie da 15, 75 s di recupero. Prima una serie con la barra vuota (o il primo valore del pacco) \xD7 15, lenta."]]},{h:0,sec:0,c:[["Peso"],["EZ: barra + 2 dischi da 1,25 kg (la barra sola, se pesa pi\xF9 di 10 kg). Cavo: il primo valore del pacco che ti fa arrivare a 15 con 3 di riserva; segni i valori del pacco che trovi."]]},{h:0,sec:0,c:[["Correzione"],["Alla fine della serie 1 stimi quante ripetizioni avresti ancora: 6 o pi\xF9 \u2192 la serie 2 con un salto in pi\xF9; se non arrivi a 12 \u2192 un salto in meno."]]},{h:0,sec:0,c:[["Controllo"],["Gomito la domenica e il luned\xEC mattina dopo ogni prova: dolore sull'osso esterno, a riposo, alla pressione o nello stringere, voto da 0 a 10 (l'indolenzimento dei muscoli dell'avambraccio non conta)."]]},{h:0,sec:0,c:[["Dove si registra"],["Nell'app; se non riesci, in una nota che mi mandi: attrezzo, valori del pacco, ripetizioni di ogni serie, gomito della domenica e del luned\xEC."]]},{h:0,sec:0,c:[["Se qualcosa va storto"],["Prova saltata: vale l'altra. Saltate tutte e due: sabato 7/11 la prima seduta \xE8 di prova con l'EZ, con questa tabella. Gomito a 3 o pi\xF9 dopo una qualunque delle due prove: il reverse curl non entra (se \xE8 la prima, la seconda non si fa). Il peso di partenza lo fisso il 1/11 e lo confermi tu il 2/11, dopo il controllo del luned\xEC."]]},{h:0,sec:0,c:[["Scelta"],["Dal 3/11 tieni l'attrezzo in cui il gomito \xE8 stato meglio; a parit\xE0, quello che preferisci. Partenza della Fase 4: il peso dell'ultima serie di quella prova. Se il gomito ha fatto male in tutte e due, il reverse curl non entra."]]}]},{t:"h2",x:"Regole di controllo"},{t:"p",r:["Ogni regola ha il suo segnale, il suo consiglio e la sua durata. Sono avvisi: l'app ti mostra il segnale, i numeri e il consiglio, con due tasti, ",["Applica il consiglio","b"]," e ",["Faccio come da scheda","b"],`; decidi tu, e la scelta si registra (pi\xF9 sotto, "Avvisi"). Le definizioni esatte (miglioramento, sedute che non contano, finestre, soglie) sono nell'appendice "Regole precise".`]},{t:"tab",w:[1900,2700,3e3,2038],rows:[{h:1,sec:0,c:[[["Regola","b"]],[["Segnale","b"]],["Cosa consiglia l'app"],[["Fino a quando","b"]]]},{h:0,sec:0,c:[[["Esercizio fermo","b"]],["3 sedute valide di fila in cui non batti la migliore delle 3 sedute valide precedenti dello stesso esercizio, nella stessa seduta. L'app lo segnala."],[`1) Controlli: sonno (media delle ultime 7 notti almeno 30 minuti sotto la tua media delle 4 settimane prima?), trend del peso (sotto il minimo del corridoio: 0,10, oppure 0,20 dal 31/1 se \xE8 scattata la riga 5-bis?), menu (pasti fuori menu oltre al libero nella settimana?). Se uno di questi tre va male, si sistema quello e l'esercizio resta com'\xE8 per 2 sedute; se poi l'allarme torna, si passa al punto 2. Se c'\xE8 stata una donazione nelle ultime 4 settimane, l'esercizio resta com'\xE8 finch\xE9 non sono passate 4 settimane dalla donazione. Dopo ogni rinvio il conteggio riparte da zero; un allarme rimandato e il suo ritorno contano come un solo stallo. 2) \u221210%, arrotondato al salto pi\xF9 vicino e comunque almeno un salto (Lat 55 \u2192 50, Leg Press 130 \u2192 120, Shoulder Press 27,5 \u2192 25, alzate 6 \u2192 5), e si risale con la doppia progressione. Il confronto riparte dalla prima seduta fatta al peso nuovo; finch\xE9 non lo fai, l'app continua a consigliarlo. Per le croci e la Vertical Row, che risentono della seduta Gioved\xEC a 36 ore: al primo stallo, invece del \u221210%, croci a 3 serie e Vertical Row a 2; se in quel momento hanno gi\xE0 le serie ridotte (per esempio dopo "Volume troppo alto"), \u221210% come gli altri.`],[`Secondo stallo dello stesso esercizio: dallo scarico successivo il range scende di 2 ripetizioni (es. 10-12 \u2192 8-10), tranne key lift, monopodalica e pressa a piedi alti, che rifanno subito il \u221210%. Le riduzioni del range non si sommano: al massimo \u22122 ripetizioni per esercizio. Al secondo stallo vale questo anche per croci e Vertical Row, con le serie ancora ridotte. Dal terzo stallo: \u221210%, per tutti, anche per croci e Vertical Row. Le serie ridotte per lo stallo valgono fino allo scarico successivo; quelle di "Volume troppo alto" fino a fine fase. Dopo ogni allarme, qualunque sia l'azione, il conteggio riparte da zero.`]]},{h:0,sec:0,c:[[["Due esercizi fermi dello stesso muscolo","b"]],["Nella stessa settimana, due esercizi dello stesso muscolo (tabella nell'appendice) restano fermi anche dopo i controlli del punto 1."],["Dallo scarico successivo, gli esercizi di quel muscolo scendono di 2 ripetizioni di range, con le stesse serie. Non key lift, monopodalica e pressa a piedi alti: per il ginocchio pi\xF9 ripetizioni con lo stesso peso caricano il menisco meno di un peso pi\xF9 alto."],["Fino a fine fase."]]},{h:0,sec:0,c:[[["Volume troppo alto","b"]],['Allarme su 3 o pi\xF9 esercizi nella stessa settimana dopo i controlli del punto 1 (qui il sonno non rimanda niente), oppure "stanco" segnato per 10 mattine di fila.'],["La settimana dopo \xE8 uno scarico, con le regole delle settimane 8 e 14 (se uno scarico previsto arriva entro 2 settimane, vale quello). Poi le righe 1-3 dell'ordine dei tagli insieme (con la riga 0, se le serie in pi\xF9 delle braccia sono entrate): 99 a settimana con la scheda di base (100 se la regola del bicipite ha portato l'hammer del Marted\xEC a 4). Scarico e tagli prendono il posto del \u221210% dei 3 esercizi fermi, che ripartono da zero."],["Fino a fine fase. Se scatta di nuovo, dopo un Volume applicato e almeno 3 settimane: righe 4-6, altre \u22123 serie (96 con la scheda di base). Dalla terza volta solo lo scarico, e mi mandi i dati."]]},{h:0,sec:0,c:[[["Recupero a 36 ore \xB7 richiamo alzate","b"]],[`Al richiamo della seduta Sabato meno ripetizioni in totale della seduta Sabato valida prima, sulle serie appaiate (stessa posizione e stesso peso in tutte e due), due volte di fila. Non contano, e si confronta con la seduta Sabato valida prima: lo scarico, le sedute Sabato fuori finestra (appendice, "Finestra della seduta": per esempio non di mattina, senza un Gioved\xEC 32-42 ore prima, o a meno di 70 ore dalle ultime gambe), la seduta in cui il richiamo sale di peso, anche su una sola serie, e le sedute che non contano dell'appendice. Le 36 ore sono contate dalla fine del Gioved\xEC: da inizio a inizio sono circa 37 e mezza.`],["Il richiamo a 3 serie."],["Fino allo scarico successivo. Dopo il segnale il conteggio riparte da zero; se il segnale torna, fino a fine fase."]]},{h:0,sec:0,c:[[["Recupero a 36 ore \xB7 braccia","b"]],["Hammer (o curl al cavo, se la regola del bicipite l'ha cambiato) o overhead della seduta Sabato: lo stesso esercizio, con meno ripetizioni della seduta Sabato valida prima, contate come sopra, due volte di fila. Stesse esclusioni; in pi\xF9 non contano la seduta in cui quell'esercizio sale di peso, anche su una sola serie, e l'hammer (o il curl) della seduta in cui \xE8 salita di peso la Vertical Row."],["Nella seduta Gioved\xEC push-down e curl al cavo a 2 serie (il curl da 4 a 2, se la serie in pi\xF9 \xE8 entrata)."],["Come sopra."]]},{h:0,sec:0,c:[[["Bicipite (decidono i carichi)","b"]],["Hammer della seduta Sabato valida della settimana 7-13/12 contro quella della settimana 16-22/11 (se una manca, la prima e l'ultima seduta Sabato valida tra le due): non \xE8 salito di peso nemmeno su una serie e, allo stesso peso, il totale delle ripetizioni non \xE8 salito di almeno 1 per ogni settimana di calendario tra le due sedute (3 nelle settimane tipo). La proposta compare quando registri la seduta Sabato della settimana 7-13/12, o luned\xEC 14/12 se non l'hai fatta. Si confrontano le prime 3 serie, anche quando l'hammer ne ha 4. Conta come salito anche un hammer che nella prima delle due sedute era sotto il tetto e nel periodo l'ha chiuso su tutte le prime 3 serie. Servono almeno 2 sedute Sabato valide ad almeno 2 settimane di calendario di distanza: se no, non scatta e l'hammer resta. Non scatta neanche se in quel periodo \xE8 scattata la regola delle 36 ore delle braccia (il problema \xE8 il recupero) o se l'hammer ha gi\xE0 avuto il \u221210% dell'esercizio fermo. Il bicipite si misura lo stesso il 6 e il 13/12, ma da solo non decide: 0,5 cm stanno dentro l'errore del metro. Se nella stessa seduta Sabato scattano sia questa regola sia l'esercizio fermo dell'hammer, vale questa (niente \u221210% n\xE9 rinvio)."],["Dalla prima seduta Sabato dal 14/12 l'hammer del Sabato diventa curl al cavo, con le serie che l'hammer ha in quel momento (3, o 4 con la serie in pi\xF9; 2 nello scarico), 10-12, nella stessa superserie (peso di partenza: quello dell'ultima seduta Gioved\xEC; se scendi sotto 10 ripetizioni, la serie dopo un valore del pacco in meno). Per non togliere lavoro all'avambraccio, dalla prima seduta Marted\xEC dopo la prima seduta Sabato con il curl l'hammer del Marted\xEC sale da 3 a 4 serie (nello scarico 2): la quarta da sola, dopo la superserie."],["Fino a fine fase."]]},{h:0,sec:0,c:[[["Seduta troppo lunga","b"]],["Una seduta supera di oltre 15 minuti la sua stima per 3 settimane di fila (da luned\xEC a domenica, in qualunque giorno la fai; scarico e sedute interrotte non contano), oppure lo segnali tu. Una seduta chiusa prima, con esercizi saltati per tempo, conta come oltre la stima."],["Mi mandi le durate: si decide insieme cosa spostare o tagliare, partendo dall'ordine dei tagli."],["\u2014"]]}]},{t:"sm",r:[["Dopo l'ultimo scarico (settimana 14) non ce ne sono altri: le riduzioni che valgono \xABfino allo scarico successivo\xBB restano fino alla fine, e quelle che partono \xABdallo scarico successivo\xBB partono dal luned\xEC dopo la verifica.","i"]]},{t:"p",r:[["Ordine dei tagli, se il volume \xE8 troppo","b"]]},{t:"tab",w:[700,4400,4538],rows:[{h:1,sec:0,c:[[["#","b"]],[["Taglio","b"]],[["Perch\xE9 per primo","b"]]]},{h:0,sec:0,c:[["0"],["Curl al cavo del Gioved\xEC e hammer (o curl) del Sabato da 4 a 3, solo se sono entrate le serie in pi\xF9"],["Sono le serie entrate a condizione di niente fatica."]]},{h:0,sec:0,c:[["1"],["Scrollate da 3 a 2"],["Il collo \xE8 la misura pi\xF9 vicina al riferimento."]]},{h:0,sec:0,c:[["2"],["Shoulder Press da 3 a 2"],["Il deltoide anteriore lavora gi\xE0 nelle distensioni."]]},{h:0,sec:0,c:[["3"],["Vertical Row e Pulley da 3 a 2"],["Il dorso in spessore non \xE8 una priorit\xE0."]]},{h:0,sec:0,c:[["4"],["Face Pull da 4 a 3"],["Il deltoide posteriore lavora anche nei rematori."]]},{h:0,sec:0,c:[["5"],["Richiamo alzate da 4 a 3"],["Restano 13 serie di alzate."]]},{h:0,sec:0,c:[["6"],["Pec Deck da 3 a 2"],["Il petto alto resta intero."]]}]},{t:"sm",r:[['Si applicano a gruppi: prima le righe 0-3 insieme (la riga 0 solo se le serie in pi\xF9 delle braccia sono entrate), poi, se serve, le righe 4-6 (regola "Volume troppo alto"). Key lift, braccia, gambe e alzate delle sedute Marted\xEC e Gioved\xEC si toccano per ultimi: sono le priorit\xE0.',"i"]]},{t:"h2",x:"Ginocchio, schiena e gomito"},{t:"p",r:[`Sono avvisi: l'app ti mostra il segnale e il consiglio, e decidi tu con i due tasti (pi\xF9 sotto, "Avvisi"). \u2605 = consiglio da seguire con pi\xF9 forza; \u2605\u2605 = segnale da medico, in rosso, senza tasti. Squat (anche al Multipower) e Leg Extension restano vietati dall'ortopedico: non sono una regola del programma e non diventano mai un avviso.`]},{t:"li",r:[["Sempre: ","b"],"pressa fino a circa 90\xB0, bacino appoggiato, ginocchia in linea con le punte e mai verso l'interno. La pressa non ha fermi regolabili: alla prima seduta scegli un riferimento visivo per i 90\xB0 e nelle ultime ripetizioni rallenta in discesa. Ai piedi alti punte aperte al massimo di circa 15\xB0, ti fermi prima che il bacino si stacchi. Calf con le ginocchia appena flesse e il piede ben appoggiato. Alla Vertical Row il petto resta appoggiato."]},{t:"li",r:[["\u2605 Dolore durante una serie: ","b"],"il consiglio \xE8 fermarti, saltare le serie rimaste di quell'esercizio e segnarlo nell'app, che salva in quale serie \xE8 arrivato. \u2605 Se \xE8 il ginocchio durante una pressa: per quel giorno niente altra pressa e niente calf alla Leg Press; Leg Curl e adduttori solo se non fanno male. Alla seduta dopo, per quella pressa: un salto in meno su tutte le serie (\u221210 kg) e al massimo le serie fatte senza dolore, per 2 sedute; poi niente aumenti finch\xE9 non fai 2 sedute senza dolore. Se il dolore \xE8 arrivato alla prima serie: la seduta dopo quella pressa salta; poi 2 serie a \u221210 kg, a 2-3 dal limite, per 2 sedute; poi tutte le serie a \u221210 kg, e niente aumenti finch\xE9 non fai 2 sedute senza dolore. La seduta con il dolore non conta per gli allarmi; le sedute ridotte dopo, solo se hai applicato il consiglio."]},{t:"li",r:[["Il giorno dopo le gambe: ","b"],"la mattina dopo ogni giorno con una seduta Marted\xEC o Sabato, in qualunque giorno la fai, l'app ti chiede il ginocchio: dolore s\xEC o no, dove, voto da 0 a 10, gonfiore s\xEC o no (due sedute con le gambe nello stesso giorno: un registro solo). Il riquadro si apre anche le altre mattine. Conta il dolore in qualunque punto del ginocchio."]},{t:"li",r:[["\xB7 Dolore lieve (voto 1-3), senza gonfiore: ","b"],"consiglio: alla prossima seduta Marted\xEC niente monopodalica (il calf resta se non fa male) e niente aumenti alle presse della seduta Sabato finch\xE9 non passano 2 settimane senza sintomi."]},{t:"li",r:[["\xB7 \u2605 Gonfiore visibile, oppure voto 4 o pi\xF9: ","b"],"consiglio: niente pressa e niente calf alla Leg Press, n\xE9 nella seduta Marted\xEC n\xE9 nella seduta Sabato, finch\xE9 non passa; Leg Curl e adduttori solo se non fanno male. Poi nella seduta Sabato piedi bassi e piedi alti \u221210 kg per 2 settimane, poi come il dolore lieve."]},{t:"li",r:[["\xB7 Se torna: ","b"],"se il s\xEC torna 2 volte in 3 settimane, consiglio: nella seduta Sabato piedi bassi \u221210 kg e piedi alti da 4 a 2 serie, finch\xE9 passano 2 settimane senza sintomi; se la monopodalica era rimasta, anche toglierla. \u2605 Se arriva un terzo s\xEC prima di quelle 2 settimane: ortopedico."]},{t:"li",r:[["\xB7 Ritorno della monopodalica: ","b"],"se era uscita, dopo 2 settimane senza sintomi il consiglio \xE8 2 serie per 2 settimane con il peso dell'ultima seduta senza sintomi, a 2-3 dal limite; poi 3 serie. Queste sedute non contano per gli allarmi, se hai applicato il consiglio."]},{t:"li",r:[["\u2605 Fastidio che dura oltre 7 giorni: ","b"],"consiglio: niente pressa e visita dall'ortopedico. Il fastidio \xE8 continuo se tra due registri con il s\xEC non c'\xE8 un no e passano al massimo 7 giorni."]},{t:"li",r:[["Mal di schiena: ","b"],"confermato da te il 17/10. Se dura 2 o pi\xF9 giorni dopo una seduta (lo segni ogni mattina nell'app, e segni dopo quale seduta), consiglio: plank 2 \xD7 30-45 secondi nel riscaldamento, come nel Block 4, finch\xE9 passa; si toglie dopo 7 giorni senza dolore. In pi\xF9, alla prima seduta dello stesso tipo dopo il secondo giorno di dolore, in qualunque giorno la fai: se era la seduta Sabato, piedi alti con il fine corsa 5-10 cm pi\xF9 alto; se era la seduta Gioved\xEC, Pulley un salto in meno; se era la seduta Marted\xEC, solo il plank. Addome e Big 3 restano in stand-by, come hai deciso tu."]},{t:"li",r:[["Gomito, cosa conta: ","b"],"solo il dolore sull'osso esterno del gomito (o dietro, con le overhead), a riposo, alla pressione o nello stringere (la moka, una stretta di mano), di 3 su 10 o pi\xF9, durante la serie o la mattina dopo; vale anche nelle prove del 24 e 31/10. L'indolenzimento diffuso dei muscoli dell'avambraccio nei 1-3 giorni dopo un esercizio nuovo non conta."]},{t:"li",r:[["Gomito dopo la seduta Gioved\xEC: ","b"],"nelle settimane 1-3 (3-22/11) il registro c'\xE8 anche la mattina dopo la seduta Gioved\xEC (tua decisione del 27/10). Serve a vedere come risponde il gomito alla partenza piena: le regole del reverse curl e delle overhead restano legate alle sedute Marted\xEC e Sabato; con un dolore di 3 o pi\xF9 me lo dici e valutiamo insieme."]},{t:"li",r:[["\u2605 Gomito, reverse curl: ","b"],"dolore esterno di 3 o pi\xF9: consiglio: reverse curl fuori fino a fine fase; restano gli hammer. Sotto 3: ti fermi per quel giorno e alla seduta Sabato dopo riparti dallo stesso peso."]},{t:"li",r:[["\u2605 Gomito, overhead: ","b"],"dolore dietro il gomito di 3 o pi\xF9 con le overhead delle sedute Marted\xEC o Sabato: consiglio: push-down al posto delle overhead dalla prima seduta Marted\xEC dopo il dolore, 3 \xD7 10-12 (con le serie che le overhead hanno quella settimana, scarico compreso), con l'ultimo peso del Block 4. Se il dolore torna con una seduta Sabato (un'altra, non quella del primo dolore), push-down anche l\xEC, 4 \xD7 10-12 (stessa regola per lo scarico), con il peso della seduta Gioved\xEC, e la regola delle 36 ore usa quello. Se il push-down del Marted\xEC non l'avevi applicato, il consiglio vale per tutte e due le sedute. \u2605 Dolore al gomito che dura oltre 7 giorni: medico. Lo segni nell'app."]},{t:"li",r:[["\u2605\u2605 Stop e visita medica ","b"],"(in rosso, senza tasti): ginocchio bloccato (non si stende del tutto), cedimento del ginocchio, gonfiore che compare entro poche ore: ortopedico. Poi, come nel Protocollo Guardia: dolore al ginocchio nuovo o forte (oltre 6 su 10) che non passa in 48 ore; dolore lombare acuto durante un esercizio; dolore al petto, palpitazioni o vertigini (fermati subito; se non passa in pochi minuti, chiama il 112); urine scure, scarse o schiumose; stanchezza estrema oltre 2 settimane nonostante il riposo; calo di peso involontario oltre 2 kg in una settimana."]},{t:"sm",r:[[`Il resto del Protocollo Guardia nella Fase 4 \xE8 sostituito da queste regole e da quelle della sezione 10. La regola del gonfiore \xE8 tornata forte come nella Fase 3: nella versione 1.2 l'avevo indebolita senza un dato (correzione della revisione da preparatore). La vecchia riga "sonno sotto 6 ore per una settimana \u2192 volumi \u221220%" non vale pi\xF9: con 5-6 ore abituali scatterebbe sempre.`,"i"]]},{t:"h2",x:"Sedute in altri giorni"},{t:"li",r:[["Qualunque giorno: ","b"],"le tre sedute (Marted\xEC, Gioved\xEC, Sabato) si possono fare in qualunque giorno (tua decisione del 21/10), e lo storico resta per seduta. L'app ti propone la prima seduta non ancora fatta nella settimana (luned\xEC-domenica), nell'ordine Marted\xEC \u2192 Gioved\xEC \u2192 Sabato; il marted\xEC, il gioved\xEC e il sabato quella del giorno, se non \xE8 gi\xE0 fatta. Una seduta non fatta entro la domenica non passa alla settimana dopo."]},{t:"li",r:[["Avvisi di recupero: ","b"],"due sedute nello stesso giorno; meno di 32 ore dalla seduta prima; una seduta Marted\xEC o Sabato a meno di 48 ore dall'ultima seduta con le gambe; la stessa seduta dell'ultima volta, a meno di 6 giorni; una quarta seduta nella stessa settimana. Ore da inizio a inizio. Un solo avviso con tutti i motivi e due tasti: Applica il consiglio o La faccio ora (si registra e la doppia progressione va avanti; conta per gli allarmi solo se \xE8 in finestra). Il consiglio dipende dal motivo: stesso giorno, meno di 32 ore o gambe a meno di 48 ore \u2192 il primo momento utile (sera dal luned\xEC al venerd\xEC, mattina o pomeriggio nel weekend) che rispetta i minimi e in cui la seduta conta; se fino a domenica non c'\xE8, saltarla (sezione 10); la stessa seduta di fila \u2192 la seduta che manca nel giro; quarta seduta \u2192 non farla, \xE8 oltre la scheda. Con pi\xF9 motivi vale prima la quarta seduta, poi la stessa seduta di fila, poi il tempo. Il minimo della scheda \xE8 circa 37 ore e mezza (gioved\xEC sera \u2192 sabato mattina); per le gambe 52 ore (domenica pomeriggio \u2192 marted\xEC sera). Gli avvisi scattano sotto 32 e 48 ore: 5 ore e mezza di margine sulle 37,5 e 4 sulle 52, per gli orari che cambiano."]},{t:"li",r:[["Ora della seduta: ","b"],`l'app la prende dalla prima serie che registri in palestra. Se registri dopo, a casa o il giorno dopo, usa il momento che hai scelto in "La giornata" o ti chiede con un tocco se era mattina, pomeriggio o sera (orari tipici 9:00, 15:30, 19:30). Non devi scrivere niente.`]},{t:"li",r:[["Quali sedute contano per i confronti: ","b"],"non contano una seduta a meno di 32 ore dalla seduta prima; una seduta Marted\xEC a meno di 70 ore dalla seduta prima; una seduta Sabato che non viene subito dopo un Gioved\xEC iniziato 32-42 ore prima, o che non \xE8 di mattina (ingresso dalle 11, come per il menu: sezione 2), o a meno di 70 ore dalle ultime gambe. Si registrano e la doppia progressione va avanti: escono solo dai confronti per gli allarmi. Esempi: domenica mattina (61,5 ore dal Gioved\xEC) fuori; Marted\xEC dopo la domenica (58,5 ore) fuori; Sabato di pomeriggio (circa 44 ore) fuori; Marted\xEC dopo un Sabato di pomeriggio (76 ore) conta; Sabato dopo un Gioved\xEC saltato fuori; Sabato fatto domenica mattina dopo un Gioved\xEC fatto venerd\xEC sera (37,5 ore) conta; Sabato 2/1 dopo un Gioved\xEC fatto il 31/12 al mattino (48 ore) fuori; Marted\xEC fatto mercoled\xEC sera: il Sabato del sabato mattina (61,5 ore dalle gambe) fuori; Marted\xEC fatto luned\xEC sera (58,5 ore dal Sabato) fuori; Marted\xEC al mattino del marted\xEC dopo un Sabato di domenica mattina (48 ore) fuori. Una seduta pu\xF2 restare fuori anche senza avviso, perch\xE9 gli avvisi scattano solo sotto 32 ore (48 per le gambe): quando apri una seduta che non entrer\xE0 nei confronti, l'app te lo scrive subito, con il motivo e il primo momento in cui conterebbe (\xE8 un'informazione, senza tasti); lo ripete alla fine della seduta."]},{t:"li",r:[["Fuori finestra per 3 settimane: ","b"],"se la stessa seduta resta fuori finestra 3 settimane di fila, l'app lo segnala, perch\xE9 i suoi allarmi non scattano: mi mandi lo schema e la finestra si ridefinisce."]},{t:"h2",x:"Avvisi"},{t:"li",r:[["Due tasti: ","b"],'ogni regola di allenamento (questa sezione e la sezione 10) \xE8 un avviso: il segnale, i numeri, il consiglio e due tasti, Applica il consiglio e Faccio come da scheda. Niente cambia la scheda da solo. Il secondo tasto pu\xF2 dire che cosa fai (per esempio "Resto a 103", "La faccio ora").']},{t:"li",r:[["Quanto vale la scelta: ","b"],"per tutto l'episodio, cio\xE8 la regola e l'evento che la fa scattare (per esempio il ginocchio lieve dell'11/11), finch\xE9 non la cambi; un evento nuovo d\xE0 un avviso nuovo. Se non tocchi niente, vale quello che registri: per esempio, un esercizio tolto senza serie quel giorno vale come consiglio applicato."]},{t:"li",r:[["Per i confronti conta quello che fai, non il tasto. ","b"],"Le esclusioni di misura (scarico, malattia, notte corta, dolore, sostituto, seduta fuori finestra) valgono sempre; quelle legate a un consiglio (presse ridotte dopo il dolore, settimane senza aumenti per il ginocchio, ritorno della monopodalica) solo se l'hai applicato. Dopo un cambio di peso consigliato e fatto, il confronto riparte; se fai come da scheda, continua."]},{t:"li",r:[["Le proposte di prima: ","b"],"esercizio fermo, Volume troppo alto, due esercizi fermi, 36 ore e bicipite hanno gli stessi due tasti. Se non applichi: l'esercizio fermo conta come stallo (il prossimo allarme \xE8 il secondo); il segnale delle 36 ore conta (se torna, la riduzione vale fino a fine fase); il Volume troppo alto non conta come volta (se scatta di nuovo, l'app ripropone lo scarico e le righe 1-3, con la riga 0 se le serie in pi\xF9 sono entrate, e intanto ogni esercizio fermo ha la sua proposta); per due esercizi fermi e bicipite resta tutto com'\xE8. Il freno e le verifiche del gradino restano da confermare (sezione 8)."]},{t:"h1",x:"4. L'alimentazione"},{t:"h2",x:"Come si pesa"},{t:"li",r:[["Pasta, riso, cereali, legumi, carne e pesce: ","b"],"a crudo. I legumi in scatola o lessati, sgocciolati, pesano circa 3 volte il secco: 70 g secchi sono circa 210 g, 50 g sono 150 g."]},{t:"li",r:[["Frutta: ","b"],"banana, arancia, kiwi, clementine e pompelmo pesati sbucciati; mela e pera con la buccia, senza torsolo."]},{t:"li",r:[["Patate e patate dolci: ","b"],"crude e sbucciate."]},{t:"li",r:[["Verdure: ","b"],"almeno 200 g a pasto, a crudo. Valgono tutte tranne patate, legumi, mais e piselli, che sono carboidrati. Si condiscono con l'olio del pasto."]},{t:"li",r:[["Uova: ","b"],"medie. 2 albumi = circa 60 g."]},{t:"li",r:[["Etichette: ","b"],"se un alimento ha l'etichetta, vale l'etichetta."]},{t:"h2",x:"Cosa cambia rispetto al menu del Block 4"},{t:"li",r:[["Cena: ","b"],"15 g di Parmigiano e 5 g di olio in meno, calorie quasi uguali. Serve per il calcio: nei giorni ON il cibo ne porta circa 600 mg contro i 1.000 raccomandati."]},{t:"li",r:[["Spuntino pre-allenamento: ","b"],"un'arancia o due kiwi al posto della mela piccola, insieme al collagene."]},{t:"li",r:[["Seduta al mattino, appena sveglio: ","b"],"ferro con 2 kiwi piccoli; almeno 60 minuti dopo whey, banana grande, banana piccola, caff\xE8 e collagene. Circa 75 g di carboidrati invece di 24."]},{t:"li",r:[["Seduta al mattino, dopo i pesi: ","b"],"verso le 11:15 uno spuntino salato con pane e bresaola, al posto della colazione dolce dopo i pesi (latte, avena, mela, whey). Con la banana piccola, stesse proteine e circa 5 kcal in pi\xF9; il pranzo resta alle 12:30, uguale."]},{t:"li",r:[["Banana piccola prima dei pesi, mai durante ","b"],"(tua scelta del 27/10: durante la seduta non riesci a mangiarla). Al mattino, in ogni seduta, con whey e banana grande: si parte dopo il digiuno della notte con un pasto piccolo (revisione del 17/10), e cos\xEC il pasto prima dei pesi \xE8 pi\xF9 grande. La sera, nelle sedute Marted\xEC e Sabato, le pi\xF9 lunghe (107 e 117 minuti), 45 minuti prima, con il frutto. Al pi\xF9 tardi 45 minuti prima dell'ingresso. Le calorie del giorno e della settimana non cambiano: \xE8 la stessa banana."]},{t:"li",r:[["Menu per seduta, non per giorno ","b"],'(tua decisione del 21/10): tabella "Che giornata \xE8" qui sotto.']},{t:"h2",x:"Che giornata \xE8"},{t:"p",r:["La giornata la decide la seduta del giorno e il suo momento (sezione 2). ",["Regola della cena grande ","b"],'(tua decisione del 27/10): ogni seduta ha una sola cena grande. Il pasto libero del sabato sera \xE8 la cena grande della seduta che fai il sabato; se il sabato non ti alleni, \xE8 la cena grande della seduta Sabato fatta in un altro giorno della stessa settimana (luned\xEC-domenica), che quel giorno ha la cena OFF. Ogni altra seduta ha la cena post-allenamento: la sera subito dopo la seduta; al mattino o di pomeriggio, alle 20. Cos\xEC la settimana vale le stesse calorie di sempre, entro circa 25 kcal al giorno, e le proteine restano sopra 150 g in tutte le giornate senza pizza, a ogni gradino. Valori al Base, senza collagene; gli altri gradini nella tabella "La giornata a ogni gradino".']},{t:"tab",w:[1700,6e3,1938],rows:[{h:1,sec:0,c:[["Seduta del giorno"],["Giornata"],["kcal \xB7 proteine"]]},{h:0,sec:0,c:[["Nessuna seduta (non il sabato)"],["Giorno OFF"],["2.429 \xB7 162 g"]]},{h:0,sec:0,c:[["Nessuna seduta, il sabato"],["Giorno OFF senza la cena, poi il pasto libero (se lo salti: cena post-allenamento, 2.793 kcal)"],["1.797 + pizza \xB7 110 g + pizza"]]},{h:0,sec:0,c:[["Di sera (non il sabato)"],["Giorno ON: Marted\xEC o Gioved\xEC; il Sabato solo se il sabato c'\xE8 gi\xE0 un'altra seduta"],["2.733 con la banana \xB7 2.643 senza \xB7 160 / 159 g"]]},{h:0,sec:0,c:[["Sabato di sera, in un altro giorno (il sabato senza seduta)"],["Giorno OFF con lo spuntino pre-allenamento e la banana piccola al posto di quello delle 16:30, la cena OFF subito dopo la seduta"],["2.454 \xB7 158 g"]]},{h:0,sec:0,c:[["Di sera, il sabato"],["Giorno ON senza la cena, poi il pasto libero dopo la seduta"],["1.737 con la banana \xB7 1.647 senza, + pizza \xB7 102 g + pizza"]]},{h:0,sec:0,c:[["Al mattino, il sabato"],["Seduta al mattino, come oggi"],["1.679 + pizza \xB7 119 g + pizza"]]},{h:0,sec:0,c:[["Sabato al mattino, in un altro giorno (il sabato senza se mento della prima seduta. Collagene una volta sola, prima della prima seduta; creatina una volta, a cena.","i"]]},{t:"tab",w:[2300,2600,1300,3438],rows:[{h:1,sec:0,c:[[["Integratore","b"]],[["Quando","b"]],[["Fase 4","b"]],[["Perch\xE9","b"]]]},{h:0,sec:0,c:[["Creatina 3 g"],["Ogni giorno, a cena"],["Continua"],["L'integratore con le prove pi\xF9 solide per forza e massa magra (ISSN 2017)."]]},{h:0,sec:0,c:[["Whey isolata"],["Come da menu"],["Continua"],["\xC8 cibo."]]},{h:0,sec:0,c:[["Collagene 15 g (2 misurini)"],["Una volta al giorno. Con la seduta: la sera 45 minuti prima, con l'arancia o i kiwi; al mattino e di pomeriggio con whey e banana; con due sedute, prima della prima. Senza seduta: dopo lo spuntino delle 16:30."],["Continua"],["Preso prima dell'attivit\xE0 con vitamina C aumenta la sintesi di collagene (Shaw 2017). La vitamina C c'\xE8 gi\xE0 nella formula; il frutto ne aggiunge altra, a dosi basse."]]},{h:0,sec:0,c:[["Vitamina C 500 mg"],["Al risveglio con il ferro, tutti i giorni tranne quelli con la seduta al mattino o di pomeriggio, dove ci sono i 2 kiwi."],["Si sposta"],["Aiuta l'assorbimento del ferro. Lontano dall'allenamento: dosi alte di antiossidanti intorno alla seduta possono ridurre gli adattamenti."]]},{h:0,sec:0,c:[["Ferro (SiderAL Forte 30 mg)"],["Al risveglio con acqua; latte, whey e caff\xE8 almeno 60 minuti dopo; magnesio la sera"],["Si sposta"],["Dose, durata e orario li conferma il medico sulla ferritina del 3/11 (sezione 9). Fino ad allora come qui."]]},{h:0,sec:0,c:[["Vitamina D3 + K2 2.000 UI"],["A colazione; nei giorni con la seduta al mattino o di pomeriggio al pranzo."],["Continua"],["Con un pasto che contiene grassi si assorbe di pi\xF9 (Dawson-Hughes 2015): il pranzo ne ha 22 g. La dose la decide il medico sulla vitamina D del 3/11. Fino ad allora 2.000 UI."]]},{h:0,sec:0,c:[["Omega 3 \xB7 Magnesio"],["A pranzo, 2 capsule \xB7 prima di dormire, 3 tavolette"],["Continuano"],["Salute generale."]]},{h:0,sec:0,c:[["Integratori nuovi"],["\u2014"],["No"],["Una variabile alla volta."]]}]},{t:"sm",r:[["Se salti una dose, non si raddoppia la volta dopo. Il prelievo del 3/11 ha regole sue (sezione 9).","i"]]},{t:"h1",x:"6. Il sonno"},{t:"li",r:[["Il dato: ","b"],"dormi 5-6 ore, sveglia alle 6. \xC8 la variabile pi\xF9 importante tra quelle ancora da sistemare: una notte senza sonno riduce la sintesi proteica del 18% (Lamon 2021), cinque notti corte di fila la riducono (Saner 2020)."]},{t:"li",r:["Luci spente: alle 23:30 nelle sere con una seduta di sera; alle 22:45 nelle altre (il sabato quando puoi)."]},{t:"li",r:[["Cosa segni ogni mattina: ","b"],"l'ora in cui hai spento la luce, l'ora di sveglia e un voto al sonno da 1 a 5. Obiettivo: almeno 6,5 ore di media alla settimana tra luce spenta e sveglia."]},{t:"li",r:[["Domenica 29/11: ","b"],"guardo la media di 4 settimane. Se le ore sono sotto 6 o il voto \xE8 sotto 3, ti propongo il passo successivo (orari o un integratore per il sonno). Fino ad allora nessun integratore nuovo."]},{t:"li",r:[["Notti corte prima delle sedute: ","b"],"regola nella sezione 10."]},{t:"h1",x:"7. Cosa registri e come si misura"},{t:"h2",x:"Cosa registri, nell'app"},{t:"tab",w:[2600,7038],rows:[{h:1,sec:0,c:[[["Quando","b"]],[["Cosa","b"]]]},{h:0,sec:0,c:[["Ogni mattina"],["Pesata; ora della luce spenta, ora di sveglia, voto del sonno da 1 a 5; stanco s\xEC o no; mal di schiena s\xEC o no e, se s\xEC, dopo quale seduta. La mattina dopo una seduta con reverse curl o overhead (Marted\xEC, Sabato) e, nelle settimane 1-3 (3-22/11), dopo la seduta Gioved\xEC: gomito, dolore s\xEC o no, dove (esterno, dietro), voto da 0 a 10, anche nello stringere (l'indolenzimento dei muscoli dell'avambraccio non conta)."]]},{h:0,sec:0,c:[["A ogni seduta"],["Peso e ripetizioni di ogni serie di lavoro (data e ora le prende l'app); durata; esercizi saltati per tempo; dolori (dove, durante o dopo); nelle sedute con la banana piccola (al mattino; la sera nelle sedute Marted\xEC e Sabato; con due sedute, anche nella seconda se \xE8 Marted\xEC o Sabato): banana presa prima dei pesi s\xEC o no; se registri dopo, mattina, pomeriggio o sera (un tocco); con reverse curl e overhead: gomito, dolore s\xEC o no, dove (esterno, dietro), voto da 0 a 10; se una macchina \xE8 sostituita, con cosa."]]},{h:0,sec:0,c:[["La mattina dopo una seduta Marted\xEC o Sabato"],["Ginocchio, il giorno dopo le gambe: dolore s\xEC o no; dove (interno, dietro, altro); voto da 0 a 10; gonfiore s\xEC o no. Il riquadro si apre anche le altre mattine."]]},{h:0,sec:0,c:[["Ogni sabato"],["Girovita, 3 letture; pressione nei sabati del calendario; venerd\xEC sera pasto libero, cena fuori o alcol s\xEC o no."]]},{h:0,sec:0,c:[["1/11 \xB7 29/11 \xB7 31/1 \xB7 14/2"],["Misure complete e foto. Il 6/12 e il 13/12 solo il bicipite, con 3 letture."]]},{h:0,sec:0,c:[["Quando succede"],[`Pasti fuori menu oltre al pasto libero; giorni di malattia, trasferta, donazione; pasto libero spostato; seduta e momento del giorno, quando non sono quelli della settimana tipo (card "La giornata"); conferma dei cambi di gradino che l'app ti propone; gradino scelto da te nel menu (solo quel giorno o da quel giorno in poi).`]]}]},{t:"h2",x:"Pesata"},{t:"p",r:["Ogni mattina, dopo il bagno, prima di bere e mangiare, in intimo, sulla stessa bilancia nello stesso punto del pavimento. La media della settimana va dal luned\xEC alla domenica e vale se ha almeno 5 pesate valide. Non entrano nelle medie: i giorni di malattia e i 3 dopo, il giorno di una donazione e i 2 dopo, i giorni di trasferta."]},{t:"h2",x:"Girovita"},{t:"p",r:["Ogni sabato appena sveglio, dopo il bagno e la pesata, prima del ferro (e dei kiwi o della vitamina C). Metro sull'ombelico, orizzontale, in piedi, addome rilassato, dopo un'espirazione normale. 3 letture al millimetro (per esempio 94,6): si segna quella di mezzo. Quel sabato non conta se la sera prima c'\xE8 stato il pasto libero, una cena fuori o alcol, o se sei malato; e non contano i sabati delle feste (26/12, 2/1, 9/1). La base della linea \xE8 la media dei sabati validi tra 17, 24 e 31/10; se ne resta uno solo, si aggiunge il 10/10 (94)."]},{t:"h2",x:"Pressione"},{t:"p",r:["Sabati 7/11, 5/12, 2/1, 30/1 (e 27/2 se si prolunga), dopo il girovita e prima del caff\xE8. Seduto da 5 minuti, schiena appoggiata, braccio sinistro sul tavolo all'altezza del cuore; 2 letture a un minuto di distanza, si segna la media. Se non hai il misuratore, in farmacia lo stesso giorno."]},{t:"li",r:[["Massima sotto 135 e minima sotto 85: ","b"],"niente."]},{t:"li",r:[["Massima 135 o pi\xF9, oppure minima 85 o pi\xF9: ","b"],"misuri per 7 giorni, mattina e sera, e porti i valori al medico."]},{t:"li",r:[["Massima 160 o pi\xF9, oppure minima 100 o pi\xF9, o mal di testa forte, vista offuscata, dolore al petto: ","b"],"medico subito."]},{t:"h2",x:"Misure complete"},{t:"p",r:["Domenica mattina, dopo la pesata, a digiuno, prima degli integratori, lato destro, metro aderente senza stringere. Ogni punto due volte: si segna la media; se le due letture differiscono di pi\xF9 di mezzo centimetro, una terza e si tiene la media delle due pi\xF9 vicine."]},{t:"tab",w:[2300,7338],rows:[{h:1,sec:0,c:[[["Punto","b"]],[["Come","b"]]]},{h:0,sec:0,c:[["Spalle"],["Punto pi\xF9 largo dei deltoidi, metro orizzontale, braccia rilassate."]]},{h:0,sec:0,c:[["Petto"],["Altezza dei capezzoli, sotto le ascelle, dopo un'espirazione normale."]]},{h:0,sec:0,c:[["Bicipite"],["Braccio destro a 90\xB0, pugno chiuso, bicipite contratto al massimo; punto pi\xF9 grosso, metro perpendicolare all'omero. Il 1/11, il 6 e il 13/12: 3 letture, si usa la media."]]},{h:0,sec:0,c:[["Avambraccio"],["Braccio disteso e rilassato lungo il fianco, mano aperta; punto pi\xF9 largo. Il 1/11 anche a 2-3 cm dalla piega del gomito, come l'11/10, per il confronto con i 28 cm dell'11/10; segni a quanti cm dalla piega \xE8 il punto pi\xF9 largo."]]},{h:0,sec:0,c:[["Collo"],["Sotto il pomo d'Adamo, sguardo dritto."]]},{h:0,sec:0,c:[["Girovita"],["Come il sabato."]]},{h:0,sec:0,c:[["Fianchi"],["Punto pi\xF9 largo dei glutei, piedi uniti."]]},{h:0,sec:0,c:[["Coscia"],["Destra, 15 cm sopra il bordo alto della rotula, gamba rilassata e peso sulla sinistra."]]},{h:0,sec:0,c:[["Coscia alta"],["Punto pi\xF9 largo sotto la piega del gluteo. Solo per le proporzioni."]]},{h:0,sec:0,c:[["Polpaccio"],["Punto pi\xF9 largo, in piedi, peso distribuito."]]}]},{t:"h2",x:"Foto"},{t:"p",r:["Stesse date delle misure, subito dopo. Stessa stanza, stessa luce, telefono fermo a 2-3 metri all'altezza del petto, con il timer; inquadratura dalla testa alle ginocchia; stesso intimo o costume; mai dopo l'allenamento. Cinque pose: fronte rilassato, fronte con doppio bicipite, lato destro rilassato, schiena rilassata, schiena con doppio bicipite."]},{t:"h1",x:"8. Le decisioni"},{t:"p",r:[`L'app fa i calcoli con i tuoi dati e ti propone la decisione; la confermi tu. Il gradino lo puoi anche scegliere tu nel menu (pi\xF9 sotto, "Il gradino scelto da te"). Qui c'\xE8 come, cos\xEC puoi controllarla. Si decide ogni 2 settimane, la domenica, sul trend di 4 settimane: le tue medie a 2 settimane, con lo stesso cibo, sono andate da \u22120,10 a +0,34 kg a settimana. Su un dato cos\xEC rumoroso, una verifica breve sposterebbe un gradino anche con il ritmo giusto.`]},{t:"h2",x:"Il trend del peso"},{t:"li",r:[["Cos'\xE8: ","b"],"la pendenza della retta che passa meglio tra le ultime 5 medie settimanali valide (minimi quadrati), in kg a settimana, arrotondata a 2 decimali (0,095 diventa 0,10). Se una settimana non \xE8 valida (meno di 5 pesate valide, oppure feste), si prende quella valida prima e la retta usa le date vere."]},{t:"li",r:[["Esempio: ","b"],'medie 78 \xB7 78,5 \xB7 78,5 \xB7 78,5 \xB7 78,4. La retta d\xE0 0,08; "ultima meno prima diviso 4" darebbe 0,1, ma pesa solo due settimane su cinque. Vale la retta.']},{t:"li",r:[["Corridoio: ","b"],"da 0,10 a 0,30 compresi. Fuori di molto: sotto 0,05 o sopra 0,35. Fuori: da 0,05 a 0,09, o da 0,31 a 0,35."]},{t:"h2",x:"La linea del girovita"},{t:"p",r:['La base \xE8 la media dei sabati 17, 24 e 31/10. Da l\xEC la linea sale fino a 98 il 13/2, in 15 settimane: valore del sabato = base + (98 \u2212 base) \xD7 settimane dal 31/10 \xF7 15, mai sopra 98 (dopo il 13/2 resta 98). Con base 94,5 sale di 0,93 cm ogni 4 settimane. Alla verifica si confronta la media degli ultimi 3 sabati validi con la media della linea negli stessi 3 sabati (con i valori esatti, non arrotondati); "sopra" vuol dire pi\xF9 alta, anche di poco. Se dal 31/10 ci sono solo 2 sabati validi, si usano quei 2; con meno di 2 il controllo del girovita salta. La tabella vera la scrivo il 1/11, con la tua base; questa \xE8 con 94,5:']},{t:"tab",w:[2e3,2819,2e3,2819],rows:[{h:1,sec:0,c:[[["Sabato","b"]],[["Linea","b"]],[["Sabato","b"]],[["Linea","b"]]]},{h:0,sec:0,c:[["31/10"],["94,5"],["26/12"],["96,4 (feste)"]]},{h:0,sec:0,c:[["7/11"],["94,7"],["2/1"],["96,6 (feste)"]]},{h:0,sec:0,c:[["14/11"],["95,0"],["9/1"],["96,8 (feste)"]]},{h:0,sec:0,c:[["21/11"],["95,2"],["16/1"],["97,1"]]},{h:0,sec:0,c:[["28/11"],["95,4"],["23/1"],["97,3"]]},{h:0,sec:0,c:[["5/12"],["95,7"],["30/1"],["97,5"]]},{h:0,sec:0,c:[["12/12"],["95,9"],["6/2"],["97,8"]]},{h:0,sec:0,c:[["19/12"],["96,1"],["13/2"],["98,0"]]}]},{t:"h2",x:"Alla verifica della domenica, in quest'ordine"},{t:"p",r:["t = trend arrotondato a 2 decimali. Corridoio normale 0,10-0,30; quello dal 31/1, se il 17/1 scatta la riga 5-bis, \xE8 scritto nella riga 5-bis."]},{t:"tab",w:[800,8838],rows:[{h:1,sec:0,c:[[["#","b"]],[["Controllo","b"]]]},{h:0,sec:0,c:[["1"],["Feste: dal 21/12 al 10/1 nessuna verifica e nessun cambio di gradino."]]},{h:0,sec:0,c:[["2"],["Freno: se \xE8 scattato e l'hai confermato, resti al Mantenimento e ti fermi qui. Se dopo il freno hai scelto tu un gradino pi\xF9 alto, da quel giorno in poi, si continua con i punti 3-7 da quel gradino."]]},{h:0,sec:0,c:[["3"],["Girovita: se la media degli ultimi 3 sabati validi \xE8 pi\xF9 alta d
